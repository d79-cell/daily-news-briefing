<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日新闻简报 · 在线展示</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#1f2937; --sub:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent-soft:#dbeafe;
    --warn:#b45309; --tag:#eef2ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px;
       -webkit-text-size-adjust:100%;text-size-adjust:100%;
       overflow-wrap:anywhere;word-break:break-word}
  header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:18px 24px;
         display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header h1{margin:0;font-size:20px;font-weight:700}
  header .latest{font-size:13px;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:999px}
  .cal-toggle{display:none;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);
              color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
  .wrap{max-width:1100px;margin:0 auto;padding:20px;display:grid;grid-template-columns:320px 1fr;gap:20px}
  @media(max-width:820px){
    .wrap{grid-template-columns:1fr;padding:12px;gap:14px}
    header{padding:14px 16px}
    header h1{font-size:18px}
    header .latest{font-size:12px;padding:3px 10px}
    .cal-toggle{display:inline-block}
    aside.panel{display:none}
    aside.panel.open{display:block}
    .panel{padding:14px}
    #content h1{font-size:20px}
    #content h2{font-size:17px;margin:18px 0 8px}
    #content h3{font-size:15px}
    #content{font-size:15px;line-height:1.75}
    #content blockquote{font-size:13px}
    .day{font-size:14px;min-height:44px}
    .days{gap:6px}
    .weekdays div{font-size:12px;padding:4px 0}
    .hint{font-size:12px}
  }
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head button{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;
                   cursor:pointer;font-size:16px;color:var(--ink)}
  .cal-head button:disabled{opacity:.35;cursor:not-allowed}
  .cal-title{font-weight:700;font-size:15px}
  .weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .weekdays div{text-align:center;font-size:12px;color:var(--sub);padding:6px 0}
  .day{aspect-ratio:1/1;min-height:42px;display:flex;align-items:center;justify-content:center;font-size:13px;
       border-radius:9px;background:#f9fafb;color:#9ca3af;border:1px solid transparent}
  .day.has{background:var(--accent-soft);color:var(--accent);font-weight:700;cursor:pointer;border-color:#bfdbfe}
  .day.has:hover{background:#bfdbfe}
  .day.sel{outline:3px solid var(--accent);outline-offset:-3px}
  .day.blank{background:transparent}
  .hint{font-size:12px;color:var(--sub);margin-top:12px;line-height:1.5}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:8px;flex-wrap:wrap}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  #content h1{font-size:22px;margin:0 0 4px}
  #content h2{font-size:18px;margin:22px 0 8px;padding-left:10px;border-left:4px solid var(--accent);color:#1e3a8a}
  #content h3{font-size:15px;margin:14px 0 4px}
  #content blockquote{background:var(--tag);border-left:4px solid var(--accent);margin:8px 0;padding:10px 14px;
                     border-radius:0 8px 8px 0;color:var(--sub);font-size:13px}
  #content ul,#content ol{margin:6px 0;padding-left:22px}
  #content a{color:var(--accent);word-break:break-all}
  #content a.readlink{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
                      padding:3px 14px;border-radius:999px;font-size:13px;margin-left:4px;word-break:normal}
  #content a.readlink:active{background:#1d4ed8}
  #content .meta{font-size:13px;color:var(--sub)}
  #content hr{border:none;border-top:1px dashed var(--line);margin:18px 0}
  .badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--accent-soft);
         color:var(--accent);margin-left:6px;font-weight:600}
  .empty{color:var(--sub);padding:40px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>📰 每日新闻简报 · 在线展示</h1>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button class="cal-toggle" id="calToggle">📅 日历</button>
    <div class="latest">最新一期：2026-11-22</div>
  </div>
</header>
<div class="wrap">
  <aside class="panel">
    <div class="cal-head">
      <button id="prev" title="上一月">‹</button>
      <div class="cal-title" id="calTitle"></div>
      <button id="next" title="下一月">›</button>
    </div>
    <div class="weekdays">
      <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
    </div>
    <div class="days" id="days"></div>
    <div class="legend">
      <span><i style="background:var(--accent-soft);border:1px solid #bfdbfe"></i>有简报</span>
      <span><i style="background:#fff;outline:2px solid var(--accent)"></i>当前查看</span>
    </div>
    <div class="hint">点击日历中高亮日期，可浏览对应日期的往期简报；主页默认展示最新一期。</div>
  </aside>
  <main class="panel">
    <div id="content"></div>
  </main>
</div>
<script>
const BRIEFINGS = {"2026-10-08": "<h1>每日新闻简报 · 2026-10-08（星期四）</h1>\n<blockquote>\n<p>覆盖时段：过去 24 小时（2026-10-07 ~ 10-08）｜共 10 条\n关注领域：国际国内大事 · 教育 · 舆论热点（热搜）· 电子产品 · 达州本地（政治/民生/教育）\n可信度分级：★★★ 官方权威（央媒/政府官网）｜★★ 主流媒体（转载/综合）｜★ 待核实</p>\n</blockquote>\n<hr />\n<h2>一、国际国内大事</h2>\n<h3>1. 国庆假期全社会跨区域人员流动量超 21 亿人次，返程客流达峰值</h3>\n<ul>\n<li><strong>来源</strong>：交通运输部 / 川观新闻、央视新闻</li>\n<li><strong>时间</strong>：2026-10-07 至 10-08</li>\n<li><strong>要点</strong>：交通运输部数据显示，今年国庆假期（中秋国庆拼假连休）全社会跨区域人员流动量预计达 <strong>21.44 亿人次</strong>，同比增长 0.7%；10 月 7 日为全国铁路返程客流最高峰。假期跨省游占比 53%，同比提升 2 个百分点。</li>\n<li><strong>可信度</strong>：★★★</li>\n<li><strong>链接</strong>：<a href=\"https://cbgc.scol.com.cn/news/8033042\" target=\"_blank\" rel=\"noopener\">cbgc.scol.com.cn/…</a></li>\n</ul>\n<h3>2. 中东局势持续升级：沙特两机场遭袭致 3 死 36 伤，霍尔木兹海峡紧张，IMF 预警高油价延续至 2027 年</h3>\n<ul>\n<li><strong>来源</strong>：央视新闻 / 腾讯新闻、搜狐（每日经济新闻）</li>\n<li><strong>时间</strong>：2026-10-07</li>\n<li><strong>要点</strong>：沙特阿拉伯民航总局称，艾卜哈国际机场与利雅得哈立德国王国际机场 6—7 日遭袭，共致 3 死 36 伤；也门胡塞武装称过去 24 小时向沙特主导联军目标发射 11 枚弹道导弹。伊朗革命卫队称将关闭霍尔木兹海峡\"非法航道\"；一艘油轮在卡塔尔附近海域被击中并有人员伤亡。IMF 总裁表示，即使海湾战事很快结束，<strong>高油价仍将持续至 2027 年</strong>。</li>\n<li><strong>可信度</strong>：★★★（主体为央视/新华社通报）</li>\n<li><strong>链接</strong>：<a href=\"https://news.qq.com/rain/a/20261008A02BC200\" target=\"_blank\" rel=\"noopener\">news.qq.com/…</a></li>\n</ul>\n<h3>3. 2026 年诺贝尔化学奖揭晓：表彰不对称有机合成研究</h3>\n<ul>\n<li><strong>来源</strong>：央视新闻 / 瑞典皇家科学院</li>\n<li><strong>时间</strong>：2026-10-07</li>\n<li><strong>要点</strong>：瑞典皇家科学院宣布，将 2026 年诺贝尔化学奖授予科学家 <strong>亨利·B·卡甘（Henri B. Kagan）</strong> 和 <strong>硖合宪三（Kenso Soai）</strong>，以表彰他们发现不对称有机合成中的<strong>非线性效应和自催化现象</strong>。两人将平分 1200 万瑞典克朗奖金（约合 802 万元人民币）。</li>\n<li><strong>可信度</strong>：★★★</li>\n<li><strong>链接</strong>：<a href=\"https://news.qq.com/rain/a/20261008A02BHB00\" target=\"_blank\" rel=\"noopener\">news.qq.com/…</a></li>\n</ul>\n<hr />\n<h2>二、教育</h2>\n<h3>4. 教育部负责人就《教育发展\"十五五\"规划》答记者问</h3>\n<ul>\n<li><strong>来源</strong>：教育部 / 咸宁市教育局转载</li>\n<li><strong>时间</stron /ul>\n<h3>3. 中央纪委国家监委连打两\"虎\"，领导干部依法办事情况法治督察启动</h3>\n<ul>\n<li><strong>来源</strong>：央视新闻《早啊！新闻来了》／腾讯新闻《早!10-15》／澎湃新闻《看世界·新闻早知道》</li>\n<li><strong>时间</strong>：2026-10-14</li>\n<li><strong>要点</strong>：</li>\n<li>四川省成都市人大常委会原党组书记、主任包惠严重违纪违法被开除党籍；中国科学院科技创新发展中心原党委副书记、主任伍浩严重违纪违法被\"双开\"。检察机关依法对湖南省人大常委会原党组成员、副主任叶红专涉嫌受贿案提起公诉。</li>\n<li>经党中央批准，中央依法治国办启动领导干部依法办事情况法治督察，组建 8 个督察组，对河北、黑龙江、福建、山东、西藏、陕西、青海、新疆 8 省（区）及新疆生产建设兵团开展实地督察，为期 10 天。</li>\n<li><strong>可信度</strong>：★★★★★（中央纪委国家监委、中央依法治国办公开发布）</li>\n<li><strong>原文链接</strong>：<a href=\"https://news.qq.com/rain/a/20261015A02NWT00\" target=\"_blank\" rel=\"noopener\">news.qq.com/…</a></li>\n</ul>\n<h3>4. 胡塞武装称击中一架沙特战机；美军称在阿曼湾摧毁与伊朗关联帆船</h3>\n<ul>\n<li><strong>来源</strong>：央视新闻《国际新闻早知道》</li>\n<li><strong>时间</strong>：2026-10-14 至 2026-10-15 凌晨</li>\n<li><strong>要点</strong>：也门胡塞武装 15 日凌晨称击中一架沙特\"台风\"战斗机，并于 14 日晚称使用弹道导弹袭击沙特首都利雅得的哈立德国王国际机场，称\"精准命中目标\"；沙特主导联军被指 24 小时内对也门胡塞控制区发动 42 次空袭。美中央司令部称 10 月 6 日在阿曼湾摧毁一艘与伊朗有关联、正在监视美舰的独桅帆船；伊朗革命卫队称已做好应对任何新侵略的准备。另：泽连斯基称乌克兰卢茨克市遭袭致 6 死 13 伤。</li>\n<li><strong>可信度</strong>：★★★☆☆（交战各方单方面发布，<strong>请核对原文</strong>）</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.toutiao.com/article/7696648602537509376/\" target=\"_blank\" rel=\"noopener\">www.toutiao.com/…</a></li>\n</ul>\n<hr />\n<h2>二、教育</h2>\n<h3>5. 2026 年银龄讲学计划启动：义务教育阶段招募 6000 名退休教师</h3>\n<ul>\n<li><strong>来源</strong>：教育部办公厅、财政部办公厅《关于做好 2026 年银龄讲学计划有关实施工作的通知》／湖北省教育厅／正义网《一周记要》</li>\n<li><strong>时间</strong>：2026-10-14 前后</li>\n<li><strong>要点</strong>：教育部、财政部联合部署 2026 年银龄讲学计划，义务教育阶段计划招募银龄讲学教师 6000 名，主要面向脱贫县、欠发达民族县、革命老区县、边境县及新疆生产建设兵团团场，重点向国家乡村振兴重点帮扶县倾斜。申请者以校长、教研员、特级教师、骨干教师为主，年龄一般 65 岁（含）以下。义务教育阶段讲学教师工作经费由中央和地方财政按年人均 2 万元标准共同分担；服务期间人事关系与退休待遇不变。湖北计划招募 1025 名（全国第二）。</li>\n<li><strong>可信度</strong>：★★★★★（部委正式通知）</li>\n<li><strong>原文链接</strong>：<a href=\"https://jyt.hubei.gov.cn/bmdt/gxhptlm/mtjj/202610/t20261014_6032336.shtml\" target=\"_blank\" rel=\"noopener\">jyt.hubei.gov.cn/…</a></li>\n<li><strong>关联</strong>：教育部 10 月 14 日在河北雄安成立<strong>雄安教师发展中心</strong>，整合北京市中小学和高校优质资源，打造集教研培训、数智赋能、研究引领于一体的新型教师发展平台；首批北京雄安两地 10 所中小学结对，并启动首批组团式教师轮岗实训。</li>\n<li>来源：央视新闻（腾讯新闻转载）<a href=\"https://news.qq.com/rain/a/20261014A08GG700\" target=\"_blank\" rel=\"noopener\">news.qq.com/…</a></li>\n<li>可信度：★★★★★</li>\n<li><strong>另注</strong>：针对\"禁止教师用 AI 备课\"传言，央视报道指出系<strong>误读</strong>——山东、云南、黑龙江等地相继出台的是对教师使用 AI 工具的<strong>规范细化要求</strong>，并非禁止。（来源：腾讯新闻《早!10-15》，可信度 ★★★★☆）</li>\n</ul>\n<hr />\n<h2>三、舆论热点（热搜）</h2>\n<h3>6. 中国香港周生生珠宝劫案登微博热搜首位</h3>\n<ul>\n<li><strong>来源</strong>：中国基金报（网易号转载）</li>\n<li><strong>时间</strong>：2026-10-14 事件，2026-10-15 报道</li>\n<li><strong>要点</strong>：中国香港大埔广福道一间金行 10 月 14 日下午遭一名年约 40 岁男子佯装顾客抢走一条约值 7 万港元的金链后夺门而逃，警方暂列为\"盗窃\"案追缉中，周生生方面回应已交由警方处理。10 月 13 日中国香港上水广场亦发生手法相似的金店被劫案，涉事男子已被制服。</li>\n<li><strong>可信度</strong>：★★★☆☆（转载内容，<strong>请核对原文</strong>）</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.163.com/dy/article/L986TU8Q0530NLC9.html\" target=\"_blank\" rel=\"noopener\">www.163.com/…</a></li>\n</ul>\n<h3>7. \"红果短剧降智\"冲上热搜，医生回应</h3>\n<ul>\n<li><strong>来源</strong>：四川观察（今日头条转载），引中国蓝新闻、潮新闻</li>\n<li><strong>时间</strong>：2026-10-15 凌晨</li>\n<li><strong>要点</strong>：话题 #红果短剧降智# 冲上热搜，不少网友称刷完高密度反转短剧后\"脑子变迟钝、一刷就停不下来\"。浙江中医药大学附属第二医院临床心理科副主任邹莹回应：短剧密集反转钩子持续刺激多巴胺，令大脑被动兴奋、超负荷运转，高频消耗后多巴胺储备透支，导致专注与理解能力暂时变差，<strong>并非真的智商下降</strong>。第三方数据：2026 年 8 月红果短剧日均使用时长约 125 分钟。</li>\n<li><strong>可信度</strong>：★★★★☆（媒体采访专业人士，但话题本身为网友讨论）</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.toutiao.com/article/7696572565581496874/\" target=\"_blank\" rel=\"noopener\">www.toutiao.com/…</a></li>\n</ul>\n<hr />\n<h2>四、电子产品</h2>\n<h3>8. 苹果收盘市值首次突破 5 万亿美元</h3>\n<ul>\n<li><strong>来源</strong>：IT之家（新浪财经转载）</li>\n<li><strong>时间</strong>：2026-10-15（数据为 10-14 美股收盘）</li>\n<li><strong>要点</strong>：苹果公司 10 月 14 日美股收盘市值首次站上 5 万亿美元（约合 33.53 万亿元人民币），成为继英伟达后全球第二家达此里程碑的公司，股价收于 342.96 美元、单日涨 0.5%。该里程碑出现在科技股普遍下跌的交易日（甲骨文跌 8.83%，Meta 跌 3.27%，英伟达跌 3.16%），苹果逆势收涨。苹果将于 11 月 2 日发布 2026 财年第四财季财报。</li>\n<li><strong>可信度</strong>：★★★★☆（专业科技媒体，数据可查证）</li>\n<li><strong>原文链接</strong>：<a href=\"https://finance.sina.cn/tech/2026-10-15/detail-inivhawt8146100.d.html\" target=\"_blank\" rel=\"noopener\">finance.sina.cn/…</a></li>\n<li><strong>关联</strong>：苹果 iPhone Duo 折叠屏国行版（型号 A3721）新增搭载大模型备案编号——Apple 智能、通义万相、通义千问三款；Apple Watch 睡眠呼吸暂停功能 10 月 14 日凌晨通过 OTA 上线（已获国家药监局二类医疗器械批准生效，支持 Series 9/Ultra 2/SE 3 及后续表款）。（来源：IT之家，可信度 ★★★★☆）</li>\n</ul>\n<h3>9. 小米澎湃 OS 4 今日起推送正式版；小米 Vision GT 今日入驻《GT7》</h3>\n<ul>\n<li><strong>来源</strong>：IT之家（凤凰网科技转载）</li>\n<li><strong>时间</strong>：2026-10-15 起</li>\n<li><strong>要点</strong>：小米澎湃 OS 4 正式版自 10 月 15 日起陆续分批次推送升级，首批覆盖 Xiaomi 17 系列、REDMI K100 Pro 系列等机型，后续逐步拓展至更多存量机型；REDMI 产品经理胡馨心透露 K100 系列将马上推送首批正式版。另：小米汽车宣布 10 月 15 日 14 点，Xiaomi Vision GT 正式入驻《Gran Turismo 7》，成为游戏史首台中国 Vision GT 概念车（全球第 51 款）。</li>\n<li><strong>可信度</strong>：★★★★☆（专业科技媒体）</li>\n<li><strong>原文链接</strong>：<a href=\"https://tech.ifeng.com/c/8xDXuzpQQ1m\" target=\"_blank\" rel=\"noopener\">tech.ifeng.com/…</a></li>\n<li><strong>关联</strong>：豆包手机助手的《屏幕自动化操作声明协议》30 天公示期结束，已明确拒绝授予屏幕自动化操作权限的应用约 150 款，涵盖快手、美团、阿里、腾讯、滴滴、拼多多、Kimi、DeepSeek、小红书、三大运营商及多家银行等。（来源：豆包手机助手官方／网易科技，可信度 ★★★☆☆）</li>\n</ul>\n<hr />\n<h2>五、达州本地（政治·民生·教育）</h2>\n<h3>10. 2027 年度达州城乡居民医保集中缴费 10 月 16 日启动</h3>\n<ul>\n<li><strong>来源</strong>：达州市医保/税务部门（成都本地宝整理）</li>\n<li><strong>时间</strong>：集中征缴期 2026-10-16 至 2027-01-31</li>\n<li><strong>要点</strong>：2027 年度达州市城乡居民基本医疗保险费集中征缴工作已启动。集中征缴期为 2026 年 10 月 16 日至 2027 年 1 月 31 日；个人缴费标准维持每人每年 400 元，财政补助标准提升 24 元至每人每年 724 元。缴费渠道：关注\"达州税务\"微信公众号、微信\"城市服务—四川社保缴纳\"、支付宝\"市民中心—社保\"、银行代收、职工医保个人账户代缴（亲情账户）、医保钱包缴费，或到参保地办税服务厅现场办理。特殊人群资助：特困人员、孤儿、重度残疾人等个人缴费部分全额资助；低保对象及符合条件的防止返贫致贫对象资助 300 元/人/年，个人仅缴 100 元；达州市登记落户的新生儿（出生 90 天内参保）当年度个人缴费部分由财政全额补助。<strong>未在集中缴费期内参保或未连续参保的，将设置待遇等待期，请及时缴费。</strong></li>\n<li><strong>可信度</strong>：★★★★☆（部门政策，建议以\"达州税务\"公众号为准）</li>\n<li><strong>原文链接</strong>：<a href=\"https://cd.bendibao.com/live/20261014/215122.shtm\" target=\"_blank\" rel=\"noopener\">cd.bendibao.com/…</a></li>\n</ul>\n<h3>📌 达州附注</h3>\n<ul>\n<li><strong>政治</strong>：中国共产党达州市第六次代表 pener\">www.zj.chinanews.com/…</a></li>\n</ul>\n<h3>3. 欧洲多国示威演变为骚乱，法国多地实施局部宵禁；俄方称大规模打击基辅</h3>\n<ul>\n<li><strong>来源</strong>：央视新闻、新华社（搜狐《看世界·新闻早知道》2026.10.20）</li>\n<li><strong>时间</strong>：2026-10-19</li>\n<li><strong>要点</strong>：法国、意大利、葡萄牙、比利时等国 17 日起爆发示威，抗议生活成本高企、公共服务不足、教育资源短缺与财政紧缩，法意部分城市演变为严重骚乱。法国内政部长努内兹称部分地区警方\"对局面失去控制\"，总理勒科尔尼宣布启动\"大规模司法行动\"，19 日晚起多地将实施局部宵禁。同日俄国防部称使用陆基高精度武器和远程无人机对基辅市及基辅州军工企业、导弹与无人机储存设施、数据处理中心实施大规模打击；乌方称基辅一数据中心遭袭。</li>\n<li><strong>可信度</strong>：★★★☆☆（<strong>突发事件与军事消息，各方口径不一，请核对原文</strong>）</li>\n<li><strong>原文</strong>：<a href=\"https://www.sohu.com/a/1089941853_121107000\" target=\"_blank\" rel=\"noopener\">www.sohu.com/…</a></li>\n</ul>\n<h3>4. 医保钱包 2.0 全国上线：个人账户可跨省共济近亲属</h3>\n<ul>\n<li><strong>来源</strong>：国家医保局（央视新闻，新浪财经转载 2026.10.20）</li>\n<li><strong>时间</strong>：2026-10-16 起全国上线，10-19 集中报道</li>\n<li><strong>要点</strong>：医保钱包迭代至 2.0 版，自 10 月 16 日起各省、自治区、直辖市及新疆生产建设兵团全部上线运行，个人账户资金跨省共济给近亲属在全国全面落地。共济用途由就医购药扩展到城乡居民基本医保、长期护理保险的参保缴费；共济对象严格限定为近亲属，额度不可再次共济。</li>\n<li><strong>可信度</strong>：★★★★★（国家医保局发布）</li>\n<li><strong>原文</strong>：<a href=\"https://finance.sina.com.cn/wm/2026-10-20/doc-inivvhfz6666017.shtml\" target=\"_blank\" rel=\"noopener\">finance.sina.com.cn/…</a></li>\n</ul>\n<hr />\n<h2>二、教育</h2>\n<h3>5. 教育部等七部门印发《特殊教育发展提升\"十五五\"行动计划》</h3>\n<ul>\n<li><strong>来源</strong>：教育部等七部门（教基〔2026〕9 号，经国务院同意）</li>\n<li><strong>时间</strong>：文件 2026-08-27 印发，2026-10-19 各地集中转发落实</li>\n<li><strong>要点</strong>：到 2030 年，适龄残疾儿童义务教育入学率巩固在 97% 以上，基本形成特殊教育优质融合普惠发展格局。实施新一轮特教学校标准化建设工程，支持人口 20 万以上县（市、区、旗）办好一所达标特教学校，鼓励建设十五年一贯制特校；全面落实\"一人一案\"教育安置，坚持就近就便、应融尽融；分类推进残疾青少年高中阶段教育，支持中高职与职业本科衔接贯通培养。</li>\n<li><strong>可信度</strong>：★★★★★（七部门正式文件）</li>\n<li><strong>原文</strong>：<a href=\"https://www.gswuwei.gov.cn/art/2026/10/19/art_93_1690324.html\" target=\"_blank\" rel=\"noopener\">www.gswuwei.gov.cn/…</a></li>\n</ul>\n<h3>6. 教育部：全国推行每周至少半天校外实践教学</h3>\n<ul>\n<li><strong>来源</strong>：教育部（国务院新闻办发布会披露）；澎湃新闻评论《校外实践不能止于\"到此一游\"》</li>\n<li><strong>时间</strong>：2026-10-19</li>\n<li><stro TIysHTkwIUgze1WLInWmX5261022.shtml\">纪念中国工农红军长征胜利 90 周年大会在京隆重举行，习近平发表重要讲话</a></h3>\n<ul>\n<li><strong>来源</strong>：央视新闻 / 新华社 / 中国政府网</li>\n<li><strong>时间</strong>：2026-10-22</li>\n<li><strong>要点</strong>：纪念中国工农红军长征胜利 90 周年大会 22 日上午在北京人民大会堂隆重举行，中共中央总书记、国家主席、中央军委主席习近平发表重要讲话，强调\"铭记历史方能开创未来\"，号召大力弘扬伟大长征精神、走好新的长征路。李强、赵乐际、王沪宁、蔡奇、丁薛祥、李希、韩正出席，赵乐际主持。当晚电视文艺晚会《长征颂歌》在中央广播电视总台播出。</li>\n<li><strong>可信度</strong>：高（党和国家重大时政，央视/新华社权威发布）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://news.cctv.com/2026/10/22/ARTIysHTkwIUgze1WLInWmX5261022.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>2. <a href=\"https://ysxw.cctv.cn/article.html?item_id=13172845277719257700\">西藏那曲市巴青县发生 7.0 级地震，国家自然灾害救助四级响应启动</a></h3>\n<ul>\n<li><strong>来源</strong>：央视新闻 / 应急管理部 / 那曲市抗震救灾指挥部</li>\n<li><strong>时间</strong>：2026-10-22 22:33 发生，10-23 持续核报</li>\n<li><strong>要点</strong>：中国地震台网测定，10 月 22 日 22 时 33 分西藏那曲市巴青县（北纬 32.40°、东经 93.79°）发生 7.0 级地震，震源深度 10 公里，为今年以来我国最大地震。截至 10 月 23 日 5 时 20 分，那曲市抗震救灾指挥部统计已造成 16 人遇难、46 人受伤（重伤 11 人、轻伤 35 人），房屋倒塌及受损 339 户、牲畜棚圈受损 20 座；早期央视报道曾为 18 人遇难。西藏自治区启动地震灾害二级、自然灾害救助三级应急响应，国家防减救灾委、应急管理部启动国家自然灾害救助四级应急响应，中央救灾物资已运抵灾区。</li>\n<li><strong>可信度</strong>：高（地震参数官方测定）；伤亡统计口径不一（16 遇难/46 伤 vs 18 遇难），请核对权威通报</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://ysxw.cctv.cn/article.html?item_id=13172845277719257700\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>3. <a href=\"https://new.qq.com/rain/a/20261023A02G9Q00\">全球股市遭遇\"黑色星期四\"：A 股科技板块集体大跌，AI 龙头股\"连锁强平\"传闻不实</a></h3>\n<ul>\n<li><strong>来源</strong>：上观新闻《早读》/ 证券时报 / 陆家嘴财经早餐</li>\n<li><strong>时间</strong>：2026-10-22 收盘，10-23 报道</li>\n<li><strong>要点</strong>：10 月 22 日全球股市走弱，A 股三大指数集体下挫，沪指跌 1.48%、深成指跌 2.96%、创业板指跌 4.37%（较 6 月历史高点跌幅已超 40%），全市场近 5000 只个股下跌；香港恒生指数跌超 3%，日经 225 跌 2.65%，德国、法国股指跌超 1%，美股纳斯达克跌 2.6%。网传\"部分 AI 龙头股发生大额强制平仓产生连锁反应\"，经证券时报核实为不实信息，深市仅个别股票小额平仓（不足十万元），新易盛、中际旭创等多家公司盘后回应生产经营正常。</li>\n<li><strong>可信度</strong>：高（权威财经媒体核实，强平传闻已辟谣）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://new.qq.com/rain/a/20261023A02G9Q00\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>4. <a href=\"https://news.qq.com/rain/a/20261023A02HY300\">中东局势持续紧张：美以拟再打击伊朗、沙特机场再遭袭，埃博拉疫情蔓延非洲多国</a></h3>\n<ul>\n<li><strong>来源</strong>：央视新闻 / 新华社 / 陆家嘴财经早餐</li>\n<li><strong>时间</strong>：2026-10-21 至 23</li>\n<li><strong>要点</strong>：① 据美媒，美国和以色列军方已制定在美国中期选举结束后再次打击伊朗的具体计划，目标可能包括能源与核设施，但特朗普是否批准尚不确定；伊朗方面称已做好应对全面战争准备。② 沙特阿拉伯民航总局 22 日凌晨声明，达曼法赫德国王国际机场 21 日晚遭袭击，造成 1 人死亡、8 人受伤；连日来利雅得、达曼等地机场与重要设施持续遭导弹和无人机袭击，中国驻沙特使领馆提醒在沙中国公民提高安全防范。③ 刚果（金）本轮埃博拉疫情截至 10 月 19 日累计确诊 9637 例、死亡 4646 例，已蔓延至肯尼亚、尼日利亚。各方进展仍具不确定性。</li>\n<li><strong>可信度</strong>：中（主流媒体综合，战事与打击计划请核对原文）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://news.qq.com/rain/a/20261023A02HY300\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>二、教育（固定 10 条 · 国家 5 / 省 3 / 市 2）</h2>\n<h3>5. <a href=\"https://www.moe.gov.cn/\">教育部等部署全国大中小学生同上一堂纪念长征胜利 90 周年\"思政大课\"</a></h3>\n<ul>\n<li><strong>来源</strong>：教育部、中央网信办、人民日报社</li>\n<li><strong>时间</strong>：2026-10-23 起播出</li>\n<li><strong>要点</strong>：为落实中国工农红军长征胜利 90 周年纪念活动部署，教育部、中央网信办、人民日报社联合开设全国大中小学生同上一堂纪念长征胜利 90 周年\"思政大课\"，主题为\"一代人有一代人的长征\"。大学课程自 10 月 23 日起在人民日报客户端全天滚动播出，后续可在国家智慧教育公共服务平台收看，各地正组织大中小学生集中或自主收看学习。</li>\n<li><strong>可信度</strong>：高（教育部等三部门联合部署）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://www.moe.gov.cn/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>6. <a href=\"https://www.moe.gov.cn/\">教育部：我国高校未来技术学院初步涌现一批人才培养成果</a></h3>\n<ul>\n<li><strong>来源</strong>：教育部 / 新华社</li>\n<li><strong>时间</strong>：2026-10-22 16:29</li>\n<li><strong>要点</strong>：新华社报道，教育部介绍我国高校未来技术学院建设进展，已初步涌现一批人才培养成果，在集成电路、人工智能、量子科技等前沿领域探索交叉融合育人模式，服务高水平科技自立自强与新质生产力培育。</li>\n<li><strong>可信度</strong>：高（教育部发布，新华社刊发）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://www.moe.gov.cn/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>7. <a href=\"https://www.civte.edu.cn/info/1080/3756.htm\">教育部职业教育发展中心公布 2026 年度新一代智能技术产教融合促进项目入选名单</a></h3>\n<ul>\n<li><strong>来源</strong>：教育部职业教育发展中心</li>\n<li><strong>时间</strong>：2026-10-21</li>\n<li><strong>要点</strong>：教育部职业教育发展中心会同小米通讯技术有限公司组织专家审核，共遴选 2026 年度新一代智能技术产教融合促进项目 110 个（其中应用创新项目 35 个、人才培养项目 71 个、出海项目 4 个）并予以公布。小米将与各入选单位对接签约，项目工作组将对实施过程开展指导与绩效跟踪。</li>\n<li><strong>可信度</strong>：高（教育部职业教育发展中心通告，含文号教职中心〔2026〕26 号）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://www.civte.edu.cn/info/1080/3756.htm\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>8. <a href=\"https://news.cctv.com/edu/\">第十九届\"振兴杯\"全国青年职业技能大赛决赛在杭州开赛</a></h3>\n<ul>\n<li><strong>来源</strong>：共青团中央、人力资源社会保障部 / 央视网教育</li>\n<li><strong>时间</strong>：2026-10-21</li>\n<li><strong>要点</strong>：第十九届\"振兴杯\"全国青年职业技能大赛决赛在杭州开赛，赛事分学生组和职工组，聚焦先进制造业发展，新增服务机器人应用技术员、数字化解决方案设计师等四个竞赛项目，引导青年走技能成才、技能报国之路。</li>\n<li><strong>可信度</strong>：高（团中央、人社部主办，央视报道）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://news.cctv.com/edu/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>9. <a href=\"https://news.sciencenet.cn/htmlnews/2026/10/573446.shtm\">\"能源强国·电亮未来\"育人共同体在京成立，打通教育人才产业创新四链</a></h3>\n<ul>\n<li><strong>来源</strong>：中国科学报 / 科学网（教育部思想政治工作司出席）</li>\n<li><strong>时间</strong>：2026-10-22 报道（10-20 成立）</li>\n<li><strong>要点</strong>：由华北电力大学和国家电网有限公司共同发起的新时代\"能源强国·电亮未来\"育人共同体在北京成立，首批 80 家成员单位（50 所高校、30 家行业企业及科研机构）参加。教育部思政司表示，打造重点行业育人共同体是推动立德树人\"一号工程\"落地、助力强国建设的重要举措，共同体发布\"国之大者\"思想铸魂等五大育人行动。</li>\n<li><strong>可信度</strong>：高（教育部思政司参与，中国科学报报道）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://news.sciencenet.cn/htmlnews/2026/10/573446.shtm\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>10. <a href=\"https://www.sceea.cn/Html/202610/Newsdetail_4986.html\">四川省 2027 年普通高校招生网上报名缴费进行中：10 月 22 日—11 月 4 日</a></h3>\n<ul>\n<li><strong>来源</strong>：四川省高等教育招生考试委员会 / 四川省教育考试院</li>\n<li><strong>时间</strong>：2026-10-22 9:00 至 11-04 17:00（每日 9:00—22:00）</li>\n<li><strong>要点</strong>：四川 2027 年普通高考报名注册时间为 10 月 17 日—11 月 3 日；网上报名和缴费同步进行，10 月 22 日 9:00 至 11 月 4 日 17:00，考生登录\"一网通办\"平台（ks.sceea.cn）完成注册、实人认证、填报与缴费；艺体类统考报名同时进行。拟申报录取照顾政策及各类专项计划的考生须本人在报名时主动申报。</li>\n<li><strong>可信度</strong>：高（四川省教育考试院官方通知）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://www.sceea.cn/Html/202610/Newsdetail_4986.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>11. <a href=\"https://www.dzrm.cn/cms/a/492053839/content\">四川省 2026 年成人高考顺利结束，成绩预计 11 月 12 日公布</a></h3>\n<ul>\n<li><strong>来源</strong>：四川省教育考试院 / 达州融媒</li>\n<li><strong>时间</strong>：2026-10-18 考试结束，10-23 整理发布</li>\n<li><strong>要点</strong>：历时两天的四川省 2026 年成人高校招生全国统一考试于 10 月 18 日下午结束，后续将开展试卷扫描与评阅工作，考试成绩预计于 11 月 12 日公布。达州融媒\"搜索快报\"同步梳理了前三季度 GDP、达州\"敬老月\"、高新区农产品交易中心等本地动态。</li>\n<li><strong>可信度</strong>：高（四川省教育考试院发布）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://www.dzrm.cn/cms/a/492053839/content\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>12. <a href=\"https://www.toutiao.com/article/7699618679035068982/\">四川高校毕业生创业、灵活就业专属扶持政策：创业补贴、贴息贷款、社保补贴</a></h3>\n<ul>\n<li><strong>来源</strong>：早安达州（达州融媒）/ 四川省人社部门</li>\n<li><strong>时间</strong>：2026-10-23</li>\n<li><strong>要点</strong>：@四川高校毕业生，创业、选择灵活就业可申领专属扶持政策，包括创业补贴、创业担保贴息贷款、灵活就业社保补贴等，为毕业生职业之路添砖加瓦。该政策经达州融媒\"早安达州\"整理发布，具体申领条件与流程以各地人社部门公布为准。</li>\n<li><strong>可信度</strong>：中（本地新闻产品整理转载，申领细节请核对人社部门原文）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://www.toutiao.com/article/7699618679035068982/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>13. <a href=\"https://www.dazhou.gov.cn/news-show-272524.html\">达州：农村地区\"一老一小\"免费接种流感疫苗，义务教育中小学生纳入接种对象</a></h3>\n<ul>\n<li><strong>来源</strong>：达州市人民政府 / 达州市卫健委</li>\n<li><strong>时间</strong>：2026-10-21 起全面启动</li>\n<li><strong>要点</strong>：根据国家疾控局、教育部等八部门统一部署，达州已全面启动 2026—2027 流行季农村地区\"一老一小\"流感疫苗免费接种，接种对象为农村地区（乡镇和村）65 周岁及以上老年人和义务教育阶段中小学生，接种三价流感病毒裂解疫苗，遵循\"先到先接、额满即止\"。学生需携带身份证或户口簿及预防接种证前往门诊登记。</li>\n<li><strong>可信度</strong>：高（达州市政府网发布）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://www.dazhou.gov.cn/news-show-272524.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>14. <a href=\"https://www.dazhou.gov.cn/news-show-272424.html\">达州 2027 年度城乡居民医保缴费启动：个人 400 元、财政补助 724 元</a></h3>\n<ul>\n<li><strong>来源</strong>：达州市医疗保障局 / 达州市人民政府</li>\n<li><strong>时间</strong>：集中征缴 2026-10-16 至 2027-01-31</li>\n<li><strong>要点</strong>：达州市 2027 年度城乡居民基本医疗保险参保缴费已启动，筹资标准 1124 元（个人缴费 400 元，与上年持平；人均财政补助 724 元，较上年提高 24 元），可通过电子税务局、微信、支付宝、银行代收、职工个人账户代缴、医保钱包等 7 种渠道办理。特殊群体（特困、孤儿、重度残疾人等）个人缴费部分全额或定额资助；学生儿童随家庭参保，新生儿出生 90 天内参保个人缴费由户籍地财政全额补助。</li>\n<li><strong>可信度</strong>：高（达州市政府网 / 市医保局发布）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://www.dazhou.gov.cn/news-show-272424.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>三、舆论热搜（2 条）</h2>\n<h3>15. <a href=\"https://news.qq.com/rain/a/20261022A023MF00\">#宝马员工争着离职挤崩系统# 登热搜第一：计划削减 8000 岗位，离职补偿最高约 487 万元</a></h3>\n<ul>\n<li><strong>来源</strong>：腾讯新闻《早读》/ 微博热搜</li>\n<li><strong>时间</strong>：2026-10-22 至 23</li>\n<li><strong>要点</strong>：#宝马员工争着离职挤崩系统# 话题登上热搜第一。报道称宝马计划在 2027 年底前削减 8000 个白领岗位，部分员工获得的离职补偿金额最高可达 65 万欧元（现汇率约合 487.6 万元人民币），引发员工争抢离职、内部系统一度被挤崩。具体裁员规模与补偿方案请以宝马公司官方公告为准。</li>\n<li><strong>可信度</strong>：待核实（热搜话题，裁员与补偿细节以公司公告为准，请核对原文）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://news.qq.com/rain/a/20261022A023MF00\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>16. <a href=\"https://news.qq.com/rain/a/20261022A023MF00\">星巴克中国 10 月 22 日起全国实行\"消费入座\"新规引发热议</a></h3>\n<ul>\n<li><strong>来源</strong>：腾讯新闻《早读》/ 星巴克中国</li>\n<li><strong>时间</strong>：2026-10-22 起实施</li>\n<li><strong>要点</strong>：星巴克中国宣布，自 10 月 22 日起在全国门店实行\"消费入座\"新规，未消费顾客将每隔约 10 分钟被店员提醒，消费后不限制入座时长，此前星巴克曾回应\"不属实\"随后宣布施行。新规引发公众对\"是否变相驱赶非消费顾客\"的广泛讨论。</li>\n<li><strong>可信度</strong>：中（以星巴克官方说明为准）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://news.qq.com/rain/a/20261022A023MF00\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>四、电子产品（2 条）</h2>\n<h3>17. <a href=\"https://www.ithome.com/blog/\">华为鸿蒙 HarmonyOS 装机量突破 1 亿台，HarmonyOS 7 超空间存储/内存技术详解</a></h3>\n<ul>\n<li><strong>来源</strong>：IT之家</li>\n<li><strong>时间</strong>：2026-10-23</li>\n<li><strong>要点</strong>：IT之家消息，奇妙工具箱数据显示华为鸿蒙 HarmonyOS 操作系统装机量突破 1 亿台（约 1.02 亿台），余承东此前预计到今年冬季前破亿。华为同步详解 HarmonyOS 7 方舟引擎新突破：超空间内存技术提升内存压缩率、应用保活率；超空间存储技术对不同 App 间相同文件无感去重、全盘只留一份源文件。</li>\n<li><strong>可信度</strong>：中（IT之家报道，以华为官方公告为准）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://www.ithome.com/blog/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>18. <a href=\"https://news.mydrivers.com/blog/\">iPhone Duo 今日全球首销（15999 元起），英伟达推出 AI 工厂运维平台 Minerva</a></h3>\n<ul>\n<li><strong>来源</strong>：快科技 / IT之家</li>\n<li><strong>时间</strong>：2026-10-23</li>\n<li><strong>要点</strong>：① iPhone Duo 于 10 月 23 日迎来全球首销，起售价 15999 元；美国零售店设巨型模型造势，官网发货已排至明年 1 月，国内需线上下单、到店取机，多地直营店首发配额预售阶段即被抢空，黄牛加价幅度由高位回落至约 3000 元，苹果在美/中/新等多市场实施每人限购 2 台。② 英伟达推出 AI 工厂运维平台 Minerva，可每小时分析数十亿个数据点、识别异常并预测故障，配备原生 AI 助手支持自然语言查询集群健康。</li>\n<li><strong>可信度</strong>：中（快科技/IT之家报道，销量与加价以官方及渠道为准）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://news.mydrivers.com/blog/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>五、达州本地（政治 · 民生，2 条）</h2>\n<h3>19. <a href=\"https://www.dzrm.cn/cms/a/492530920/content\">达州市六届人大一次会议今日（10/23）选举闭幕，\"两会\"收官；党代会精神宣讲进基层</a></h3>\n<ul>\n<li><strong>来源</strong>：达州融媒 / 达州市人大</li>\n<li><strong>时间</strong>：2026-10-22 主席团第四次会议，10-23 大会选举</li>\n<li><strong>要点</strong>：达州市第六届人民代表大会第一次会议于 10 月 19—23 日召开，10 月 22 日下午主席团举行第四次会议，表决通过市六届人大常委会、市人民政府领导班子及法检\"两长\"正式候选人名单，同意将名单提请大会全体会议选举，并表决通过各项报告决议草案；大会将于 10 月 23 日选举闭幕，达州市\"两会\"随之收官。连日来，达州多支宣讲队伍下沉田间地头、产业一线，推动市第六次党代会精神走进基层、深入人心。</li>\n<li><strong>可信度</strong>：高（达州融媒官方报道）</li>\n</ul>\n<p>原文链接：<a class=\"readlink\" href=\"https://www.dzrm.cn/cms/a/492530920/content\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>20. <a href=\"https://www.dzrm.cn/cms/a/491938768/content\">达州民生速览：今日\"职引未来·金秋送岗\"招聘会落地达川，以旧换新增十大品类达城热销</a></h3>\n<ul>\n<li><strong>来源</strong>：达州融媒 / 达州市人社局</li>\n<li><strong>时间</strong>：2026-10-23</li>\n<li><strong>要点</strong>：① 2026 年达川区·高新区\"金秋招聘月\"暨\"职引未来\"高校毕业生招聘会于 10 月 23 日 9:00—16:00 在达川区万达开人力资源产业园举办，精选近 70 家本土企业，岗位覆盖 放谈判进展——总统称最高领袖已授权政府就和平谈判\"一定权力\"，外长称若美方履约相关方案\"最快两天内启动\"。但霍尔木兹海峡复航仍须以接受伊朗条件为前提，国际海事组织尚无法确认水雷清除。\n原文链接：<a class=\"readlink\" href=\"https://k.sina.com.cn/article_1699432410_654b47da02001xlra.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h2>二、教育（固定 10 条 · 国家 5 / 省 3 / 市 2）</h2>\n<h3>5. 教育部举办第四届全国大学生职业规划大赛（2026.10—2027.4，重庆主办） [高]</h3>\n<p><strong>来源</strong>：教育部（moe.gov.cn）｜<strong>时间</strong>：2026-10\n<strong>要点</strong>：大赛由教育部、重庆市人民政府共同主办，全国总决赛由重庆市教委、重庆大学、重庆师范大学承办；设成长、就业两赛道，以赛促学、促教、促就，全力促进高校毕业生高质量充分就业。\n原文链接：<a class=\"readlink\" href=\"https://www.moe.gov.cn/srcsite/a15/s7063/202610/t20261010_1453481.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>6. 教育部实施\"职业教育助力服务业扩能提质\"工作方案（8 大领域、92 名院士参与） [高]</h3>\n<p><strong>来源</strong>：教育部 / 中宏网｜<strong>时间</strong>：2026-10\n<strong>要点</strong>：方案优先选择产能规模大、民生需求急迫、技能人才紧缺的 8 个重点领域（技术配套、仓储物流、软件数据、重大工程等），系统推进专业、课程、教材、教师、实习实训改革；采用\"学校+企业+行业\"集群推进，71 所高水平学校、91 家头部企业、36 家行业协会联合实施。\n原文链接：<a class=\"readlink\" href=\"http://www.macrochina.cn/news_speed/hgjj/20261013125515.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>7. 教育部职发中心：职业院校教师教学能力提升专题培训班（11 月 17 日首期） [高]</h3>\n<p><strong>来源</strong>：教育部职业教育发展中心（civte.edu.cn）｜<strong>时间</strong>：2026-11\n<strong>要点</strong>：聚焦职业院校教师教学综合能力与数字素养，首期 11 月 17—20 日在浙江机电职业技术大学举办；内容含政策解读、要素实践、现场教学与 AI 技术应用案例研讨，计 24 学时。\n原文链接：<a class=\"readlink\" href=\"https://www.civte.edu.cn/5.guanyuzuzhikaizhanzhiyeyuanxiaojiaoshijiaoxuenenglijisuyangtishengzhuantipeixunbandetongzhi-zhejiangjidianzhiyejishudaxue.pdf\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>8. 2026 版职业教育专业目录增补 27 个本专科专业，2027 年招生 [中]</h3>\n<p><strong>来源</strong>：环球网 / 网易｜<strong>时间</strong>：2026-11-02\n<strong>要点</strong>：教育部主导的 2026 年《职业教育专业目录》增补完成，新增 27 个本专科专业（高职专科 9 个、职业本科 18 个），覆盖数字经济、低空经济、人工智能、高端装备等方向，将于 2027 年正式招生。\n原文链接：<a class=\"readlink\" href=\"https://www.163.com/dy/article/LAOR1L720514R9OJ.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>9. 教育部部署 2027 届高校毕业生\"金秋启航\"校园招聘月（9—11 月） [高]</h3>\n<p><strong>来源</strong>：教育部 / 经济日报｜<strong>时间</strong>：2026-09 至 11 月\n<strong>要点</strong>：为促进 2027 届毕业生顺利就业，9 月至 11 月集中开展\"金秋启航\"校园招聘月；深入实施\"万企进校园\"，分区域分行业开展\"千校万企\"\"千行万业\"供需对接，对脱贫、低保、零就业及残疾等重点群体\"一人一档\"帮扶、原则上每人至少推荐 3 个有效岗位。\n原文链接：<a class=\"readlink\" href=\"https://www.jingjiribao.cn/static/detail.jsp?id=687291\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>10. 四川省 2027 年普通高校招生报名进行中，11 月 4 日 17:00 截止 [高]</h3>\n<p><strong>来源</strong>：四川省教育考试院（sceea.cn）｜<strong>时间</strong>：2026-10-22 至 11-04\n<strong>要点</strong>：四川 2027 年高考报名分注册、网报和缴费三环节；网报与缴费同步进行，时间 10 月 22 日—11 月 4 日每日 9:00—22:00，资格申报须于 11 月 4 日 17:00 前完成，逾期无效。艺体类统考报名同步进行。\n原文链接：<a class=\"readlink\" href=\"https://www.sceea.cn/Html/202610/Newsdetail_4986.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>11. 四川省 2026 下半年中小学教师资格考试（面试）报名公告，11 月 6 日起网报 [高]</h3>\n<p><strong>来源</strong>：四川省教育考试院（sceea.cn）｜<strong>时间</strong>：2026-11-06 至 11-09\n<strong>要点</strong>：面试定于 12 月 5—6 日进行；网上报名 11 月 6 日 10:00 至 11 月 9 日 17:00，网上审核 11 月 7—10 日，缴费截止 11 月 11 日 24:00，准考证 11 月 30 日起打印，报考费 280 元/生。\n原文链接：<a class=\"readlink\" href=\"https://www.sceea.cn/Html/202610/Newsdetail_4995.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>12. 四川省 2027 年普通高考网上报名操作指南发布 [高]</h3>\n<p><strong>来源</strong>：四川省教育考试院（sceea.cn）｜<strong>时间</strong>：2026-10\n<strong>要点</strong>：指南详解访问入口（官网/一网通办平台 ks.sceea.cn/支付宝小程序）、注册登录、实人认证、电子签名与缴费全流程，提醒\"一证一号\"、尽早完成认证、缴费后信息锁定不可更改、选考科目报名后不可更改等要点。\n原文链接：<a class=\"readlink\" href=\"https://www.sceea.cn/Html/202610/Newsdetail_4988.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>13. 达州市 2026 年中小学（幼儿园）秋假安排：11 月 4—6 日，连休 5 天 [高]</h3>\n<p><strong>来源</strong>：达州融媒 / 达州教育｜<strong>时间</strong>：2026-11-04 至 11-08\n<strong>要点</strong>：秋假 11 月 4 日（周三）—6 日（周五），与周末衔接形成连休；实施范围含全市幼儿园、义务教育阶段、普高高一高二，中职参照。学校原则上不布置书面作业，严禁以托管名义集体补课、讲授新课，为确有需要学生提供公益托管。\n原文链接：<a class=\"readlink\" href=\"https://www.dzrm.cn/cms/a/488558675/content\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>14. 达州高中滨江中学建设加快推进，预计明年投用、新增 2400 个优质学位 [中]</h3>\n<p><strong>来源</strong>：达州融媒（dzrm.cn）｜<strong>时间</strong>：2026-11\n<strong>要点</strong>：作为通川区重大民生工程，达高中滨江中学 7 个单体全面铺开，总体进度达 40%，1 号教学楼本月底主体封顶；总建筑面积 5.68 万㎡、48 个教学班，建成后将新增 2400 个普通高中学位，补齐主城学位短板。\n原文链接：<a class=\"readlink\" href=\"https://www.dzrm.cn/cms/a/491673298/content\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h2>三、舆论热搜</h2>\n<h3>15. 英雄联盟 S15 全球总决赛激战，LPL 迎战 T1 引爆热搜 [中]</h3>\n<p><strong>来源</strong>：微博实时热搜（s.weibo.com）｜<strong>时间</strong>：2026-11-02\n<strong>要点</strong>：2026 英雄联盟全球总决赛（S15）进入淘汰赛关键阶段，\"T1 大概率抽到 LPL\"\"CFO 对战 T1\"等话题连续登顶热搜；樊振东观战西班牙国家德比等跨界话题联动发酵，电竞赛事与体育娱乐热度叠加。\n原文链接：<a class=\"readlink\" href=\"https://s.weibo.com/top/summary?Refer=top_hot&amp;topnav=1&amp;wvr=6\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>16. \"老干妈日销售额从万元跌至千元\"引热议 [待核实·请核对原文]</h3>\n<p><strong>来源</strong>：微博热搜（s.weibo.com）｜<strong>时间</strong>：2026-11-02\n<strong>要点</strong>：相关话题登上微博热搜，引发关于传统调味品牌经营承压与消费变迁的讨论。该数据为网络流传口径，未见企业官方确认，引用前请核对原文与权威信源。\n原文链接：<a class=\"readlink\" href=\"https://s.weibo.com/top/summary?Refer=top_hot&amp;topnav=1&amp;wvr=6\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h2>四、电子产品</h2>\n<h3>17. 苹果发布 2026 财年第四财季财报：全年营收 4788 亿美元创纪录 [中·请核对原文]</h3>\n<p><strong>来源</strong>：陆家嘴财经早餐 / 华尔街见闻｜<strong>时间</strong>：2026-11-02\n<strong>要点</strong>：苹果 2026 财年 Q4 营收 1144.8 亿美元（同比 +12%，创九月季度纪录），净利润 307.1 亿美元；全财年营收 4788 亿美元、净利润 1321.75 亿美元均创纪录，大中华区营收 175.4 亿美元同比 +21%。iPhone 营收 +17.5%，iPad 同比 -10.4%。\n原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MjM5ODQ4MjgyMQ==&amp;mid=2651354532&amp;idx=3&amp;sn=76cfc08628aea4ec1568754093cd046a&amp;chksm=bca519eab60a789cd2be221cc3744912ddb25169d203b98f94add5419222c60ff2c69a8f6e17#rd\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>18. 苹果本周拟连发三天新品；DRAM 内存价格出现倒挂 [中·请核对原文]</h3>\n<p><strong>来源</strong>：IT之家 / 微博热搜｜<strong>时间</strong>：2026-11-02\n<strong>要点</strong>：古尔曼爆料苹果或本周连续三天发布新品（周一 OLED iPad mini、周二 M6 芯片 iMac、周三触控屏 MacBook Pro），属爆料口径待证；同期\"内存条有价无市\"\"内存价格出现倒挂\"登微博热搜，反映 DRAM 供应偏紧、渠道价格异动，具体幅度以市场报价为准。\n原文链接：<a class=\"readlink\" href=\"https://ithome.com\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h2>五、达州本地（政治·民生·教育）</h2>\n<h3>19. 达州实施\"民生优先\"战略 办好群众身边实事 [高]</h3>\n<p><strong>来源</strong>：达州融媒（dzrm.cn）｜<strong>时间</strong>：2026-11-02\n<strong>要点</strong>：市第六次党代会明确大力实施\"民生优先\"发展战略。达川区将高层二次供水储水设施清洗消毒纳入年度民生实事，对城区 72 套设施全覆盖\"摸底建档、清单销号\"；开江县讲治镇补点提标场镇消火栓、推进安全宣传\"最后一米\"，把民生答卷写在群众家门口。\n原文链接：<a class=\"readlink\" href=\"https://www.dzrm.cn/cms/a/493540897/content\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>20. 达州东部经开区三大民生工程\"跑起来\"：安置房、停车场、治水提速 [中]</h3>\n<p><strong>来源</strong>：达州融媒 / 今日头条｜<strong>时间</strong>：2026-11-02\n<strong>要点</strong>：东部经开区统筹推进民生项目：职教新区安置房二期砌体进度达 70%（建成可提供 1008 套）；社会停车场一标段主体完成七成（可停 110 余台、集成公交首末站与客运站）；同步推进治水等配套设施，倒排工期抢抓施工黄金期。\n原文链接：<a class=\"readlink\" href=\"https://www.toutiao.com/article/7703453228746228265\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<p><strong>核查提示</strong>：以上信息源自公开权威媒体与官方平台，引用或转发前请务必核对原文与发布时间。对标注「中·请核对原文」「待核实」的内容（含美伊局势、财报数据、苹果新品爆料、老干妈销售额等），因涉及转载、爆料或口径不一，请以原始发布方最新通报为准。</p>", "2026-11-04": "<h1>每日新闻简报（2026-11-04）</h1>\n<blockquote>\n<p>抓取时间：2026-11-04 07:20（过去 24 小时）｜五大方向：国际国内大事 / 教育 / 舆论热搜 / 电子产品 / 达州本地政治·民生·教育\n本简报坚持「可溯源、不传谣、分级标注」。可信度分级：<strong>高</strong>（官方/权威媒体）、<strong>中</strong>（主流媒体转载/爆料待证）、<strong>待核实</strong>（匿名/二手/口径不一，请核对原文）。突发、军事、转载或口径不一内容均标注「请核对原文」。</p>\n</blockquote>\n<h2>一、国际国内大事</h2>\n<h3>1. 央行上调外汇存款准备金率 2 个百分点，稳汇率信号明确 [高]</h3>\n<p><strong>来源</strong>：央视新闻（ysxw.cctv.cn）／中国人民银行｜<strong>时间</strong>：2026-11-03\n<strong>要点</strong>：为平衡外汇市场供求、防范汇率短期超调风险，中国人民银行决定自 11 月 15 日起上调金融机构外汇存款准备金率 2 个百分点，由现行 4% 提高到 6%；这是近五年来首次上调，将冻结约 200 亿—250 亿美元外汇流动性，释放\"保持人民币汇率在合理均衡水平基本稳定\"的政策信号。\n原文链接：<a class=\"readlink\" href=\"https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&amp;item_id=12600547250069961789&amp;channelId=1119\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>2. 2026 世界互联网大会乌镇峰会开幕，李强出席并发表主旨演讲 [高]</h3>\n<p><strong>来源</strong>：中国新闻网浙江／新华社｜<strong>时间</strong>：2026-11-03\n<strong>要点</strong>：2026 年世界互联网大会乌镇峰会 11 月 3 日在浙江乌镇开幕，设置 27 个分论坛，议题涵盖全球治理倡议网络空间合作、机器人与具身智能等前沿方向；李强总理提出\"人与机器\"关系之辨、\"算法模型\"伦理之思、\"数实融合\"安全之虞、\"数智鸿沟\"公平之治四大关注，强调让机器成为人类\"可信的工具\"、反对构筑\"数字铁幕\"。\n原文链接：<a class=\"readlink\" href=\"https://www.zj.chinanews.com/jzkzj/2026-11-04/detail-ihfmttrw8660318.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>3. 全国放心消费平台\"消费查\"正式上线，首批超万个消费单元入驻 [高]</h3>\n<p><strong>来源</strong>：市场监管总局／央视新闻（腾讯要闻转载）｜<strong>时间</strong>：2026-11-03\n<strong>要点</strong>：市场监管总局建设全国放心消费平台 11 月 3 日正式上线，消费者可搜索\"消费查\"小程序或线下扫码登录，平台根据定位自动展示周边放心消费商家；美团外卖、淘宝闪购、京东外卖等已接入，首批超一万个消费单元入驻，集成放心消费培育全流程。\n原文链接：<a class=\"readlink\" href=\"https://news.qq.com/rain/a/20261104A02X3500\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>4. 俄美乌三方会谈定于 11 月 10—11 日在阿布扎比举行，中东霍尔木兹局势仍紧 [中·请核对原文]</h3>\n<p><strong>来源</strong>：央视新闻｜<strong>时间</strong>：2026-11-03\n<strong>要点</strong>：俄罗斯总统新闻秘书证实，俄、美、乌三方谈判将于 11 月 10—11 日在阿联酋阿布扎比举行；同日俄乌代表或先期在白宫会谈。但中东方向仍高度敏感：美官员称对伊朗格什姆岛发动\"小规模攻击\"并宣称控制霍尔木兹海峡，伊方称防御准备处于最高级别、谈判尚未达成新进展，联合国呼吁保障航道自由。相关军事表态口径不一，请核对原文。\n原文链接：<a class=\"readlink\" href=\"https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&amp;item_id=12600547250069961789&amp;channelId=1119\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h2>二、教育（固定 10 条 · 国家 5 / 省 3 / 市 2）</h2>\n<h3>5. 教育部等六部门部署高校\"传承红色基因 走好青春长征路\"宣传教育 [高]</h3>\n<p><strong>来源</strong>：教育部（教思政厅函〔2026〕23 号）／法治日报｜<strong>时间</strong>：2026-11-02（官网公开）\n<strong>要点</strong>：教育部办公厅、中央党史和文献研究院、退役军人事务部、全国总工会、共青团中央、全国妇联联合印发通知，要求年底前各高校开展不少于 2 场主题活动，围绕纪念长征胜利 90 周年与学习贯彻党的二十届五中全会精神，组织\"重走长征路\"实践研学、云上校史馆、长征主题思政大课等，构建\"部—省—校\"联动宣讲矩阵。\n原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzAwNTYwOTkzMg==&amp;mid=2456497015&amp;idx=1&amp;sn=1e2ec917a8277605fea0384486bf4ed3&amp;chksm=8d69d5f8d91f66f10ca70aeb5adb866e471df264a2aed31631dd14360eb6494595008ce4f5b8#rd\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>6. 教育部推进人工智能赋能教师 wOTkzMg==&amp;mid=2456497015&amp;idx=1&amp;sn=1e2ec917a8277605fea0384486bf4ed3&amp;chksm=8d69d5f8d91f66f10ca70aeb5adb866e471df264a2aed31631dd14360eb6494595008ce4f5b8#rd\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>10. 四川省 2027 年普通高考报名今日（11 月 4 日）17:00 截止 [高]</h3>\n<p><strong>来源</strong>：四川省教育考试院（sceea.cn）｜<strong>时间</strong>：2026-10-22 至 11-04\n<strong>要点</strong>：四川 2027 年高考网上报名及缴费时间为 10 月 22 日—11 月 4 日每日 9:00—22:00，所有拟申请录取照顾政策、报考专项计划、公费师范生、优师计划等类型的考生，须于 11 月 4 日 17:00 前在系统内完成报名资格申报，逾期视为自愿放弃。艺体类统考报名同步进行。\n原文链接：<a class=\"readlink\" href=\"https://www.sceea.cn/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>11. 四川 2026 年 11 月考试招生月历发布（教资 / 学考 / 书画 / 四六级口试 / 美术统考） [高]</h3>\n<p><strong>来源</strong>：四川省教育考试院（达州融媒转载）｜<strong>时间</strong>：2026-11\n<strong>要点</strong>：月历要点：11 月 6—9 日 2026 年下半年中小学教师资格考试；11 月 13—17 日 2027 年 1 月普通高中学业水平合格性考试；11 月 14 日省书法水平测试；11 月 21—22 日省书画等级考试与全国大学英语四、六级考试口试；11 月 28—29 日 2027 年省美术与设计类专业统考。\n原文链接：<a class=\"readlink\" href=\"https://www.dzrm.cn/cms/a/493503751/content\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>12. 四川考生注意：下半年中小学教师资格考试（笔试）成绩 11 月 6 日 10:00 可查 [高]</h3>\n<p><strong>来源</strong>：教育部教育考试院（ntce.neea.edu.cn）｜<strong>时间</strong>：2026-11-06 发布\n<strong>要点</strong>：教育部教育考试院将于 2026 年 11 月 6 日 10:00 发布今年下半年中小学教师资格考试（笔试）成绩，考生可登录中小学教师资格考试网站（<a href=\"http://ntce.neea.edu.cn\" target=\"_blank\" rel=\"noopener\">ntce.neea.edu.cn/…</a>）查询；四川考生请留意查分与后续面试报名节点。\n原文链接：<a class=\"readlink\" href=\"https://ntce.neea.edu.cn/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>13. 达州市 2026 年中小学（幼儿园）秋假时间确定：11 月 4 日—6 日 [高]</h3>\n<p><strong>来源</strong>：达州融媒网（dzrm.cn）／达州市教育局｜<strong>时间</strong>：2026-11-04 至 11-06\n<strong>要点</strong>：达州市 2026 年秋假为 11 月 4 日—6 日（周三至周五），与周末连休共 5 天；实施范围为全市幼儿园、义务教育阶段学校、普通高中高一高二年级，中职参照执行。各地各校须提供公益性托管、严禁以托管名义集体补课或违规收费，原则上不布置书面家庭作业。\n原文链接：<a class=\"readlink\" href=\"https://www.dzrm.cn/cms/a/488558675/content\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>14. 达州：落实市第六次党代会部署，推动生活性服务业转型升级提质增效 [中]</h3>\n<p><strong>来源</strong>：达州融媒\"早安达州\"｜<strong>时间</strong>：2026-11-04\n<strong>要点</strong>：市第六次党代会提出促进服务业优质高效发展。达州一手抓实商圈载体培育、激活消费新引擎，一手抓牢服务能力提升、夯实民生根基，在扩内需、惠民生中推动服务业转型升级、扩能提质，为全市高质量发展持续注入新动能。\n原文链接：<a class=\"readlink\" href=\"https://www.163.com/dy/article/LASCSKGQ05568W0A.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h2>三、舆论热搜</h2>\n<h3>15. 女生刷到\"另一个自己\"竟是失散 20 年双胞胎姐妹（四川达州） [高]</h3>\n<p><strong>来源</strong>：微博热搜（榜首）／抖音热榜｜<strong>时间</strong>：2026-11-04\n<strong>要点</strong>：四川达州一名 20 岁女孩在刷短视频时，意外发现与自己长相、体态甚至牙齿都高度相似的女孩，经核实两人竟是失散 20 年的双胞胎姐妹，于女孩 20 岁生日通过短视频相认。平台推荐算法客观上促成了这场亲人重聚，事件引发广泛热议。\n原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzAxMDY0NDgwMA==&amp;mid=2650308582&amp;idx=1&amp;sn=bdb9617f683dc838e480a065d857699b&amp;chksm=82e7034ee863da1e89d7470b58e19c2c0cebe9ec75c4832c44adb0a8fe14c641b407cf502faa#rd\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>16. iPhone 天气 App 显示下周五 -32℃ 离谱预报，苹果客服称疑为系统 Bug [中]</h3>\n<p><strong>来源</strong>：微博热搜／百度热点｜<strong>时间</strong>：2026-11-04\n<strong>要点</strong>：11 月 4 日凌晨大量 iPhone 用户发现自带天气软件出现数据异常，多地显示下周五气温低至 -32℃，与前后日期十几度形成极端温差；苹果客服回应暂未接到大批反馈，推测为系统 Bug。基础工具类应用数据准确度直接关系日常出行，大面积异常引发对系统稳定性的质疑。\n原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzAxMDY0NDgwMA==&amp;mid=2650308582&amp;idx=1&amp;sn=bdb9617f683dc838e480a065d857699b&amp;chksm=82e7034ee863da1e89d7470b58e19c2c0cebe9ec75c4832c44adb0a8fe14c641b407cf502faa#rd\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h2>四、电子产品</h2>\n<h3>17. 苹果 Apple 智能国行版官宣落地：接入阿里千问，今日随 iOS 27.3 开发者 Beta 开放测试 [高]</h3>\n<p><strong>来源</strong>：IT之家／苹果中国官网｜<strong>时间</strong>：2026-11-04\n<strong>要点</strong>：苹果中国官网上线 Apple 智能介绍页面，国行版正式接入阿里千问，11 月 4 日随 iOS 27.3 首个开发者预览版开放测试；阿里巴巴表示国行用户可自主选择是否开通千问集成功能。首批核心功能含 AirPods 实时翻译、iPhone 联手千问实现更多本地智能能力。\n原文链接：<a class=\"readlink\" href=\"https://www.ithome.com/0/436/885.htm\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>18. 苹果推送 iOS 27.3 首个测试版：待机显示下放 iPhone 11+、Siri 开放\"应用技能\" [中]</h3>\n<p><strong>来源</strong>：IT之家（MacRumors／9to5Mac 综合）｜<strong>时间</strong>：2026-11-04\n<strong>要点</strong>：iOS 27.3 首个 Beta 带来多项更新：将 iPhone Duo 的\"待机显示\"（StandBy）下放至 iPhone 11 及后续机型；向第三方开发者开放 Siri AI 的\"应用技能\"（App Skills），可一句话串联多步骤跨应用任务；并为折叠屏 iPhone Duo 加入横向移屏便捷访问改善单手操作。公开测试版预计数日内推出、正式版计划 12 月上线。\n原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=Mzk0MTY0OTg1NQ==&amp;mid=2247494152&amp;idx=1&amp;sn=397d60306a74e1d54c2b436df3c0a66a&amp;chksm=c3749713491910e458b2501a2484bf8bcee619d7c1422217bd23d68240b0571ce99fc89ceb38#rd\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h2>五、达州本地政治·民生</h2>\n<h3>19. 达州：贯彻落实市第六次党代会精神，一手抓商圈培育、一手抓服务惠民 [中]</h3>\n<p><strong>来源</strong>：达州融媒\"早安达州\"｜<strong>时间</strong>：2026-11-04\n<strong>要点</strong>：达州深入贯彻落实市第六次党代会部署，促进服务业优质高效发展——一手抓实商圈载体培育、激活消费新引擎，一手抓牢服务能力提升、夯实民生根基，在扩内需与惠民生协同中推动服务业转型升级，为全市高质量发展注入新动能（与第 14 条教育秋假、第 15 条热搜同属达州本地脉络）。\n原文链接：<a class=\"readlink\" href=\"https://www.163.com/dy/article/LASCSKGQ05568W0A.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>20. 达州火车站部分列车始发终到站调整至成都龙泉驿站，秋假加开 2 对列车 [中]</h3>\n<p><strong>来源</strong>：中国铁路成都局达州车务段（达州融媒\"早安达州\"）｜<strong>时间</strong>：2026-11-03\n<strong>要点</strong>：自 10 月 30 日起成都龙泉驿站正式开通运营，经由达州火车站的部分列车始发终到站由成都西站变更为成都龙泉驿站；为满足秋假旅客出行需求，达州火车站加开 2 对列车，补强成都、重庆方向运能，缓解购票压力，保障旅客便捷畅通出行。\n原文链接：<a class=\"readlink\" href=\"https://www.163.com/dy/article/LASCSKGQ05568W0A.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>", "2026-11-05": "<h1>每日新闻简报（2026-11-05）</h1>\n<blockquote>\n<p>抓取时间：2026-11-05 07:20（过去 24 小时）｜五大方向：国际国内大事 / 教育 / 舆论热搜 / 电子产品 / 达州本地政治·民生·教育\n本简报坚持「可溯源、不传谣、分级标注」。可信度分级：<strong>高</strong>（官方/权威媒体）、<strong>中</strong>（主流媒体转载/爆料待证）、<strong>待核实</strong>（匿名/二手/口径不一，请核对原文）。突发、军事、转载或口径不一内容均标注「请核对原文」。</p>\n</blockquote>\n<h2>一、国际国内大事</h2>\n<h3>1. 第九届进博会今日（11 月 5 日）在上海开幕，境外参展企业首破 4100 家 [高]</h3>\n<p><strong>来源</strong>：央视新闻（ysxw.cctv.cn）／经济日报财经早餐｜<strong>时间</strong>：2026-11-05\n<strong>要点</strong>：第九届中国国际进口博览会 11 月 5 日至 10 日在上海举行，整体展览展示面积首次突破 44 万平方米，4142 家境外企业参展，世界 500 强和行业龙头企业首次超过 300 家，162 个国家、地区和国际组织参会；作为全球企业\"用脚投票\"中国市场的温度计，利好跨境电商、免税与物流板块。\n原文链接：<a class=\"readlink\" href=\"https://news.qq.com/rain/a/20261105A0356600\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>2. A 股三大指数强势反弹，央行下调股票回购增持再贷款利率至 1% [高]</h3>\n<p><strong>来源</strong>：经济日报财经早餐／中国人民银行｜<strong>时间</strong>：2026-11-04\n<strong>要点</strong>：11 月 4 日 A 股午后放量上攻，沪指涨 2.16%、深成指涨 4.22%、创业板指涨 6.40%，沪深京三市成交额超 2 万亿元；中国人民银行同日宣布，自 11 月 4 日起下调股票回购增持再贷款利率 0.25 个百分点至 1%，银行已报送额度申请超 2000 亿元，释放明确托底资本市场信号。\n原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MjM5NjEyMzYxMg==&amp;mid=2657818857&amp;idx=1&amp;sn=57902e0e91161d35a13614349980e86a&amp;chksm=bcafc2c9314fa31181081969057d2f00f27b2efbc74eeded14adabf0ea71803f5a4d339d0ecd#rd\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>3. 美国中期选举民主党夺回国会参众两院控制权 [高]</h3>\n<p><strong>来源</strong>：央视新闻（ysxw.cctv.cn）／新浪财经｜<strong>时间</strong>：2026-11-04\n<strong>要点</strong>：美国多家媒体根据初步计票结果预测，民主党在中期选举中夺得国会参议院、众议院控制权，新一届国会明年 1 月就任；特朗普表示\"绝对愿意接受选举结果，准备与民主党合作\"，其剩余任期料成\"跛脚鸭\"，大范围关税、减税等政策推进将受掣肘（美媒预测口径一致，属权威媒体共识）。\n原文链接：<a class=\"readlink\" href=\"https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&amp;item_id=17141410633081116276&amp;channelId=1119\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>4. 国际局势：美伊对峙升级、霍尔木兹油轮触雷，俄乌美三方会谈定 11.10—11 阿布扎比 [中·请核对原文]</h3>\n<p><strong>来源</strong>：央视新闻《国际新闻早知道》｜<strong>时间</strong>：2026-11-04\n<strong>要点</strong>：伊朗革命卫队称在格什姆岛上空击落一架美军 MQ-1 无人机、4 艘\"违规\"油轮在霍尔木兹海峡南部禁航区触发水雷并起火；美方则称摧毁伊朗一处地空导弹发射器，刻意保持低调。俄罗斯确认俄、美、乌三方会谈将于 11 月 10—11 日在阿联酋阿布扎比举行。相关军事表态各方口径不一，请核对原文。\n原文链接：<a class=\"readlink\" href=\"https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&amp;item_id=8079240509547157743&amp;channelId=1119\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h2>二、教育（固定 10 条 · 国家 5 / 省 3 / 市 2）</h2>\n<h3>5. 教育部等六部门部署高校\"传承红色基因 走好青春长征路\"宣传教育 [高]</h3>\n<p><strong>来源</strong>：教育部（教思政厅函〔2026〕23 号）／腾讯新闻｜<strong>时间</strong>：2026-11-04（通知公开）\n<strong>要点</strong>：教育部办公厅、中央党史和文献研究院、退役军人事务部、全国总工会、共青团中央、全国妇联联合印发通知，要求各高校年底前开展不少于 2 场主题活动，围绕纪念长征胜利 90 周年与学习贯彻二十届五中全会精神，开设\"传承和弘扬长征精神\"全国同上一堂思政大课、云上校史馆、\"校史里的强国印记\"网络文化作品征集。\n原文链接：<a class=\"readlink\" href=\"https://view.inews.qq.com/a/20261104A0CBTX00\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>6. 教育部 2026 年\"百所高校学子地方行\"收官站（长沙）举行，释放岗位 6.3 万余个 [高]</h3>\n<p><strong>来源</strong>：央广网｜<strong>时间</strong>：2026-11-04\n<strong>要点</strong>：教育部\"百校学子地方行\"（长沙站）暨长沙\"双肩包\"人才行动近日举行，为 2027 届\"金秋启航\"校园招聘关键一站；现场 182 家单位提供岗位 7100 余个、达成签约和就业意向 1800 余人，线上 541 家企业提供岗位 1.3 万余个。该活动自 5 月启动已走进 10 城，累计释放岗位 6.3 万余个，旨在搭建校地人才精准对接桥梁。\n原文链接：<a class=\"readlink\" href=\"https://www.cnr.cn/jy/dj/20261104/t20261104_527862397.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>7. 教育部举办 2026 年全国教材管理人员培训班（贵州遵义） [高]</h3>\n<p><strong>来源</strong>：天津市教育委员会（国内教育动态）｜<strong>时间</strong>：2026-11-04\n<strong>要点</strong>：教育部近日在贵州遵义举办 2026 年全国教材管理人员培训班，副部长、总督学王嘉毅出席并讲话，强调抓好《教育强国建设规划纲要（2024—2035 年）》落地，聚焦坚持党对教材工作全面领导、把培根铸魂贯穿课程教材体系、推进各级各类教材创新提质、加强教材全过程全链条管理。各省级教育行政部门、部属及部省合建高校等 300 余人参训。\n原文链接：<a class=\"readlink\" href=\"https://jy.tj.gov.cn/JYXW/GNJY/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>8. 2026 年下半年中小学教师资格考试（笔试）成绩 11 月 6 日 10:00 发布，面试报名同步启动 [高]</h3>\n<p><strong>来源</strong>：教育部新闻办\"微言教育\"／央视《早啊!新闻来了》｜<strong>时间</strong>：2026-11-06 发布\n<strong>要点</strong>：教育部教育考试院将于 11 月 6 日 10:00 发布 2026 年下半年中小学教师资格考试（笔试）成绩，考生可登录中小学教师资格考试网（<a href=\"http://ntce.neea.edu.cn\" target=\"_blank\" rel=\"noopener\">ntce.neea.edu.cn/…</a>）查询；2026 年下半年中小学教师资格考试（面试）报名工作将同步开始，相关考生请留意查分与报名节点。\n原文链接：<a class=\"readlink\" href=\"https://ntce.neea.edu.cn/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>9. 教育部提醒 2027 年高考报名谨防涉考诈骗 [高]</h3>\n<p><strong>来源</strong>：全国教育辟谣平台／教育部｜<strong>时间</strong>：2026-11-04\n<strong>要点</strong>：2027 年普通高校招生考试报名工作已陆续启动，教育部梳理汇总近年来高考报名阶段高发骗局，提醒考生和家长：关键操作由考生本人完成，费用与缴费账户以官方通知为准，不信\"内部补报名\"\"代报名额\"，不点短信异常链接、不向私人账户转账；遇可疑情况第一时间向学校、当地招考机构或公安机关核实。\n原文链接：<a class=\"readlink\" href=\"https://www.163.com/dy/article/LATO4GPT0514CK0I.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>10. 四川 2027 年普通高考报名已于 11 月 4 日 17:00 截止 [高]</h3>\n<p><strong>来源</strong>：四川省教育考试院（sceea.cn）｜<strong>时间</strong>：2026-10-22 至 11-04\n<strong>要点</strong>：四川 2027 年高考网上报名及缴费时间为 10 月 22 日—11 月 4 日每日 9:00—22:00，考生须于 11 月 4 日 17:00 前在系统完成报名资格申报；报名信息须与本人身份证、户口簿一致，错漏将影响考试、志愿填报与录取。错过规定时间的回川参考人员，省考试院将适时组织 1 次补报名，其中艺术类不再补报。\n原文链接：<a class=\"readlink\" href=\"https://www.sceea.cn/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>11. 2026 年 11 月四川考试招生月历出炉 [高]</h3>\n<p><strong>来源</strong>：四川省教育考试院（巴中市教育局官微转载）｜<strong>时间</strong>：2026-11\n<strong>要点</strong>：月历要点：11 月 6—9 日 2026 年下半年中小学教师资格考试；11 月 13—17 日 2027 年 1 月普通高中学业水平合格性考试；11 月 14 日省书法水平测试；11 月 21—22 日省书画等级考试与全国大学英语四、六级考试口试；11 月 28—29 日 2027 年省美术与设计类专业统考（素描 11-28 09:00、速写 14:30、色彩 11-29 09:00）。\n原文链接：<a class=\"readlink\" href=\"https://jyj.cnbz.gov.cn/public/6596351/24026858.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>12. 四川省教育厅转发教育部 2027 高考报名涉考诈骗预警 [高]</h3>\n<p><strong>来源</strong>：四川省教育厅（转载全国教育辟谣）｜<strong>时间</strong>：2026-11-04\n<strong>要点</strong>：针对 2027 年高考报名集中期涉考诈骗冒头，四川省教育厅转发教育部预警，提示考生及家长通过省教育考试院官网（www.sceea.cn）、官方小程序等正规渠道完成报名与缴费，警惕家长群、志愿填报账号散布的\"报名失败\"\"名额紧张\"等不实信息，遇诈骗线索保留证据并立即报警。\n原文链接：<a class=\"readlink\" href=\"https://www.163.com/dy/article/LATO4GPT0514CK0I.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>13. 达州市普通话水平测试站 2026 年 11 月测试公告 [高]</h3>\n<p><strong>来源</strong>：达州市教育局（jyj.dazhou.gov.cn）｜<strong>时间</strong>：2026-11-04 至 11 月下旬\n<strong>要点</strong>：网上报名 11 月 4 日—9 日、网上缴费 11 月 11 日—15 日（中国农业银行 APP），测试时间 11 月下旬，地点为达州市特殊教育学校内（通川区二马路 72 号）。测试站按国家语委最新要求实行\"一人一室\"，考场全程监控、面部声纹识别、随机抓拍；应试须知将于 11 月 18 日前在市教育局官网发布。\n原文链接：<a class=\"readlink\" href=\"https://jyj.dazhou.gov.cn/news-show-10136.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>14. 达州职工业余培训班（达工夜校 2026 第四期）11 月 5 日 9:00 起报名，含\"AI 大模型应用\"班 [中]</h3>\n<p><strong>来源</strong>：达州市总工会／共青团达州市委／达州市妇联（今日头条发布）｜<strong>时间</strong>：2026-11-05 09:00 至 11-06 17:00\n<strong>要点</strong>：达工夜校 2026 第四期设夜班 27 个、周末白班 13 个共 40 个班 732 人，培训 11 月 16 日—2027 年 1 月 9 日，每科 300 元；其中\"AI 大模型及其应用技巧班\"（20 人）贴合智能时代职工技能提升需求，另含无人机操作、手机摄影、短视频拍摄与剪辑等实用科目，面向全市职工。\n原文链接：<a class=\"readlink\" href=\"https://www.toutiao.com/article/7703923005168157227/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h2>三、舆论热搜</h2>\n<h3>15. iPhone 天气 App 显示多地 -32℃ 惊动中国气象局辟谣，实为苹果 Bug 已修复 [中·请核对原文]</h3>\n<p><strong>来源</strong>：抖音热搜／百度热点／金羊网早读｜<strong>时间</strong>：2026-11-05\n<strong>要点</strong>：11 月 4 日凌晨大量 iPhone 用户发现自带天气 App 显示北京、上海等地 11 月 13 日气温骤降至 -32℃，与前后日期温差近 50℃；中国气象局回应\"不属实\"，新华社评其\"离大谱\"，苹果随后修复 Bug。基础工具类软件数据稳定性直接关系公众出行与应急，该异常曾一度引发\"囤物资\"讨论。\n原文链接：<a class=\"readlink\" href=\"https://news.ycwb.com/ikimvjjtko/content_54339212.htm\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>16. 央视曝光\"刷脸打卡日结工资\"新型兼职骗局 [高]</h3>\n<p><strong>来源</strong>：百度热点／央视｜<strong>时间</strong>：2026-11-05\n<strong>要点</strong>：犯罪团伙以\"日结工资\"为诱饵招募求职者进行\"刷脸\"注册，求职者交出身份证件配合 App 实名认证后，身份信息被用于将未实名的虚拟账号\"洗白\"后出售牟利。求职者在找兼职时，面对需提供人脸、身份等核心生物信息的操作须高度警惕，避免成为黑灰产工具人。\n原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzAxMDY0NDgwMA==&amp;mid=2650308591&amp;idx=1&amp;sn=c9e8dfd5212b63fb57650db5fe36a7ba&amp;chksm=8286ecd62debc796211f8114db115a26e2e5d44eb8556d328efeb94f56ac270cf6d18911d767#rd\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h2>四、电子产品</h2>\n<h3>17. 华为小艺 Work 率先上线 openPangu-2.1-Pro 模型，主打\"鸿蒙任务增强\" [高]</h3>\n<p><strong>来源</strong>：IT之家／腾讯新闻｜<strong>时间</strong>：2026-11-05\n<strong>要点</strong>：IT之家实测发现，华为小艺 Work 率先上线 openPangu-2.1-Pro 模型，主打\"鸿蒙任务增强\"，具体参数规格尚无可公开资料；华为云 11 月 1 日公告将于 11 月 6 日停售 openPangu-2.0-Flash 与 2.0-Pro、11 月 30 日正式下线。小艺 Work 目前仍为 Beta 版、需付费（首次 31 天限时免费享 1000 AI 点，体验包连续包月 49 元、标准包 199 元）。\n原文链接：<a class=\"readlink\" href=\"https://news.qq.com/rain/a/20261105A00LHE00\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>18. 苹果收紧员工 AI 使用预算，MacBook Neo 2 出货预期翻倍至 1600 万台 [中]</h3>\n<p><strong>来源</strong>：IT之家（彭博社）／IT 时代网｜<strong>时间</strong>：2026-11-05\n<strong>要点</strong>：彭博社称苹果为遏制 AI 使用成本上涨，将部分工程师每日 AI 支出上限由 300 美元降至 200 美元、部分非工程团队拟压至 25 美元，确有高需求者可向高管申请豁免，折射科技行业从\"鼓励试验\"转向精细核算 ROI。另据供应链消息，苹果给出 2027 年 MacBook Neo 系列 1600 万台出货预估，约今年预期（近 800 万台）的两倍，印证 Neo 2 热度。\n原文链接：<a class=\"readlink\" href=\"https://www.163.com/dy/article/LAV1GDV40511B8LM.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h2>五、达州本地政治·民生</h2>\n<h3>19. 达州：刚柔并济破解停车乱象，让城市治理更有温度 [中]</h3>\n<p><strong>来源</strong>：达州融媒网（dzrm.cn）｜<strong>时间</strong>：2026-11-05\n<strong>要点</strong>：市第六次党代会提出下功夫解决停车、充电等民生难题。达州坚持标本兼治、刚柔并济：扩容停车泊位、配套充电设施补齐硬件短板，推行柔性执法、分类处置优化管理；开江县落实\"首次违停容错提醒、再次违停依法处置\"分级机制，先温馨提示、督促自行整改，逾期不改再依法处置，以\"小切口\"撬动\"大治理\"。\n原文链接：<a class=\"readlink\" href=\"https://www.dzrm.cn/cms/a/493857109/content\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>20. 达州企业学习贯彻市第六次党代会\"工业强市\"蓝图，满产满销冲刺全年目标 [中]</h3>\n<p><strong>来源</strong>：达州融媒\"早安达州\"（新浪财经转载）｜<strong>时间</strong>：2026-11-05\n<strong>要点</strong>：市第六次党代会擘画\"工业强市\"新蓝图。眼下决胜全年目标进入关键期、冲刺期，达州各企业把学习贯彻党代会精神的热情化作赶订单、拓市场、提质效的火热行动，开足马力、满产满销，生产线满负荷运转，以实干实绩为全市高质量发展蓄势赋能。\n原文链接：<a class=\"readlink\" href=\"https://finance.sina.com.cn/roll/2026-11-05/doc-inixrqea8955856.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<blockquote>\n<p>核查提示：以上资讯来自各权威信源实时抓取，突发、军事与口径不一内容已标注\"请核对原文\"。引用或转发前，请点击原文链接核对发布时间与最新进展。教育类已覆盖国家（5）、省（3）、市（2）三级。</p>\n</blockquote>", "2026-11-06": "<h1>每日新闻简报（2026-11-06）</h1>\n<blockquote>\n<p>抓取时间：2026-11-06 07:20（过去 24 小时）｜五大方向：国际国内大事 / 教育 / 舆论热搜 / 电子产品 / 达州本地政治·民生·教育\n本简报坚持「可溯源、不传谣、分级标注」。可信度分级：<strong>高</strong>（官方/权威媒体）、<strong>中</strong>（主流媒体转载/爆料待证）、<strong>待核实</strong>（匿名/二手/口径不一，请核对原文）。突发、军事、转载或口径不一内容均标注「请核对原文」。</p>\n</blockquote>\n<h2>一、国际国内大事</h2>\n<h3>1. 2027 年放假安排公布：春节连休 9 天，调休天数近年最少 [高]</h3>\n<p><strong>来源</strong>：央视新闻（ysxw.cctv.cn）／中新网浙江《一句话看世界》｜<strong>时间</strong>：2026-11-05\n<strong>要点</strong>：国务院办公厅 11 月 5 日发布 2027 年部分节假日安排。其中春节 2 月 5 日（除夕）至 13 日（正月初八）放假调休共 9 天，成为近年最长春节假期；端午、中秋各放假 1 天且不调休，全年调休天数大幅减少，2027 年因此成为\"近年来调休天数最少的年份\"，被普遍解读为对\" zrm.cn）｜<strong>时间</strong>：2026-11-06\n<strong>要点</strong>：市第六次党代会明确提出大力实施\"民生优先\"发展战略。达州从二次供水水箱清洗消毒到场镇消火栓补点提标，用一件件看得见、摸得着的实事把民生答卷写在群众家门口：达川区对城区 72 套二次供水设施全覆盖清洗检测，开江县讲治镇推进社区消火栓布设与供水管网配套，补齐安全短板。\n原文链接：<a class=\"readlink\" href=\"https://www.dzrm.cn/cms/a/493540897/content\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>20. 达州东部经开区民生项目加速推进，供排水配套八标段收尾冲刺 [高]</h3>\n<p><strong>来源</strong>：达州日报电子报（pad.dzrm.cn）｜<strong>时间</strong>：2026-11-03\n<strong>要点</strong>：达州东部经开区以项目建设\"加速度\"回应群众期盼：安居工程方面安置房等民生项目加快推进；城市供排水配套工程（八标段）进入收官扫尾，新建粗格栅、生化池、二沉池等 7 大构筑物，计划年内竣工，投运后将健全全区供排水管网体系、改善明月江流域水生态、稳定保障群众生活与企业生产用水。\n原文链接：<a class=\"readlink\" href=\"https://pad.dzrm.cn/dzwb/202611/03/content_145475.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<blockquote>\n<p>核查提示：以上资讯来自各权威信源实时抓取，突发、军事与口径不一内容已标注\"请核对原文\"。引用或转发前，请点击原文链接核对发布时间与最新进展。教育类已覆盖国家（5）、省（3）、市（2）三级。</p>\n</blockquote>", "2026-11-07": "<h1>每日新闻简报 · 2026-11-07（星期六）</h1>\n<blockquote>\n<p>抓取范围：过去 24 小时（2026-11-06 至 2026-11-07）。总条数 20 条。\n可信度分级：<strong>高</strong>（官方/权威媒体）、<strong>中</strong>（主流媒体转载/部分参数为爆料）、<strong>待核实</strong>（匿名/二手/口径不一，文末已标注「请核对原文」）。\n本简报为聚合整理，突发、军事与转载内容请以原文链接为准。</p>\n</blockquote>\n<hr />\n<h2>一、国际国内大事（4 条）</h2>\n<h3>1. 中国气象局启动暴雪四级应急响应 下半年首个暴雪预警发布</h3>\n<ul>\n<li><strong>来源</strong>：央视新闻《早啊!新闻来了》/ 中央气象台</li>\n<li><strong>时间</strong>：2026-11-06 至 11-07</li>\n<li><strong>要点</strong>：11月6日18时中央气象台发布暴雪蓝色预警、继续发布大风蓝色预警，系今年下半年首个暴雪预警，预计11月6日20时至7日20时山西北部、河北西部和北部、北京西北部等地部分地区有大雪，其中山西北部、河北西部局地暴雪（10~12毫米），新增积雪2~6厘米、局地8厘米以上。经综合研判，中国气象台启动重大气象灾害（暴雪）四级应急响应；预计11月7—8日白天中东部有大范围雨雪，山西、河北、北京、辽宁等地部分地区有大到暴雪，河北东北部和辽宁西南部局地大暴雪，雨雪降温路面易形成薄冰，出行需防范。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://ysxw.cctv.cn/article.html?item_id=7143527316000345557\" target=\"_blank\" rel=\"noopener\">ysxw.cctv.cn/…</a></li>\n</ul>\n<h3>2. 四川引大济岷工程今日启动建设 总投资575亿元</h3>\n<ul>\n<li><strong>来源</strong>：央视新闻《新闻联播》国内联播快讯</li>\n<li><strong>时间</strong>：2026-11-07</li>\n<li><strong>要点</strong>：全国骨干水网工程之一的引大济岷 oe.gov.cn/…</a></li>\n</ul>\n<h3>6. 教育部等三部门部署防控儿童青少年高度近视</h3>\n<ul>\n<li><strong>来源</strong>：教育部 / 人民网</li>\n<li><strong>时间</strong>：2026-10（配套国标 11-01 实施）</li>\n<li><strong>要点</strong>：教育部、国家卫健委、国家疾控局联合印发《关于防控儿童青少年高度近视的通知》，将\"保障用眼环境\"列为6项举措之首，要求减少教学过程电子产品使用时长，严格落实中小学生每天综合体育活动时间不低于2小时、推行\"课间15分钟\"，并为高度近视学生建立视觉健康档案；配套的《中小学校教室采光和照明卫生标准》强制性新国标已于11月1日起实施（课桌面维持平均照度不低于300勒克斯）。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://edu.people.com.cn/n1/2026/1029/c1006-40823691.html\" target=\"_blank\" rel=\"noopener\">edu.people.com.cn/…</a></li>\n</ul>\n<h3>7. 2027年全国硕士研究生招生初试时间公布</h3>\n<ul>\n<li><strong>来源</strong>：教育部 / 央视网</li>\n<li><strong>时间</strong>：2026-09-24 发布（初试 2026-12-19 至 20 日）</li>\n<li><strong>要点</strong>：教育部印发《2027年全国硕士研究生招生工作管理规定》，明确2027年全国硕士研究生招生初试时间为2026年12月19日至20日；报名时间为2026年10月15日至24日（预报名10月9日至12日），中国研究生招生信息网进一步优化报名系统，推进网上报名和网上确认一体化，实现\"一站式\"完成报名。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://news.cctv.com/2026/09/24/ARTIeidqzSZX9vD1JXosirCB260924.shtml\" target=\"_blank\" rel=\"noopener\">news.cctv.com/…</a></li>\n</ul>\n<h3>8. 高等教育赋能区域创新与产业高质量发展研讨会将举办</h3>\n<ul>\n<li><strong>来源</strong>：教育部学校规划建设发展中心</li>\n<li><strong>时间</strong>：2026-11-09 至 11-10（河南商丘）</li>\n<li><strong>要点</strong>：教育部学校规划建设发展中心计划于11月9—10日举办高等教育赋能区域创新与产业高质量发展研讨会，由河南省教育厅、商丘市人民政府承办，围绕\"教育科技人才一体发展与地方高校使命担当\"\"区域创新中心建设与高校服务产业机制创新\"\"超硬材料产业技术前沿与产学研协同\"等核心议题展开。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://csdp.edu.cn/article/10749.html\" target=\"_blank\" rel=\"noopener\">csdp.edu.cn/…</a></li>\n</ul>\n<h3>9. 职业院校教师教学能力与素养提升专题培训班11月首期开班</h3>\n<ul>\n<li><strong>来源</strong>：教育部职业教育发展中心</li>\n<li><strong>时间</strong>：第1期 2026-11-17 至 11-20（浙江机电职业技术大学承办）</li>\n<li><strong>要点</strong>：为落实《教育强国建设规划纲要（2024—2035年）》，教育部职业教育发展中心组织开展职业院校教师教学能力及素养提升专题培训班，聚焦数字化教学教研、三维课程体系研修与教学提质体系构建，每期4天计24学时，面向职业院校教学负责人、骨干教师等。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.civ 、内蒙古东南部、山西东北部及甘肃中西部、青海东北部等地部分地区有大到暴雪，其中辽宁西部、河北东北部局地大暴雪、局地特大暴雪；同日发布寒潮蓝色预警，预计7日20时至10日8时中东部大部降温6~10℃，部分地区10~12℃、局地14℃以上，10日晨0℃线南压至陕南至华北南部一带。国家防减救灾委办公室、应急管理部会同中国气象局专题会商，调度京冀辽皖赣等重点省份防范应对。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&amp;item_id=5251671712828492645&amp;channelId=1119\" target=\"_blank\" rel=\"noopener\">ysxw.cctv.cn/…</a></li>\n</ul>\n<h3>4. 国际局势：美伊冲突升级 俄乌互袭加剧 三方会谈定11月10日阿布扎比</h3>\n<ul>\n<li><strong>来源</strong>：央视新闻 / 网易《看世界·新闻早知道》/ 经济日报财经早餐</li>\n<li><strong>时间</strong>：2026-11-06 至 11-08</li>\n<li><strong>要点</strong>：美伊对峙持续升温：伊朗伊斯兰革命卫队7日称已解除导弹射程限制，可打击\"预想不到的地点\"；8日凌晨两艘油轮在霍尔木兹海峡触雷起火，伊朗方面称其试图通过未经授权的航道；特朗普称美军对伊朗实施了\"小型打击\"并悬赏征集伊朗核计划情报，美方副总统万斯近期直接介入美伊间接谈判、谈判\"提级\"。俄乌方面，俄国防部称7日凌晨对基辅及基辅州能源、交通基础设施发动大规模打击，乌方称基辅供电供暖供水形势严峻、9人受伤。普京确认俄美乌三方乌克兰问题会谈将于11月10日在阿布扎比举行，各方表态显示突破难度较大。战况与表态口径不一，请以官方通报为准。</li>\n<li><strong>可信度</strong>：中（军事表态与战况口径不一，请核对原文）</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.163.com/dy/article/LB6LJD8O05148VUD.html\" target=\"_blank\" rel=\"noopener\">www.163.com/…</a></li>\n</ul>\n<hr />\n<h2>二、教育（10 条 · 国家 5 / 省 3 / 市 2）</h2>\n<h3>5. 六部门面向全国高校开展\"传承红色基因 走好青春长征路\"宣传教育</h3>\n<ul>\n<li><strong>来源</strong>：教育部、中央党史和文献研究院、退役军人事务部、全国总工会、共青团中央、全国妇联 / 央广网</li>\n<li><strong>时间</strong>：2026-11（结合二十届五中全会与长征胜利90周年）</li>\n<li><strong>要点</strong>：六部门决定面向全国高校开展\"传承红色基因 走好青春长征路\"宣传教育，要求各地各高校聚焦主题，紧密结合党的二十届五中全会召开和纪念红军长征胜利90周年，深化爱国主义、集体主义、社会主义教育，引导青年学生在学习和践行中内化红色基因、激发建功\"十五五\"的使命担当。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.toutiao.com/article/7703513101299204608/\" target=\"_blank\" rel=\"noopener\">www.toutiao.com/…</a></li>\n</ul>\n<h3>6. 教育部2026\"百所高校学子地方行\"收官 金秋启航校招关键一站落子长沙</h3>\n<ul>\n<li><strong>来源</strong>：教育部 / 央广网</li>\n<li><strong>时间</strong>：2026-11-04（收官之站）</li>\n<li><strong>要点</strong>：教育部2026年\"百校学子地方行\"（长沙站）暨长沙\"双肩包\"人才行动近日举行，为2026年收官之站、也是2027届\"金秋启航\"校园招聘关键一站。现场182家用人单位提供岗位7100多个、达成签约和就业意向1800余人；线上541家企业提供优 id=70000021_8466af0fbd166552\" target=\"_blank\" rel=\"noopener\">so.html5.qq.com/…</a></li>\n</ul>\n<h3>4. 国际局势：美军组建特遣部队施压伊朗 沙特利雅得金融区遭袭 埃及列车脱轨</h3>\n<ul>\n<li><strong>来源</strong>：央视新闻 / 网易《看世界·新闻早知道》/ 腾讯新闻经纬早班车</li>\n<li><strong>时间</strong>：2026-11-08 至 11-09</li>\n<li><strong>要点</strong>：美伊对峙持续：美军中央司令部7日称已下令组建特遣部队防止伊朗经陆路跨境运输先进武器，伊朗革命卫队发言人8日回应称该部队无法达到施压目的。沙特方面，利雅得阿卜杜拉国王金融区（KAFD）遭导弹袭击、一栋塔楼受损，沙特能源部确认阿美石油公司大楼遭袭受损。埃及方面，一列由开罗开往阿斯旺的客运列车8日在吉萨省脱轨，死亡人数升至7人、受伤112人（埃及卫生部）。各方表态与战况口径不一，请以官方通报为准。</li>\n<li><strong>可信度</strong>：中（军事表态与战况口径不一，请核对原文）</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.163.com/dy/article/LB969KM205148VUD.html\" target=\"_blank\" rel=\"noopener\">www.163.com/…</a></li>\n</ul>\n<hr />\n<h2>二、教育（10 条 · 国家 5 / 省 3 / 市 2）</h2>\n<h3>5. 中央第十巡视组巡视教育部党组工作动员会召开（第八轮巡视首次聚焦高教领域）</h3>\n<ul>\n<li><strong>来源</strong>：教育部 / 中国教育在线</li>\n<li><strong>时间</strong>：2026-11（二十届中央第八轮巡视期间）</li>\n<li><strong>要点</strong>：中央第十巡视组巡视教育部党组工作动员会召开。二十届中央第八轮巡视首次全部聚焦高教领域，对教育部及31所中管高校共32家单位开展巡视，推动教育系统全面从严治党向纵深发展、加快教育强国建设。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.eol.cn/\" target=\"_blank\" rel=\"noopener\">www.eol.cn/…</a></li>\n</ul>\n<h3>6. 教育部2026年\"百所高校学子地方行\"收官 金秋启航校招关键一站落子长沙</h3>\n<ul>\n<li><strong>来源</strong>：教育部 / 央广网</li>\n<li><strong>时间</strong>：2026-11-04（收官之站）</li>\n<li><strong>要点</strong>：教育部2026年\"百校学子地方行\"（长沙站）暨长沙\"双肩包\"人才行动近日举行，为2026年收官之站、也是2027届\"金秋启航\"校园招聘关键一站。现场182家用人单位提供岗位7100多个、达成签约和就业意向1800余人；线上541家企业提供优质岗位1.3万余个、收到简历超1万份。活动自5月启动已走进10城，累计释放岗位6.3万余个。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.eol.cn/\" target=\"_blank\" rel=\"noopener\">www.eol.cn/…</a></li>\n</ul>\n<h3>7. 2026年全国教材管理人员培训班在遵义举办</h3>\n<ul>\n<li><strong>来源</strong>：教育部 / 天津市教育委员会（国内教育）</li>\n<li><strong>时间</strong>：2026-11-04</li>\n<li><strong>要点</strong>：教育部在贵州遵义举办2026年全国教材管理人员培训班，教育部党组成员、副部长、总督学王嘉毅出席并讲话。培训班强调抓好《教育强国建设规划纲要（2024—2035年）》落地实施，聚焦坚持和加强党对教材工作的全面领导、把培根铸魂要求贯穿课程教材体系、推进各级各类教材创新提质、加强教材全过程全链条管理等重点任务。各省级 百度热搜 / 抖音热榜 / 微博实时热搜</li>\n<li><strong>时间</strong>：2026-11-09</li>\n<li><strong>要点</strong>：\"油价一周暴跌超16%\"登上百度热搜第1位（热度约780.8万）与抖音热榜，伦敦布伦特原油期货主力合约本周累计跌超16%、纽约原油期货一度跌破每桶90美元，创2020年以来最大单周跌幅。市场对中东冲突降温预期增强是主导因素，地缘风险溢价快速回吐；油价大幅回撤对航空、化工等成本敏感行业利润有直接改善，但对产油国财政平衡与新能源投资经济性构成反向压力。</li>\n<li><strong>可信度</strong>：高（市场公开数据 + 实时榜单）</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.chabang.com/\" target=\"_blank\" rel=\"noopener\">www.chabang.com/…</a></li>\n</ul>\n<h3>16. #太原公寓火灾5死38人送医# 今日第35个全国消防日</h3>\n<ul>\n<li><strong>来源</strong>：央视新闻 / 微博实时热搜 / 太原消防</li>\n<li><strong>时间</strong>：2026-11-08 至 11-09</li>\n<li><strong>要点</strong>：11月8日16时59分，太原市迎泽区柳巷街道豪生国际公寓发生火灾，19时许明火扑灭，送医院救治38人、其中5人死亡，起火原因正在调查。高层建筑火灾的疏散难度与烟气蔓延速度是造成伤亡的主要因素。11月9日是第35个全国消防日、11月为消防宣传月，应急管理部等持续开展消防安全宣传教育，提醒公众关注身边火灾隐患。</li>\n<li><strong>可信度</strong>：高（官方通报 + 实时榜单）</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.chabang.com/\" target=\"_blank\" rel=\"noopener\">www.chabang.com/…</a></li>\n</ul>\n<hr />\n<h2>四、电子产品（2 条）</h2>\n<h3>17. 华为鸿蒙电脑官宣开放升级 HarmonyOS 7 朱懂东预告\"颠覆性创新产品\"</h3>\n<ul>\n<li><strong>来源</strong>：IT之家</li>\n<li><strong>时间</strong>：2026-11-09</li>\n<li><strong>要点</strong>：华为鸿蒙电脑官宣开放升级 HarmonyOS 7 系统；华为终端BG董事长朱懂东预告，鸿蒙电脑\"颠覆性创新产品\"下周开始预热，\"非常惊艳、人见人爱\"。同期华为\"智阅键\"翻页功能公布最新适配机型（含 Pura X View、Mate 90 系列等），鸿蒙生态在PC端的体验持续补全。</li>\n<li><strong>可信度</strong>：中（部分为新品预热与爆料口径，标请核对）</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.ithome.com/0/848/246.htm\" target=\"_blank\" rel=\"noopener\">www.ithome.com/…</a></li>\n</ul>\n<h3>18. 工信部等六部门：加快推进具身智能、大模型、脑机接口在养老领域应用</h3>\n<ul>\n<li><strong>来源</strong>：IT之家 / 工信部等六部门通知</li>\n<li><strong>时间</strong>：2026-11-09</li>\n<li><strong>要点</strong>：工信部等六部门印发通知，加快推进具身智能、大语言模型、脑机接口、外骨骼等在养老领域的应用，鼓励电商平台设立银发消费板块，以科技赋能居家和社区养老。同期科技动态：英伟达发布 CUDA Toolkit 13.5 正式支持 Vera Rubin 超算、升级多GPU通信；AMD 有望史上首次单季营收超越英特尔，CPU 格局迎来分水岭。</li>\n<li><strong>可信度</strong>：高（六部门通知为官方政策）；科技动态部分为厂商动态，以官方发布为准</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.ithome.com/1/000/040.htm\" target=\"_blan 月</h3>\n<ul>\n<li><strong>来源</strong>：新华社《早知天下事》/ 国务院关税税则委员会公告 / 商务部</li>\n<li><strong>时间</strong>：2026-11-10 13:01 起施行</li>\n<li><strong>要点</strong>：国务院关税税则委员会发布公告，自11月10日13时01分起两个月内，继续暂停对原产于美国的进口商品加征24%的关税，仅保留10%；商务部同步宣布，暂停对16家美国相关企业实施出口管制措施两个月。此举落实两国元首近期会晤共识，为双边经贸往来松绑、释放稳定预期。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://so.html5.qq.com/page/real/search_news?docid=70000021_3216af24c0903152\" target=\"_blank\" rel=\"noopener\">so.html5.qq.com/…</a></li>\n</ul>\n<h3>2. 俄美乌三方会谈今日在阿布扎比重启 时隔9个月面对面磋商</h3>\n<ul>\n<li><strong>来源</strong>：央视新闻《早啊!新闻来了》/ 网易《看世界·新闻早知道》</li>\n<li><strong>时间</strong>：2026-11-10 至 11-11</li>\n<li><strong>要点</strong>：当地时间10日至11日，俄罗斯、美国、乌克兰三方会谈将在阿联酋首都阿布扎比举行，这是今年2月谈判陷入停滞以来，三方时隔9个月重启面对面磋商。此前普京已确认会谈安排，伊朗方面称美方取消制裁、停止战争是启动谈判的前提。会谈能否取得实质进展尚待观察，各相关方表态口径不一。</li>\n<li><strong>可信度</strong>：中（会谈结果未定，各方表态口径不一，请核对原文）</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.toutiao.com/article/7706306659873751602/\" target=\"_blank\" rel=\"noopener\">www.toutiao.com/…</a></li>\n</ul>\n<h3>3. 太原豪生国际公寓火灾遇难升至14人 相关负责人已被控制</h3>\n<ul>\n<li><strong>来源</strong>：新华社《早知天下事》/ 太原市消防救援支队 / 央视新闻</li>\n<li><strong>时间</strong>：2026-11-08 起火，11-09 通报</li>\n<li><strong>要点</strong>：11月8日，山西太原市迎泽区柳巷街道豪生国际公寓发生火灾，截至9日下午6时，事故已造成14人遇难、25人在院救治（其中9人危重），产权单位管理人员和物业公司负责人已被控制，起火原因仍在调查。高层建筑火灾烟气蔓延速度快、逃生窗口期短，应急部门提醒公众熟悉疏散通道、切勿乘电梯逃生。</li>\n<li><strong>可信度</strong>：高（官方通报）；伤亡口径以消防与应急部门最新通报为准，请核对原文</li>\n<li><strong>原文链接</strong>：<a href=\"https://so.html5.qq.com/page/real/search_news?docid=70000021_3216af24c0903152\" target=\"_blank\" rel=\"noopener\">so.html5.qq.com/…</a></li>\n</ul>\n<h3>4. 我国成功发射卫星互联网低轨29组卫星 10月CPI同比涨0.7%</h3>\n<ul>\n<li><strong>来源</strong>：新华社《早知天下事》/ 国家统计局 / 微信《新闻早餐亲子共读》</li>\n<li><strong>时间</strong>：2026-11-10 凌晨4:24 发射</li>\n<li><strong>要点</strong>：11月10日凌晨4时24分，我国在海南商业航天发射场用长征十二号运载火箭，成功将卫星互联网低轨29组卫星送入太空，年内已完成80次航天发射、近三分之一用于织密低轨卫星互联网。经济数据方面，国家统计局公布10月份全国居民消费价格（CPI）同比上涨0.7%、环比持平，1—10月平均比上年同期上涨0.9%，物价总体平稳。</li>\n<li><strong>可信度</strong>： 卫生健康委、国家疾控局 / 教育部官网</li>\n<li><strong>时间</strong>：2026-10-20 部署</li>\n<li><strong>要点</strong>：教育部、国家卫生健康委、国家疾控局联合部署儿童青少年近视防控工作，明确保障学生每天校内、校外各1小时体育活动时间，落实课间休息与“健康第一”理念，推进教室照明等强制国标落地、降低近视发生率。各地正结合“健康第一”落实情况专项调研，推动减负提质与校园餐、教辅征订等专项整治协同推进。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.moe.gov.cn/\" target=\"_blank\" rel=\"noopener\">www.moe.gov.cn/…</a></li>\n</ul>\n<h3>9. 第四届全国大学生职业规划大赛启动</h3>\n<ul>\n<li><strong>来源</strong>：教育部 / 教育部官网“最新文件”</li>\n<li><strong>时间</strong>：2026-10-10 通知</li>\n<li><strong>要点</strong>：教育部印发《关于举办第四届全国大学生职业规划大赛的通知》，以“筑梦青春志在四方，规划启航职引未来”为主题，面向普通高校在校学生设置成长赛道与就业赛道，旨在加强高校生涯教育与就业指导、促进高校毕业生高质量充分就业。大赛与“金秋启航”校园招聘月联动，服务2027届毕业生求职季。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.moe.gov.cn/jyb_xxgk/zywj_btlj/\" target=\"_blank\" rel=\"noopener\">www.moe.gov.cn/…</a></li>\n</ul>\n<h3>10. 四川2027年普通高考报名完成 网上注册及缴费10月17日—11月4日</h3>\n<ul>\n<li><strong>来源</strong>：四川省教育考试院 sceea.cn</li>\n<li><strong>时间</strong>：2026-10-17 至 11-04（报名窗口）</li>\n<li><strong>要点</strong>：四川省2027年普通高校招生报名已结束：网上注册10月17日—11月3日、网上报名及缴费10月22日—11月4日（每日9:00—22:00），艺术体育类专业统考报名与普通高考报名同时进行。报名结束后进入资格审核与考试组织阶段，考生可关注四川省教育考试院官网获取后续安排与操作指南。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.sceea.cn/index.html\" target=\"_blank\" rel=\"noopener\">www.sceea.cn/…</a></li>\n</ul>\n<h3>11. 2026年下半年中小学教师资格考试（笔试）成绩11月6日发布 面试报名同步</h3>\n<ul>\n<li><strong>来源</strong>：教育部教育考试院 / 四川省教育考试院 sceea.cn / NTCE</li>\n<li><strong>时间</strong>：2026-11-06 发布</li>\n<li><strong>要点</strong>：教育部教育考试院发布通知，2026年下半年中小学教师资格考试（笔试）成绩于11月6日10时发布，下半年面试报名工作同步开始；四川省参加笔试的考生如对成绩有异议，可于11月6日至19日登录成绩复核系统申请复核。面试将于12月5日至6日开考，结果2027年1月8日公布。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.sceea.cn/index.html\" target=\"_blank\" rel=\"noopener\">www.sceea.cn/…</a></li>\n</ul>\n<h3>12. 2026年11月四川考试招生月历出炉 学考、书法测试、四六级口试、美术统考在即</h3>\n<ul>\n<li><strong>来源</strong>：四川省教育考试院 / 人民网四川频道（川观新闻）</li>\n<li><strong>时间</strong>：2026-11-01 发布</li>\n<li><strong>要点</strong>：四川省教育考试院发布11月考试招生月历：2027年1月普通高中学业水平合格性考试报名11月13日—17日；考试方面，11月14日四川省书法水平测试，11月21日—22日书画等级考试与全国大学英语四、六级口试，11月28日—29日2027年四川省美术与设计类专业统考（素描/速写/色彩）。考生须留意各项目具体时间与准考证打印安排。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"http://mp.weixin.qq.com/s?__biz=MzA5MTQ5MjkyNw==&amp;mid=2652507733&amp;idx=1&amp;sn=fb5d70e646e99ce944a0429983647904&amp;chksm=8a4f1ca084f643b5f03c27c7a83582c18e48b4f5abec52ea2cefb322620930be21f94c8d3f7d#rd\" target=\"_blank\" rel=\"noopener\">mp.weixin.qq.com/…</a></li>\n</ul>\n<h3>13. 达州：全省第二届教师人工智能应用能力大赛达州初赛114件作品获奖公示</h3>\n<ul>\n<li><strong>来源</strong>：达州市教育局 jyj.dazhou.gov.cn</li>\n<li><strong>时间</strong>：2026-11-02 发布（公示 11-02 至 11-06）</li>\n<li><strong>要点</strong>：根据《四川省教育厅关于举办第二届教师人工智能应用能力大赛的通知》精神，达州市教育局组织开展了全省第二届教师人工智能应用能力大赛达州初赛，经各县（市、区）和市直属学校推荐、专家评审，114件作品获奖，拟获奖名单于11月2日至6日公示，反映达州教师AI应用能力培育成效。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://jyj.dazhou.gov.cn/news-show-10992.html\" target=\"_blank\" rel=\"noopener\">jyj.dazhou.gov.cn/…</a></li>\n</ul>\n<h3>14. 达州：2026年11月普通话水平测试公告 网上缴费11月11日—15日</h3>\n<ul>\n<li><strong>来源</strong>：达州市教育局（达州市普通话水平测试站）</li>\n<li><strong>时间</strong>：2026-11（报名 11-04 至 11-09，缴费 11-11 至 11-15，测试 11月下旬）</li>\n<li><strong>要点</strong>：达州市普通话水平测试站发布2026年11月普通话水平测试公告：网上报名11月4日—9日，网上缴费11月11日—15日（通过“中国农业银行”APP），测试安排在11月下旬（地点为市特殊教育学校内）。测试站按国家语委最新要求实行“一人一室”，考场全程监控录像、面部声纹识别参考，请考生严格遵守考场指令。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://jyj.dazhou.gov.cn/news-show-10136.html\" target=\"_blank\" rel=\"noopener\">jyj.dazhou.gov.cn/…</a></li>\n</ul>\n<hr />\n<h2>三、舆论热搜（2 条）</h2>\n<h3>15. #老人将6亿遗产留给再婚妻子 原配子女起诉# 登微博热搜第一</h3>\n<ul>\n<li><strong>来源</strong>：微博实时热搜 / 百度热点 / 微信《11月10日热搜热点排行榜》</li>\n<li><strong>时间</strong>：2026-11-10</li>\n<li><strong>要点</strong>：“老人将6亿遗产留给再婚妻子，原配子女起诉”登上微博热搜榜首（热度约49万），并进入百度热点前列。据多家媒体报道，东莞一名八旬老人立下公证遗嘱，将约6亿元财产留给再婚妻子，原配所生子女随后提起诉讼，主张老人立遗嘱时已患阿尔茨海默病、且部分财产属未分割的夫妻共同财产。案件焦点在于立遗嘱人真实民事行为能力认定与财产处分权限，法院审理结果对类似再婚家庭财产继承具有参考意义。</li>\n<li><strong>可信度</strong>：待核实（案件尚在审理，细节以法院裁判与权威媒体核实为准，请核对原文）</li>\n<li><strong>原文链接</strong>：<a href=\"http://mp.weixin.qq.com/s?__biz=MzAxMDY0NDgwMA==&amp;mid=2650308640&amp;idx=1&amp;sn=ac84c3f4e915282f865109220d127633&amp;chksm=82f535ae030ed5cfc85c9673b43f7c204952bb7c10041f09351c6e4266da458e28644023dd1a#rd\" target=\"_blank\" rel=\"noopener\">mp.weixin.qq.com/…</a></li>\n</ul>\n<h3>16. #养老金要崩盘？# 多家主流媒体集中辟谣：有压力≠会崩盘</h3>\n<ul>\n<li><strong>来源</strong>：百度热搜 / 微博辟谣位 / 多家主流媒体</li>\n<li><strong>时间</strong>：2026-11-10</li>\n<li><strong>要点</strong>：“养老金要崩盘？”登上百度热搜，引发公众关注。针对网络上传言，多家主流媒体集中发文回应：人口老龄化确实带来长期收支压力，但全国养老金多年来均按时足额发放，制度运行总体平稳；官方在澄清事实的同时，也需通过更透明的数据公开来稳定社会预期。该话题与“另一地官宣公办普高‘愿上尽上’”等民生政策讨论并列进入热榜。</li>\n<li><strong>可信度</strong>：高（官方与主流媒体回应）；具体数据以人社部及各地社保部门发布为准</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.chabang.com/\" target=\"_blank\" rel=\"noopener\">www.chabang.com/…</a></li>\n</ul>\n<hr />\n<h2>四、电子产品（2 条）</h2>\n<h3>17. “星云星座计划”发布 我国太空算力网加快部署</h3>\n<ul>\n<li><strong>来源</strong>：每日经济新闻《数智早参》/ 腾讯网</li>\n<li><strong>时间</strong>：2026-11-10（11月9日产业生态大会发布）</li>\n<li><strong>要点</strong>：在11月9日举办的“2026太空云产业生态大会”上，“星云星座计划”等我国太空云产业化成果发布，标志着我国“太空云”生态建设迈出从技术验证走向产业化布局的关键一步。“太空云”指在轨协同的天基云服务系统，改变传统卫星“单星观测、数据回传地面处理”模式，让天基资源按需调用、即连即用，未来将实现太空与地面算力无缝融合、统一调度，带动芯片、服务器、卫星制造与应用全链条协同。</li>\n<li><strong>可信度</strong>：高（产业大会官方发布 + 权威财经媒体）</li>\n<li><strong>原文链接</strong>：<a href=\"https://new.qq.com/rain/a/20261110A03A4800\" target=\"_blank\" rel=\"noopener\">new.qq.com/…</a></li>\n</ul>\n<h3>18. 宇树科技市值重回3000亿元 人形机器人龙头前三季度营收增55.71%</h3>\n<ul>\n<li><strong>来源</strong>：浙江省企业信息化促进会《促进会早报》/ IT之家</li>\n<li><strong>时间</strong>：2026-11-10（11月9日盘中走强）</li>\n<li><strong>要点</strong>：人形机器人龙头宇树科技11月9日盘中大幅走强，总市值重回3000亿元关口上方；自10月中旬以来股价累计涨幅已超78%。公司创始人王兴兴在乌镇峰会及进博会期间多次表态，称具身智能卡点不在“脑子”、而在与物理世界“最后几毫米”的对齐，判断物理AI正临近类似ChatGPT式的范式节点。基本面层面，公司前三季度实现营收18.17亿元、同比增长55.71%，归母净利润3.87亿元、同比增长270.54%。</li>\n<li><strong>可信度</strong>：中（市值与业绩为公开市场数据；产业判断含创始人表态，以官方披露为准）</li>\n<li><strong>原文链接</strong>：<a href=\"http://mp.weixin.qq.com/s?__biz=MzI1Mjc4MjA4MA==&amp;mid=2247624025&amp;idx=1&amp;sn=153315a1918b65fd994ef25ffda5de77&amp;chksm=e853c4530efa7f5eaceaeeb074ab138d9dabfc18d9f9a41d484ae7b73ee374e951d97869d841#rd\" target=\"_blank\" rel=\"noopener\">mp.weixin.qq.com/…</a></li>\n</ul>\n<hr />\n<h2>五、达州本地（2 条 · 政治 + 民生）</h2>\n<h3>19. 达川区公开征集2027年民生实事建议 政府问需于民</h3>\n<ul>\n<li><strong>来源</strong>：达州市达川区人民政府 dachuan.gov.cn</li>\n<li><strong>时间</strong>：2026-10-28 发布征集</li>\n<li><strong>要点</strong>：达州市达川区发布《关于公开征集达州市达川区2027年民生实事建议的公告》，面向社会公开征集2027年民生实事项目，广泛听取群众在就业、教育、医疗、养老、住房、出行、环境等方面的诉求，将群众“急难愁盼”纳入政府年度民生实事清单，体现“民生优先”战略下政府问需于民、以实事惠民的施政导向。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.dachuan.gov.cn/\" target=\"_blank\" rel=\"noopener\">www.dachuan.gov.cn/…</a></li>\n</ul>\n<h3>20. 我市未来五年计划增设居民楼电梯750部以上 城市更新惠民生</h3>\n<ul>\n<li><strong>来源</strong>：达州市人民政府 dazhou.gov.cn</li>\n<li><strong>时间</strong>：2026-11（近期推进）</li>\n<li><strong>要点</strong>：市第六次党代会提出下功夫解决停车、充电、加装电梯、物业管理、社区居家养老与助残服务等方面难题。贯彻落实党代会精神，达州把既有住宅电梯增设、老旧电梯更新作为城市更新和适老化改造的关键抓手，坚持“能加则加、愿加快加”，未来五年计划增设居民楼电梯750部以上。达川区杨柳佳苑小区多个楼栋电梯增设进入收尾、预计11月中旬全面完工交付；通川区龙泉宜家小区其余楼栋电梯已竣工投用，各地开设“电梯增设一件事”窗口、落实专项补贴。</li>\n<li><strong>可信度</strong>：高</li>\n<li><strong>原文链接</strong>：<a href=\"https://www.dazhou.gov.cn/news-show-272808.html\" target=\"_blank\" rel=\"noopener\">www.dazhou.gov.cn/…</a></li>\n</ul>\n<hr />\n<h2>核查提示</h2>\n<ol>\n<li>国际国内大事、教育、达州本地多取自央视新闻、新华社、教育部、四川省教育考试院、达州市政府/教育局、达川区政府等官方/权威渠道，可信度标注为「高」。</li>\n<li>条目 2（俄美乌阿布扎比会谈）会谈结果未定、各方表态口径不一，请以外交部、国防部及权威媒体最新通报为准；条目 3（太原火灾）伤亡以消防与应急部门最新通报为准。</li>\n<li>舆论热搜（条目 15、16）来自微博实时热搜、百度热搜与全网聚合榜；条目 15 遗产纠纷尚在审理，细节请核对原文与法院裁判；条目 16“养老金崩盘”为官方辟谣内容，具体数据以人社部门发布为准。</li>\n<li>电子产品（条目 17、18）中“星云星座计划”为产业大会官方发布；条目 18 宇树科技市值与业绩为公开市场数据，产业判断含创始人表态，以官方披露为准。</li>\n<li>以上链接均可点击溯源，建议结合发布时间综合判断信息时效性。</li>\n</ol>", "2026-11-11": "<h1>每日新闻简报 · 2026-11-11（星期三）</h1>\n<blockquote>\n<p>抓取范围：过去 24 小时（2026-11-10 至 2026-11
