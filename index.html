等教育人才培养」系列师资培训</strong>\n- 来源：教育部高等教育司 / 多高校转发\n- 时间：报名与学习即日起至 2026-11-30，证书 12-31 前导出\n- 要点：培训设「未来教师专项 + 学科专项（文/理/农/医四选一）+ 实验教学专项」三大专项六小组别，教师完成不少于 16 门课程学习并测试合格可获证书；内容涵盖 AI 通识、「AI+专业教育」、大模型教学应用与伦理风险防范。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://jw.qau.edu.cn/content/jstz/ee030142a66a4a6baf5a1d558d1f086b\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>7. 多地中小学调整作息：推迟到校、取消早读、缩短晚自习</strong>\n- 来源：大风新闻 / 中国教育科学研究院专家解读\n- 时间：2026-11-14\n- 要点：四川成都蒙彼利埃小学立冬起到校调至 8:40，江苏南京、徐州多校推迟 20—30 分钟，宁波前湾新区初中、成都列五中学取消统一早读，江苏多地缩短初高中晚自习；报道援引教育部睡眠管理红线（小学上午不早于 8:20、中学不早于 8:00）。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzIwOTAxNzg3MA==&amp;mid=2247483853&amp;idx=1&amp;sn=54ab78ac37bb37205e17cb4bc0baa35e&amp;chksm=9660f93c949d610ff9e853ca92b8bc532f8f8e904c126dc108fe0c232c3114a3f3027e3ee9c4#rd\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>8. 2026 世界中文大会发布语飞垂直大模型与 30 个典型案例</strong>\n- 来源：教育部 / 中国新闻网、澎湃新闻\n- 时间：2026-11-13 至 15（北京）\n- 要点：大会发布语飞国际中文教育垂直大模型，面向学习者提供即时评测与个性化辅导、面向教师生成备课与互动素材；同步发布 30 个典型案例。据通报，全球 92 国将中文纳入国民教育体系，海外中文学习使用者达 2.1 亿人，HSK 考生首破 100 万人次。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzIwOTAxNzg3MA==&amp;mid=2247483853&amp;idx=1&amp;sn=54ab78ac37bb37205e17cb4bc0baa35e&amp;chksm=9660f93c949d610ff9e853ca92b8bc532f8f8e904c126dc108fe0c232c3114a3f3027e3ee9c4#rd\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>9. 人民日报「在一线」聚焦大中衔接：大连理工「1+N」科创实验室落地 12 所高中</strong>\n- 来源：人民日报 / 深圳教育资讯日报\n- 时间：2026-11-15\n- 要点：大连理工大学把高校科创资源铺进中学实验室，已落成 12 个「大工—高中科创实验室」，配套 4 门类微课程与「三导师小组制」（1 名大学导师 + 1 名中学教师 + 1 名社会导师 + N 名学生），并为学生建立「人才成长数字档案」，是「脱颖计划」的落地样本。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzkzMTc0MTQ5OA==&amp;mid=2247484545&amp;idx=1&amp;sn=4729824d269334f9f60772d0425ddf61&amp;chksm=c35496af37a732dba125005f5443645f7e477d858f53b489a76b368900e9bf20a63cb87b2489#rd\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>省（3 条）</h3>\n<p><strong>10. 四川 2027 年 1 月普通高中学业水平合格性考试报名 11.13—17 进行</strong>\n- 来源：四川省教育考试院\n- 时间：2026-11-13 起\n- 要点：四川省 2027 年 1 月普通高中学业水平考试（学考）报名于 11 月 13 日至 17 日进行，考生须在规定时段内完成网上填报与缴费。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.sceea.cn/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>11. 四川 2027 年高考报名已结束</strong>\n- 来源：四川省教育考试院\n- 时间：2026-11-04 截止\n- 要点：四川省 2027 年普通高校招生考试报名于 11 月 4 日 17:00 截止，网上注册（10.17—11.3）、网上报名及缴费（10.22—11.4）工作已转入后续资格审核与考试准备阶段。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.sceea.cn/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>12. 四川 2026 年下半年中小学教师资格考试（面试）报名公告发布</strong>\n- 来源：四川省教育考试院\n- 时间：2026-11（下半年）\n- 要点：四川省下半年中小学教师资格考试（面试）报名公告已发布，考生按公告要求完成信息填报、审核与缴费；同期 11 月四川考试招生月历还列有 11.6—9 中小学教师资格考试、11.28—29 美术与设计类统考等节点。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.sceea.cn/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>市（2 条）</h3>\n<p><strong>13. 达州市普通话水平测试站 2026 年 11 月测试公告（缴费今日截止）</strong>\n- 来源：达州市教育局\n- 时间：报名 11.4—9，网上缴费 11.11—15（今日截止），下旬测试\n- 要点：达州市普通话水平测试站 11 月测试网上报名已结束，网上缴费期为 11 月 11—15 日（今日截止）；测试于 11 月下旬在市特殊教育学校内进行，考场全面升级「一人一室」、全程监控、面部声纹识别、随机抓拍。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://jyj.dazhou.gov.cn/news-show-11008.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>14. 达州推进「建区域教育中心、办人民满意教育」，秋假推出「趣达州」亲子研学</strong>\n- 来源：达州教育（公众号）\n- 时间：2026-11（秋假期间）\n- 要点：达州教育聚焦「建区域教育中心、办人民满意教育」，秋假推出「趣达州」系列活动——带娃下田、做手工、山野撒欢，将本地农旅与研学结合，缓解家庭看护与课外实践需求。\n- 可信度：中（公众号口径，具体安排以达州教育官方发布为准）\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzIyNTU3NzgxMw==&amp;mid=2247639178&amp;idx=3&amp;sn=ddba42de1c131f2bb567d95bc5c1e069&amp;chksm=e9346b15322fc21e6034f99c5127f455ff0c07aa4b59d50f801e86ef7bb04d121ec939554fc4#rd\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>三、舆论热搜（2 条）</h2>\n<p><strong>15. #多地中小学宣布调整作息# 登百度热搜第 2、#多地官宣雪假# 同步在榜</strong>\n- 来源：查榜（全网实时热搜聚合） / 百度热搜 / 微博热搜\n- 时间：2026-11-15\n- 要点：百度热搜「多地中小学宣布调整作息」以约 771 万热度居第 2；河北张家口、吉林、内蒙古呼伦贝尔、新疆阿勒泰等多地公布中小学雪假，最长可连休 5 天，引发「想重新上一次小学」热议，家长同时关注托管与课时衔接。\n- 可信度：高（热搜实时数据；具体放假安排以各地教育局通知为准）\n- 原文链接：<a class=\"readlink\" href=\"https://www.chabang.com/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>16. #求职者拒给 HR 带咖啡被取消面试#，BOSS 直聘已封禁涉事账号</strong>\n- 来源：新浪财经 / 南方日报 / 点时新闻\n- 时间：2026-11-13 至 15\n- 要点：江苏昆山一求职者跨城面试，因拒绝 HR「点两杯饮料且不报销」的要求被当场取消面试，引发舆论；BOSS 直聘回应称该招聘者违反规则公约，已暂停其账号权限。工商信息显示涉事公司连续多年 0 人参保、已被列经营异常。\n- 可信度：高（平台官方回应 + 媒体报道）\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzA3NDM5NzA4NA==&amp;mid=2650011212&amp;idx=4&amp;sn=cf3a12ffee526d45254e79b8938b8efe&amp;chksm=86dc9721e28dbecf487b64dc89211e983646852ebaa61570a484ec02f9add6ab0b56bfb579dc#rd\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>四、电子产品（2 条）</h2>\n<p><strong>17. 小米玄戒 O3 正式发布：十核全大核，AI Cube 工程版迷你主机三芯登场</strong>\n- 来源：IT之家\n- 时间：2026-11-14/15\n- 要点：小米正式发布新一代自研芯片玄戒 O3，采用十核全大核设计；同步官宣小米 AI Cube 工程版迷你主机，搭载玄戒 O3 + O100 + D100 三芯阵容，150W 持续性能释放。同期小米 REDMI K100 Pro/Max、小米手机涨价 300 元起等消息一并发布。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.ithome.com/0/782/959.htm\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>18. DeepSeek V4 Pro 正式版 API 更新上线：Agent 能力大幅提升，支持 Responses API 与 Codex</strong>\n- 来源：IT之家 / DeepSeek 官方\n- 时间：2026-11-14/15\n- 要点：DeepSeek V4 Pro 正式版 API 更新上线，Agent 能力大幅提升，原生支持 OpenAI Responses API 格式并适配 Codex；思考强度支持 low/high/max 三档，并采用峰谷定价（闲时价格为高峰一半）。性能与基准为厂商/社区口径，请以官方文档为准。\n- 可信度：中（性能对比为厂商口径，建议「核对原文」）\n- 原文链接：<a class=\"readlink\" href=\"https://www.ithome.com/0/782/959.htm\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>五、达州本地（政治·民生，2 条）</h2>\n<p><strong>19. 梁磊主持国家市级水网先导区建设、「畅通一条江」及城镇污水治理三年接续攻坚专题会</strong>\n- 来源：达州市人民政府网\n- 时间：2026-11-12\n- 要点：市委副书记、市长梁磊主持召开专题会，研究国家市级水网先导区建设、全省「畅通一条江」及水运建设三年大会战部署落实、全市城镇污水治理三年接续攻坚行动。达州为国家第三批市级水网先导区建设试点，会议要求争取更多国省政策资金落地，谋划水资源配置、防汛减灾、农村供水等重点水利项目。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.dazhou.gov.cn/news-show-272953.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>20. 达州落实「十五五」民生举措：教育增学位、医疗强县域、养老托育全覆盖</strong>\n- 来源：达州市人民政府网（转发国家发展改革委「十五五」民生部署）\n- 时间：2026-11（近期）\n- 要点：据达州市政府网发布的「十五五」民生举措，「十五五」时期将聚焦急难愁盼实施更公平普惠的社会政策——教育方面支持普通高中教学楼、宿舍建设以增加学位供给；医疗方面重点支持县域心电、检查检验、影像等共享中心建设；养老托育方面推进老旧机构改造、托育综合服务中心地市级全覆盖。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.dazhou.gov.cn/news-show-272830.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>核查提示</h2>\n<ul>\n<li>本简报仅汇总公开报道要点；国际局势（如中东霍尔木兹相关、美方表态）、厂商性能与定价口径可能存在后续更新或口径差异，引用或转发前请点击「原文链接」核对发布时间与原文。</li>\n<li>教育类「国家/省/市」三级均已覆盖（国家 5 / 省 3 / 市 2）；达州本地政治、民生各 1 条，市教育 2 条已并入教育类。</li>\n<li>线上门户地址（每日同步更新）：<a href=\"https://daily-news-briefing-56553.app.workbuddy.host/?sharecode=FDJNV4ARSD\" target=\"_blank\" rel=\"noopener\">daily-news-briefing-56553.app.workbuddy.host/…</a></li>\n</ul>", "2026-11-16": "<h1>每日新闻简报 · 2026-11-16（周一）</h1>\n<blockquote>\n<p>抓取范围：过去 24 小时（2026-11-15 至 2026-11-16 早间）国际国内大事、教育、舆论热搜、电子产品、达州本地政治·民生·教育。\n可信度分级：<strong>高</strong>（官方/权威媒体）｜<strong>中</strong>（主流媒体转载/厂商口径）｜<strong>待核实</strong>（匿名/二手/口径不一，已标注「请核对原文」）。\n总条数：20 条（教育固定 10 条，其中国家 5 / 省 3 / 市 2）。</p>\n</blockquote>\n<hr />\n<h2>一、国际国内大事（4 条）</h2>\n<p><strong>1. 《求是》发表习近平重要文章《携手共建亚太命运共同体》</strong>\n- 来源：新华社 / 央视新闻\n- 时间：2026-11-15（11-16 出版的第 22 期《求是》）\n- 要点：文章为习近平总书记 2013 年 10 月至 2025 年 11 月有关论述的节录，强调亚太各经济体利益交融、命运与共，要牢固树立亚太命运共同体意识，带头维护和平稳定、实行开放融通、坚持合作共赢、促进普惠包容；无论发展到什么程度，中国都将扎根亚太、建设亚太、造福亚太。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://news.cctv.com/2026/11/15/ARTIvVIG28gyV9J7u8ijsgHE261115.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>2. APEC「中国年」进入核心议程：工商领导人峰会 11.17—18 深圳举行，21 个经济体全覆盖</strong>\n- 来源：央视新闻 / 上观新闻 / 中国新闻网\n- 时间：2026-11-15 至 11-19\n- 要点：2026 年 APEC 工商领导人峰会 11 月 17—18 日在深圳举行，主题「共促繁荣、共赢未来」，2000 余位政商界领袖参加、其中世界 500 强企业 115 家，参会代表实现 21 个 APEC 经济体全覆盖；习近平主席将出席开幕式并发表主旨演讲。APEC 第三十三次领导人非正式会议 11 月 18—19 日在深圳举行，12 位经济体领导人出席。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.163.com/dy/article/LBRAGDOP055040N3.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>3. 中共中央印发修订后的《中国共产党地方委员会工作条例》</strong>\n- 来源：央视新闻 / 新华社\n- 时间：2026-11-15\n- 要点：中共中央近日印发修订后的《中国共产党地方委员会工作条例》并发出通知，要求各地区各部门认真遵照执行；通知要求地方各级党委深刻领悟「两个确立」的决定性意义，增强「四个意识」、坚定「四个自信」、做到「两个维护」，认真学习、坚决贯彻、严格执行《条例》。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://finance.sina.cn/2026-11-16/detail-iniywnmk5838556.d.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>4. 央行上调外汇存款准备金率至 6% 生效 + 中东部大范围雨雪降温</strong>\n- 来源：中国人民银行 / 中央气象台 / 央视新闻\n- 时间：2026-11-15 至 11-18\n- 要点：① 11 月 15 日起金融机构外汇存款准备金率由 4% 上调至 6%，为近年首次上调，释放稳汇率信号；② 中央气象台预计 15 日夜间至 17 日中东部现大范围雨雪，内蒙古中部、河北北部、新疆伊犁河谷等地部分地区有暴雪，两股冷空气接连影响，大部降温 6~10℃、局地超 12℃。同期国铁集团通报前 10 月国家铁路发送货物 34.2 亿吨（同比增 1.1%）。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.zj.chinanews.com/jzkzj/2026-11-16/detail-ihfmxyez7340032.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<blockquote>\n<p>国际局势附注（待核实）：伊朗革命卫队称打击巴林美军雷达设施、霍尔木兹海峡两艘油轮触雷爆炸并有一艘超级油轮沉没，中东多方口径不一；美国全美航班停飞持续至 15 日、被称为近 25 年最长一次停飞，纽约州长要求交通部长辞职；法国全国示威至少 404 人被拘捕。以上涉及军事与伤亡口径，引用前请核对原文。</p>\n</blockquote>\n<hr />\n<h2>二、教育（10 条，国家 5 / 省 3 / 市 2）</h2>\n<h3>国家（5 条）</h3>\n<p><strong>5. 三部门印发通知：2030 年起高校招生专项计划调整为「服务乡村振兴」专项计划</strong>\n- 来源：教育部、公安部、农业农村部 / 央广网\n- 时间：2026-11-15\n- 要点：三部门联合印发《关于实施服务乡村振兴高校招生专项计划的通知》，从 2030 年高校招生起，现行面向农村和贫困地区招生专项计划调整为服务乡村振兴高校招生专项计划，设 3 年过渡期（2027—2029 仍按现行执行）；报考者须为应届毕业生，本人及法定监护人具当地连续户籍，户籍学籍及实际就读年限至高考当年不少于 3 年，「双一流」高校录取分数原则上不低于各省特殊类型招生控制线。专家提示勿误读为「农村专项取消」或「名校降分」。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzUyMjY1NTA4NQ==&amp;mid=2247484750&amp;idx=1&amp;sn=d9259d5653313cfc4e758adea7fee88a#rd\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>6. 2027 年考研报名 347 万人，止跌回升；初试定于 12 月 19—20 日</strong>\n- 来源：教育部 / EOL 教育在线\n- 时间：2026-11-14（报名人数公布）\n- 要点：2027 年全国硕士研究生考试报名人数 347 万人，比 2026 年的 343 万人增加 4 万人，此前连续三年累计减少 131 万人后首次回升；初试定于 12 月 19—20 日举行（今日进入倒计时 33 天）。分析认为报名人数企稳反映考研回归理性，而非新一轮「考研热」。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.163.com/dy/article/LBMDT9LD05268MTU.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>7. 2026 世界中文大会闭幕：中文水平考试考生首破 100 万人次</strong>\n- 来源：教育部 / 中国新闻网 / 澎湃新闻\n- 时间：2026-11-13 至 11-15（北京）\n- 要点：11 月 13—15 日 2026 世界中文大会在北京举行，今年中文水平考试（HSK）考生人数首次突破 100 万人次；全球 92 国将中文纳入国民教育体系，海外中文学习和使用者达 2.1 亿人。大会发布语飞国际中文教育垂直大模型及 30 个典型案例。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.zj.chinanews.com/jzkzj/2026-11-16/detail-ihfmxyez7340032.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>8. 经济日报：教育强国建设全面发力，做强高等教育、深化职普融通</strong>\n- 来源：经济日报\n- 时间：2026-11-16\n- 要点：文章指出各级教育已在较高普及水平上进入巩固成果、提升质量、优化结构阶段；加快教育强国建设既要巩固义务教育控辍保学与高中普及成果、推动优质均衡与城乡一体化，也要做强高等教育分类发展与拔尖创新人才培养、深化职业教育产教融合与职普融通，并顺应人口变化动态统筹教育资源布局。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://paper.ce.cn/pad/content/202611/16/content_341979.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>9. 济南市中区发布义务教育阶段人工智能教育实施规划（2026—2030）</strong>\n- 来源：济南市市中区教体局 / 腾讯新闻\n- 时间：2026-11-15\n- 要点：规划提出到 2030 年全区义务教育学生 AI 基础素养达标率超 90%、教师 AI 应用能力中等以上比例超 85%、培育 300 人以上区级 AI 种子教师、100% 学校具备常态化 AI 课堂教学软硬件配套；小学按低中高学段搭建「认知启蒙—实操入门—探究提升」体系、初中开展 Python 编程进阶，并配套发布三项纲要指南形成「1+3」政策文件体系。此为地方 AI 教育落地样本，具体以当地官方发布为准。\n- 可信度：中（地方教育部门口径）\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzUyMjY1NTA4NQ==&amp;mid=2247484750&amp;idx=1&amp;sn=d9259d5653313cfc4e758adea7fee88a#rd\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>省（3 条）</h3>\n<p><strong>10. 四川 2027 年 1 月普通高中学业水平合格性考试报名 11.13—17 进行</strong>\n- 来源：四川省教育考试院\n- 时间：2026-11-13 9:00 至 11-17 17:00\n- 要点：四川省 2027 年 1 月高中学考报名于 11 月 13—17 日进行，在籍学生、社会人员及申请同等学力认定人员须登录四川省普通高中学业水平考试信息管理系统（xk.sceea.cn）完成注册、选科与缴费，缴费成功方视为报名成功；报考费 20 元/生·科，考前 3 天可下载打印准考证。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.sceea.cn/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>11. 四川 2027 年高考报名已结束，转入资格审查与考试准备</strong>\n- 来源：四川省教育考试院\n- 时间：2026-11-04 截止（近期资格审查公示）\n- 要点：四川省 2027 年普通高校招生考试报名已于 11 月 4 日 17:00 截止，工作转入后续资格审核；遂宁安居等地已对高考 />\n<h2>核查提示</h2>\n<ul>\n<li>本简报仅汇总公开报道要点；国际局势（中东霍尔木兹、美方表态、法国示威）、英伟达人事变动、厂商性能与热搜口径可能存在后续更新或差异，引用或转发前请点击「原文链接」核对发布时间与原文。</li>\n<li>教育类「国家/省/市」三级均已覆盖（国家 5 / 省 3 / 市 2）；达州本地政治、民生各 1 条，市教育 2 条已并入教育类。</li>\n<li>线上门户地址（每日同步更新）：<a href=\"https://daily-news-briefing-56553.app.workbuddy.host/?sharecode=FDJNV4ARSD\" target=\"_blank\" rel=\"noopener\">daily-news-briefing-56553.app.workbuddy.host/…</a></li>\n</ul>", "2026-11-18": "<h1>每日新闻简报 · 2026-11-18（周三）</h1>\n<blockquote>\n<p>抓取范围：过去 24 小时（2026-11-17 至 2026-11-18 早间）国际国内大事、教育、舆论热搜、电子产品、达州本地政治·民生·教育。\n可信度分级：<strong>高</strong>（官方/权威媒体）｜<strong>中</strong>（主流媒体转载/厂商口径）｜<strong>待核实</strong>（匿名/二手/口径不一，已标注「请核对原文」）。\n总条数：20 条（教育固定 10 条，其中国家 5 / 省 3 / 市 2）。</p>\n</blockquote>\n<hr />\n<h2>一、国际国内大事（4 条）</h2>\n<p><strong>1. APEC 领导人会议周进入核心：工商领导人峰会 11.17—18 深圳举行，21 经济体全覆盖</strong>\n- 来源：中国新闻网浙江 / 央视《朝闻天下》 / 央视新闻\n- 时间：2026-11-17 至 11-19\n- 要点：17 日来自 APEC 21 个经济体和英国、法国、德国、瑞士等 13 个域外经济体的 2000 余位政商界代表齐聚深圳，参加 11 月 17—18 日举行的 2026 年 APEC 工商领导人峰会，主题「共促繁荣、共赢未来」；APEC 第三十三次领导人非正式会议 11 月 18—19 日在深圳举行。据热榜信息，多国领导人 17—18 日陆续抵深，相关接机与议程话题登上三平台热搜（领导人行程以新华社、央视通稿为准，请核对原文）。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.zj.chinanews.com/jzkzj/2026-11-18/detail-ihfneeui9563809.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>2. 神舟二十四号近日择机发射，船箭组合体已转运至发射区</strong>\n- 来源：央视《朝闻天下》 / 中国新闻网浙江\n- 时间：2026-11-18\n- 要点：神舟二十四号载人飞船计划近日择机实施发射，船箭组合体已转运至发射区，发射场区各项准备有序推进。同日，新一期全球超算 TOP500 榜单发布，中国超算「灵晟」以每秒 219.8 亿亿次实测运算速度蝉联榜首；国家邮政局通报我国快递业务量连续两个月超 170 亿件。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://tv.cctv.com/2026/11/18/VIDEaWpkcU5qiA6dLBTKhvKh261118.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>3. 商务部回应美限制远程获取先进半导体：坚决反对；中国—东盟自贸区 3.0 版议定书 12 月 1 日生效</strong>\n- 来源：商务部 / 中国新闻网浙江 / 央视《朝闻天下》\n- 时间：2026-11-17 至 11-18\n- 要点：① 就美国商务部发布限制远程获取先进半导体相关措施，商务部 17 日回应称美方泛化国家安全概念、滥用出口管制，中方强烈不满、坚决反对；② 中国—东盟自贸区 3.0 版升级议定书将于 12 月 1 日正式生效实施；③ 国家知识产权局预计 2030 年建设国家地理标志保护示范区达 160 个、地理标志产品直接产值达 1.1 万亿元。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.zj.chinanews.com/jzkzj/2026-11-18/detail-ihfneeui9563809.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>4. 中央气象台继续发布寒潮蓝色预警：13 地降温 8~10℃，局地超 12℃</strong>\n- 来源：中央气象台 / 央视新闻\n- 时间：2026-11-17 至 11-20\n- 要点：中央气象台 17 日 18 时继续发布寒潮蓝色预警和大风蓝色预警，预计 17 日 20 时至 20 日 8 时中东部大部先后降温 6~8℃，黑龙江东南部、山东中西部、安徽、江苏、上海、浙江等地部分降温 8~10℃、局地可达 12℃以上，20 日早晨 0℃线南压至陕西南部到黄淮东南部一带；多地伴 5~6 级风、阵风 7~9 级。前期北方暴雪、南方阴雨，公众注意添衣与取暖安全。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzA3NDM5NzA4NA==&amp;mid=2650011306&amp;idx=3&amp;sn=cac3a2dd47246f672a0a78a8831e57cb\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<blockquote>\n<p>国际局势附注（待核实）：据热榜与外媒综合，俄罗斯总统普京、美国总统特朗普等于 17—18 日陆续抵深出席 APEC，白宫随行含国务卿鲁比奥、财长贝森特、贸易代表格里尔；奥地利、德国、丹麦、荷兰、希腊计划 2027 年在卢旺达开设庇护申请被拒者遣返中心；美媒称美政府拟收紧高技能绿卡计划。以上多国领导人行程与表态口径随议程滚动更新，引用前请核对新华社、央视等权威原文。</p>\n</blockquote>\n<hr />\n<h2>二、教育（10 条，国家 5 / 省 3 / 市 2）</h2>\n<h3>国家（5 条）</h3>\n<p><strong>5. 四部门印发通知：中小学、幼儿园须聘健康副校（园）长，每学期到校指导不少于 4 次</strong>\n- 来源：国家卫生健康委、教育部等四部门 / 光明日报 / 央视新闻\n- 时间：2026-11-16（17 日健康报解读）\n- 要点：通知要求中小学、幼儿园聘任健康副校（园）长，由医疗卫生机构派出、学校聘任兼任，须中级及以上职称，不坐班、不占编制；每学期到校现场指导不少于 4 次、健康科普宣讲不少于 2 次、参加 1 次专题会议，任前培训不少于 8 学时，以「1+N」多学科团队支撑体重、视力、心理、骨骼、口腔「五健」管理。背景是全国 40 多万所中小学幼儿园校医、保健教师配备率不足 70%，补齐专业短板。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzkyMTc4NzI0OQ==&amp;mid=2247484143&amp;idx=1&amp;sn=d76a72c76acc1db45267655e35c1112c\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>6. 教育部教师工作司：规范涉师投诉处理，对不实举报及时澄清正名</strong>\n- 来源：中国青年报 / 北京日报评论 / 央视《朝闻天下》\n- 时间：2026-11-15 至 11-18\n- 要点：针对近期家校举报乱象，教育部教师工作司提出规范涉师争议投诉处理程序，对不实举报及时澄清正名、对恶意诽谤依法追责；多地提出厘清履职边界、建立容错免责机制。评论建议家长按「先与老师沟通、再向学校反映、最后向教育部门提交材料」三级路径反映，别把班级群当第一站。有学校梳理近年投诉，实质性有效合规者仅占约 5%。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzkyMTc4NzI0OQ==&amp;mid=2247484143&amp;idx=1&amp;sn=d76a72c76acc1db45267655e35c1112c\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>7. 又一批地方 11.18 起放秋假连休五天，配套免费校内公益托管、学科培训划红线</strong>\n- 来源：江苏教育新闻网 / 教育时评 / 各地告家长书\n- 时间：2026-11-18 起\n- 要点：11 月 18 日起又一批地方中小学开秋假，多地 18—22 日连休五天，另有 25—27 日、26—30 日错峰；多地推出研学清单与免费校内公益托管，面向双职工、随迁子女、留守儿童，不授新课、不集体补课。收费红线明确：假期学科类培训一律违规，点名「住家教师」「高端家政」「一对一私教」及借托管、研学讲学科；一次性缴费不超 3 个月或 60 课时且不超 5000 元。秋假「十个严禁」含一二年级不布置书面作业、收假后 2 周内不组织文化学科考试。具体以当地官方通知为准。\n- 可信度：高（政策口径以各地教育部门公告为准）\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzkyMTc4NzI0OQ==&amp;mid=2247484143&amp;idx=1&amp;sn=d76a72c76acc1db45267655e35c1112c\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>8. 2026 下半年教资面试准考证 11.30 起打印，面试 12.5—6 举行</strong>\n- 来源：中小学教师资格考试网（NTCE）/ 中国教育在线\n- 时间：2026-11-17（准考证打印剩 13 天）\n- 要点：截至 17 日，2026 下半年教资面试准考证尚不能打印，打印入口 11 月 30 日开放、12 月 6 日关闭，登录 ntce.neea.edu.cn 报名系统下载；面试考试 12 月 5—6 日举行，成绩预计 2027 年 1 月 8 日公布。报名、审核、缴费均已结束，已缴费考生具备下载资格；各省份开放具体时刻或有差异，以本省面试公告为准。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.eol.cn/kaoshi/gwy/jszg/202611/t20261117_2795595.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>9. 2027 届公费师范生专项招聘、农村教师特设岗位密集推进，考研初试 12.19—20</strong>\n- 来源：教育部 / 各地招考公告 / 教育日程汇总\n- 时间：2026-11-18 至 12-20\n- 要点：教育日程显示，2027 届公费师范生专项招聘 11 月 18—24 日报名相继截止，农村教师示范引领特设岗位 11 月 25 日前完成首批选聘；国家公务员考试 11 月 29 日公共科目笔试；2027 年考研初试定于 12 月 19—20 日；高校教师 AI 培训 11 月 30 日前完成、教师提升两项课题网络申报 11 月 20 日 16:00 截止。各项以官方最新通知为准。\n- 可信度：中（招考日程汇总，具体节点以官方公告为准）\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzkyMTc4NzI0OQ==&amp;mid=2247484143&amp;idx=1&amp;sn=d76a72c76acc1db45267655e35c1112c\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>省（3 条）</h3>\n<p><strong>10. 四川 2027 年 1 月普通高中学业水平合格性考试报名 11.13—17 进行</strong>\n- 来源：四川省教育考试院\n- 时间：2026-11-13 9:00 至 11-17 17:00（已截止）\n- 要点：四川省 2027 年 1 月高中学考报名于 11 月 13—17 日进行，在籍学生、社会人员及申请同等学力认定人员须登录四川省普通高中学业水平考试信息管理系统（xk.sceea.cn）完成注册、选科与缴费，缴费成功方视为报名成功；报考费 20 元/生·科，考前 3 天可下载打印准考证。同期四川 2027 年高考报名已结束、转入资格审查。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.sceea.cn/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>11. 四川 2026 下半年全国大学英语四、六级口语考试本周末举行，11.17 起打印准考证</strong>\n- 来源：四川省教育考试院 / 达州融媒\n- 时间：2026-11-17（准考证打印）／11-21 至 11-22 考试\n- 要点：四川省教育考试院提示，2026 年下半年全国大学英语四、六级口语考试（CET-SET）于 11 月 21—22 日举行，准考证自 17 日起可登录全国大学英语四、六级考试报名网（cet-bm.neea.cn）打印；考生须持纸质准考证和有效身份证件参加，严禁携带手机及智能穿戴等通讯电子产品入场。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.dzrm.cn/cms/a/495314007/content\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>12. 电子科技大学工程学进入 ESI 全球前万分之一，列全球第 31 位</strong>\n- 来源：电子科技大学 / 基本科学指标数据库（ESI）/ 早安达州\n- 时间：2026-11-16\n- 要点：电子科技大学 16 日官宣学科突破：最新 ESI 统计显示，全球共 3121 个机构进入 ESI 工程学科前 1%，电子科技大学位列第 31 位，成功进入全球前万分之一，反映四川高校工程学科国际影响力提升。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://finance.sina.com.cn/roll/2026-11-18/doc-inizayrp5007027.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>市（2 条）</h3>\n<p><strong>13. 达州市普通话水平测试站 11 月测试：缴费已结束，下旬测试</strong>\n- 来源：达州市教育局\n- 时间：报名 11.4—9，缴费 11.11—15，下旬测试\n- 要点：达州市普通话水平测试站 11 月测试网上报名与缴费已结束，测试于 11 月下旬在市特殊教育学校内进行，考场升级「一人一室」、全程监控、面部声纹识别、随机抓拍；成绩约 30 个工作日后可在国家普通话水平测试网查询。已完成缴费考生按公告时间赴考。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://jyj.dazhou.gov.cn/news-show-11008.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>14. 职引未来·2026 全国城市联合招聘达州高校毕业生秋季专场走进达州职业技术学院</strong>\n- 来源：达州融媒 / 早安达州\n- 时间：2026-11-17\n- 要点：11 月 17 日「职引未来—2026 年全国城市联合招聘达州高校毕业生秋季专场招聘会」走进达州职业技术学院，把岗位、服务送到校园。另达州事业单位专项招聘 96 名 11 月 16—20 日报名（20 日 17:00 截止），11 月 20 日还有全国人力资源市场高校毕业生就业服务专项行动招聘会，毕业生可一并关注。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MjM5MTc2OTE5NQ==&amp;mid=2247483905&amp;idx=1&amp;sn=b2c269dc5b06063875194557a0d46e1a\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>三、舆论热搜（2 条）</h2>\n<p><strong>15. #豆包加聊天功能或威胁微信# 登微博热搜第一，官方澄清为误读</strong>\n- 来源：豚榜（全网实时热搜聚合） / 微博热搜 / 百度热点\n- 时间：2026-11-17 至 11-18\n- 要点：17 日「豆包加聊天功能或威胁微信」登上微博热搜第一，豆包方面已明确否认做 C 端社交功能计划，传闻中即时通信界面源于与飞书在企业办公场景的协同尝试，官方称「相关内容纯属虚构」；真正矛盾点在 10 月豆包手机助手跨应用「代操作」能力遭微信、淘宝等 155 款应用拒绝接入。同期「雷军 APEC 现场挨个发名片」「深圳人全妆出街迎 APEC」「U19 国足 2:1 韩国夺熊猫杯冠军」等话题在榜。热搜实时数据，具体以平台榜单为准。\n- 可信度：中（热搜实时数据；官方已就核心传闻辟谣）\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzAxMDY0NDgwMA==&amp;mid=2650308717&amp;idx=1&amp;sn=9e4b8226dde4841e1299ece080385477\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>16. 英伟达史上首次单季营收破千亿美元，黄仁勋「愿重返 CEO」引热议</strong>\n- 来源：百度热点 / 豚榜 / IT之家\n- 时间：2026-11-17 至 11-18\n- 要点：英伟达 2027 财年第三财季营收 1158 亿美元、同比增 103%，为史上首次单季营收破千亿，数据中心业务当季 1076 亿美元、占比约 93%；辞任 CEO 后黄仁勋首次发声称「愿重返英伟达任 CEO」，临时 CEO 由 CFO Colette Kress 担任，董事会明确目前不考虑其复职。财报大超预期与人事变动叠加，登上百度热搜榜。营收口径对应截至 2026 年 10 月 25 日的财年季度，请核对原文。\n- 可信度：中（营收为公开财报数据；人事表态后续以公司公告为准，请核对原文）\n- 原文链接：<a class=\"readlink\" href=\"https://www.ithome.com/1/028/595.htm\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>四、电子产品（2 条）</h2>\n<p><strong>17. 小米 18 Pro 系列国际版巴黎发布，1399 欧元起把背屏带向海外</strong>\n- 来源：IT之家\n- 时间：2026-11-18（巴黎发布会为 11-17 晚）\n- 要点：小米 18 Pro 系列国际版在巴黎发布，18 Pro 1399 欧元起、18 Pro Max 1599 欧元起（约合人民币 1.03 万、1.17 万起）；搭载徕卡双 2 亿像素影像系统与全新背屏（来电、消息、地图、天气翻转即看，支持生成 AI 背屏应用卡），国际版电池 6000/7050mAh、骁龙 8 至尊版系列。国行版 9 月 23 日已发布、5999 元起。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://m.ithome.com/html/1028564.htm\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>18. 中国「灵晟」蝉联全球超算榜首；华为麒麟 9050 配新一代显示 DPU，星芒 OSTA O1 Pro 定档 11.20</strong>\n- 来源：IT之家《IT早报》\n- 时间：2026-11-17 至 11-18\n- 要点：① 新一期全球超算 TOP500 榜单，中国「灵晟」以每秒 219.8 亿亿次实测运算速度蝉联榜首；② 华为官方披露麒麟 9050 系列搭载新一代显示 DPU，支持像素级显示控制、全彩 AI-HDR2020、防窥模式快速切换；③ 华为全新子品牌星芒首款产品 OSTA O1 Pro 阔直板手机上架华为商城，11 月 20 日正式发布；④ 博主爆料小米 18 标准版定价 6000 元左右（未官宣，请核对原文）。\n- 可信度：中（厂商口径与博主爆料，未官宣项请核对原文）\n- 原文链接：<a class=\"readlink\" href=\"https://www.ithome.com/1/028/595.htm\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>五、达州本地（政治·民生，2 条）</h2>\n<p><strong>19. 童梦率队赴杭州、成都对接优质医疗资源，加快建设高品质健康达州（政治）</strong>\n- 来源：达州融媒·四川手机报达州党政参考\n- 时间：2026-11-17\n- 要点：市委书记童梦近日率队赴杭州、成都对接优质医疗资源、推进院地校地合作，强调大力实施「民生优先」发展战略、把医疗卫生摆在突出位置。先后对接浙大二院、四川省人民医院（共建川东医院、打造区域医疗中心与三甲综合医院）、成都中医药大学（道地药材开发、争创国家和省级中医重点专科），推动优质医疗资源扩容下沉。市领导鲜阳红、晏世莹、吴勇、加晓昕分段参加。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.dzrm.cn/cms/a/495148114/content\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>20. 达州民生多条线上：居民医保 400 元缴费至 2027.1.31、12 月 1 日交管便民新政、川渝 249 家图书馆一卡通（民生）</strong>\n- 来源：达州市人民政府网 / 达州融媒 / 早安达州\n- 时间：2026-11-17\n- 要点：① 2027 年度达州城乡居民医保个人缴费 400 元，集中缴费期至 2027 年 1 月 31 日，未连续参保将设待遇等待期；② 12 月 1 日起 5 项交管便民措施全国推行，含进口小客车新车上牌「一件事」、免重复验车、12123 智能客服「交管小安」；③ 川渝 249 家公共图书馆实现通借通还「一卡通」，在重庆借书可在达州就近归还；④ 天气：18 日多云 14/6℃，明起最低掉到 5—6℃，20—21 日白天回暖至 19—20℃，早晚温差大注意添衣。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MjM5MTc2OTE5NQ==&amp;mid=2247483905&amp;idx=1&amp;sn=b2c269dc5b06063875194557a0d46e1a\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>核查提示</h2>\n<ul>\n<li>本简报仅汇总公开报道要点；APEC 领导人行程与国际局势、英伟达人事表态、热搜榜实时数据、厂商未官宣爆料可能存在后续更新或差异，引用或转发前请点击「原文链接」核对发布时间与原文。</li>\n<li>教育类「国家/省/市」三级均已覆盖（国家 5 / 省 3 / 市 2）；达州本地政治、民生各 1 条，市教育 2 条已并入教育类。</li>\n<li>线上门户地址（每日同步更新）：<a href=\"https://daily-news-briefing-56553.app.workbuddy.host/?sharecode=FDJNV4ARSD\" target=\"_blank\" rel=\"noopener\">daily-news-briefing-56553.app.workbuddy.host/…</a></li>\n</ul>", "2026-11-19": "<h1>每日新闻简报 · 2026-11-19（周四）</h1>\n<blockquote>\n<p>抓取范围：过去 24 小时（2026-11-18 至 2026-11-19 早间）国际国内大事、教育、舆论热搜、电子产品、达州本地政治·民生·教育。\n可信度分级：<strong>高</strong>（官方/权威媒体）｜<strong>中</strong>（主流媒体转载/厂商口径）｜<strong>待核实</strong>（匿名/二手/口径不一，已标注「请核对原文」）。\n总条数：20 条（教育固定 10 条，其中国家 5 / 省 3 / 市 2）。</p>\n</blockquote>\n<hr />\n<h2>一、国际国内大事（4 条）</h2>\n<p><strong>1. 习近平出席 APEC 工商领导人峰会开幕式并发表主旨演讲，《深圳倡议》30 年来首次发布</strong>\n- 来源：央视《早啊!新闻来了》 / 中新网浙江《一句话看世界》 / 新华社\n- 时间：2026-11-18 至 11-19\n- 要点：18 日上午国家主席习近平在深圳前海国际会议中心出席 2026 年 APEC 工商领导人峰会开幕式，发表题为《坚定信心，勇毅前行 共创亚太光明未来》的主旨演讲；18 日晚与夫人彭丽媛在深圳国际交流中心举行欢迎宴会，欢迎出席 APEC 第三十三次领导人非正式会议的来宾。《2026 年亚太经合组织工商领导人峰会深圳倡议》18 日发布，为工商领导人峰会创办 30 年来首次以倡议形式发布成果文件，围绕开放包容、创新增长、互联互通、合作共赢四大优先领域。习近平当天还会见俄罗斯总统普京、在宝安机场迎接美国总统特朗普、会见韩国总统李在明。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&amp;item_id=9956774693009886739&amp;channelId=1119\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>2. 中俄美元首将就全球和平深入交换意见；中韩自贸协定第二阶段谈判实质性完成</strong>\n- 来源：外交部 / 商务部 / 中新网浙江 / 上观《早读》\n- 时间：2026-11-18\n- 要点：① 外交部发言人 18 日在例行记者会上表示，中俄美三国元首将就事关全球和平的重要问题深入交换意见；② 商务部国际司负责人 18 日表示，中韩双方以两国元首共识为指引，推进中韩自贸协定第二阶段谈判历经 8 年多时间于近日实质性完成，达成互利共赢的高水平成果，采用负面清单模式对投资、跨境服务贸易、金融服务等作出开放承诺；③ 今年前 10 个月我国对 APEC 其他经济体进出口 27.08 万亿元、同比增长 25.4%（深圳对 APEC 成员进出口 3.65 万亿元、增长 42.1%，创同期新高）。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.zj.chinanews.com/jzkzj/2026-11-19/detail-ihfneeui9565109.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>3. 我国成功发射实践二十四号卫星，长征系列第 678 次飞行</strong>\n- 来源：央视新闻（总台央视记者 杨弘杨、刘鑫蕊）\n- 时间：2026-11-19 6 时 51 分\n- 要点：北京时间 11 月 19 日 6 时 51 分，我国在太原卫星发射中心使用长征二号丁运载火箭，成功将实践二十四号卫星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。此次任务是长征系列运载火箭的第 678 次飞行。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&amp;item_id=1538803005398076858&amp;channelId=1119\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>4. 2026 年度中央安全生产考核巡查启动，8 省市开展 6G 部省协同试点</strong>\n- 来源：央视《早啊!新闻来了》 / 中新网浙江 / 工信部 / 世界知识产权组织\n- 时间：2026-11-18\n- 要点：① 18 日起 24 个中央安全生产考核巡查组陆续进驻 31 个省区市和新疆生产建设兵团开展年度考核巡查；② 工信部复函同意北京、河北、上海、江苏、浙江、安徽、湖北、广东 8 省市开展 6G 创新发展部省协同试点；③ 世界知识产权组织《2026 年世界知识产权指标》报告显示，2025 年全球专利申请 390 万件、同比增长 6% 创近十年最快增速，中国申请量全球第一且大幅领先第二名；④ 证监会回应\"基金公司上报全部产品 AI 敞口\"为不实信息。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&amp;item_id=9956774693009886739&amp;channelId=1119\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<blockquote>\n<p>国际局势附注（待核实）：据外媒与热榜综合，伊朗军方称打击科威特境内美军基地；胡塞武装称已夺取也门西南两省 10 个地区，沙特主导联军称摧毁胡塞 60 个军事目标；美媒称美国民主党提名杰弗里斯为众议院议长、或成首位非洲裔议长；毛里求斯称若英国年底前不交出查戈斯群岛将起诉英国；印尼央行加息 25 基点至 6%，日本连续 6 个月贸易逆差，德国就削减电力税达成协议。以上境外军事、政治与财经表态口径随局势滚动更新，引用前请核对新华社、央视等权威原文。</p>\n</blockquote>\n<hr />\n<h2>二、教育（10 条，国家 5 / 省 3 / 市 2）</h2>\n<h3>国家（5 条）</h3>\n<p><strong>5. 教育部第二期\"双高建设计划\"启动，遴选 220 所职业院校打造技能型高校\"国家队\"</strong>\n- 来源：人民日报《让技能成才之路越走越宽》（四海听音）\n- 时间：2026-11-19（《人民日报》10 版）\n- 要点：教育部第二期\"双高建设计划\"启动，遴选出 220 所职业院校，打造技能型高校的\"国家队\"；第四十八届世界技能大赛上，中国代表团拿下 41 枚金牌，位居金牌榜和团体总分第一。近年来国家行业产教融合共同体持续组建，技能人才在职称评定、深造通道、人才认定上的制度措施不断健全，技能成才正成为可预期、可复制的路径。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://news.qq.com/rain/a/20261119A03PY700\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>6. 人民日报\"议政·委员说 AI\"：AI 可以辅助学习，但不能用分析结果定义学生</strong>\n- 来源：人民日报《让人工智能更好赋能教育变革》（议政·委员说 AI③）\n- 时间：2026-11-19（《人民日报》18 版）\n- 要点：全国政协委员建议健全人工智能产品和服务审查机制，加强算法、内容和伦理审查，将伦理与教育风险评估前置到算法设计阶段；保护学生隐私，坚持非必要不采集学生相关数据；把工具使用、课程资源和设备运维纳入经常性经费，建立县域统筹运维体系，发挥应用示范校带动作用开展城乡结对、送培到校，缩小区域、城乡、校际数字鸿沟。明确\"AI 可以辅助学习，但不能用分析结果来定义学生\"，学生的发展性评价、情感陪伴和价值引领始终需要教师发挥作用。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://news.qq.com/rain/a/20261119A03OWS00\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>7. 教育部：内地高校招收香港中学文凭考试学生计划高校增至 169 所，12 月 1—31 日报名</strong>\n- 来源：教育部 / 环球时报 / 教育新闻每日简报\n- 时间：2026-11-16（11-18 至 11-19 持续解读）\n- 要点：教育部宣布，2027/2028 学年参与\"内地高校招收香港中学文凭考试学生计划\"的内地高校由 165 所增至 169 所，新增浙江财经大学、丽水学院、福耀科技大学、广州新华学院 4 所，分布在中国内地 21 个省、直辖市及 2 个自治区；香港学生可于 12 月 1—31 日报名，2027 年 1 月 10 日前查询审核结果，影响港生赴内地升学通道与报考准备。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzUyMjY1NTA4NQ==&amp;mid=2247484770&amp;idx=1&amp;sn=77183f98e2e10a57fb46b3fb0f3d84cc\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>8. 2027 考研初试进入倒计时 30 天；下半年教资面试准考证 11.30 起打印</strong>\n- 来源：教育部 / 中小学教师资格考试网（NTCE）/ 中国教育在线\n- 时间：2026-11-19（倒计时节点）\n- 要点：2027 年全国硕士研究生招生考试初试定于 12 月 19—20 日举行，11 月 19 日进入倒计时 30 天。2026 下半年中小学教师资格面试准考证打印入口 11 月 30 日开放、12 月 6 日关闭，登录 ntce.neea.edu.cn 下载；面试 12 月 5—6 日举行，成绩预计 2027 年 1 月 8 日公布。各省份开放具体时刻或有差异，以本省面试公告为准。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzUyMjY1NTA4NQ==&amp;mid=2247484770&amp;idx=1&amp;sn=77183f98e2e10a57fb46b3fb0f3d84cc\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>9. 多地推进 2026 下半年中小学教师资格认定与证书发放</strong>\n- 来源：多地教育局 / 教育新闻每日简报\n- 时间：2026-11-18（多地同日发布）\n- 要点：湖北荆门东宝区、广东高州、内蒙古赤峰松山区等地教育行政部门 11 月 18 日陆续发布 2026 年下半年中小学教师资格认定与证书发放公告：东宝区拟认定名单 11 月 19—25 日公示，高州市证书 11 月 20—24 日现场领取，赤峰松山区 11 月 19 日起现场领取或 EMS 邮寄；认定申请表须及时存入本人人事档案。此外第十一届全国学生\"学宪法 讲宪法\"法治素养能力大赛总决赛参赛名单公示 11 月 19 日截止，总决赛 11 月 27—30 日在广州举行。\n- 可信度：中（多地公告汇总，具体节点以当地教育部门通知为准）\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzUyMjY1NTA4NQ==&amp;mid=2247484770&amp;idx=1&amp;sn=77183f98e2e10a57fb46b3fb0f3d84cc\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>省（3 条）</h3>\n<p><strong>10. 四川 2027 年 1 月普通高中学业水平合格性考试报名结束，考试定档 2027 年 1 月 7—8 日</strong>\n- 来源：四川省教育考试院 / 达州融媒（大竹县报名须知）\n- 时间：报名 2026-11-13 9:00 至 11-17 17:00（已截止）／考试 2027-01-07 至 01-08\n- 要点：根据四川省教育考试院川教考院〔2026〕101 号通知，2027 年 1 月高中学考开考思想政治、物理、语文、数学、外语 5 科，考试安排在 2027 年 1 月 7—8 日；报名已于 11 月 17 日结束，在籍学生、社会人员及同等学力认定人员须在 xk.sceea.cn 完成注册、选科与缴费，缴费成功方视为报名成功。同期四川 2027 年高考报名已结束、转入资格审查。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.dzrm.cn/cms/a/495000130/content\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>11. 四川 2027 年普通高校戏曲类本科专业招生省际联考工作安排公布</strong>\n- 来源：四川省教育考试院 / 四川招考网\n- 时间：2026-11（考试 2026-12 至 2027-02）\n- 要点：四川省教育考试院发布 2027 年普通高校戏曲类本科专业招生省际联考通知，涵盖音乐表演（戏曲音乐）、表演（戏曲表演）、戏曲表演—川剧等专业，其中川剧相关专业为职教本科招生专业，允许考生兼考不同专业或剧种方向；考试（评分）时间原则上安排在 2026 年 12 月至 2027 年 2 月，具体以组考高校公布为准；实行省际联考后招生高校不再组织其他考试，未参加联考者不能参加戏曲类专业录取。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.sceea.cn/Html/202611/Newsdetail_5028.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>12. 四川 2026 年成人高考成绩查询通道已开通，自考 26.2 次成绩复核今日启动</strong>\n- 来源：四川省教育考试院 / 乐山市中区政府 / 成都外国语学院自考办\n- 时间：2026-11-12（成考查分）／11-19 9:00 至 11-20 16:00（自考复核）\n- 要点：四川 2026 年成人高考成绩查询通道已于 11 月 12 日 17:00 开通，考生可通过省教育考试院官网（sceea.cn）、考生综合服务平台（ks.sceea.cn）、官方微信公众号或支付宝小程序查询；对成绩有异议者可于 11 月 13—15 日到当地招生考试机构办理复核。另四川省 26.2 次自学考试统考课程成绩已发布，成绩复核申请时间为 11 月 19 日 9:00 至 20 日 16:00，以院校公告为准。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.lsszq.gov.cn/szq/jyxx/871045538254981.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>市（2 条）</h3>\n<p><strong>13. 达州市启动 2026 年度中小学校和中等职业学校教师职称评审</strong>\n- 来源：达州市教育局 / 达州市人力资源和社会保障局\n- 时间：2026-11（近期发布）\n- 要点：达州市教育局、市人社局联合发出通知，启动 2026 年度中小学校、中等职业学校教师高级、中级、初级职称评审。申报范围覆盖市本级、通川区、达川区、达州高新区、东部经开区普通中小学、中职、幼儿园、特教学校及教研、教师发展、电化教育、教育考试等机构在职在岗专技人员，副高级面向全市；民办学校、幼儿园教师可参照参加，严禁公办教职工挂靠民办学校申报，离退休人员及公务员不得参加。具体申报专业详见四川省职称评审信息系统。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.zpw315.com/notifications/detail/2122575642926014465\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>14. 达州市教育局公布 2026 年度中小学校新增高级、中级专业技术职务岗位数额</strong>\n- 来源：达州市教育局\n- 时间：2026-11-16\n- 要点：达州市教育局 11 月 16 日公告，经各校申报、各地教育人社部门审查、市教育局审核，公布 2026 年度中小学校（教育直属单位）新增高级、中级（非扩权县）专业技术职务岗位数额，要求各地各校在核定岗位限额内推荐申报专业技术职称，具体数额见公告附件。同期市教育局还发布 2026 年秋季教师资格认定结果公告，认定通过人员可留意证书领取安排。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://jyj.dazhou.gov.cn/news-show-11101.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>三、舆论热搜（2 条）</h2>\n<p><strong>15. APEC 相关话题霸榜全网：欢迎宴会大合影登微博第一，\"中俄美元首同框\"百度 781 万</strong>\n- 来源：豚榜（全网实时热搜聚合，数据更新 2026-11-19 02:02） / 微博热搜 / 抖音热榜 / 百度热搜\n- 时间：2026-11-19 凌晨（榜单实时）\n- 要点：APEC 会议周话题占满各平台热榜：微博\"APEC 会议来宾欢迎宴会大合影\"居首（28 万）、\"深圳倡议发布\"第二（21 万）；抖音\"APEC 欢迎宴会\"1212 万、\"深圳科创吸引世界目光\"1134 万位列前二；百度\"中俄美元首同框\"781 万居首。知乎热榜\"中俄美三国元首历史上首次面对面会晤\"在列。热搜为实时数据，具体以平台榜单为准。\n- 可信度：中（榜单实时数据，排名随时波动）\n- 原文链接：<a class=\"readlink\" href=\"https://tunbang.com/\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>16. \"两人 58 元买一杯咖啡被拒绝入座\"登微博热搜第一；\"养老保险缴 15 年就能退休\"被辟谣</strong>\n- 来源：豚榜 / 虎扑 / 百度热搜 / 湖北经视\n- 时间：2026-11-18 至 11-19\n- 要点：① 网友发帖称两人买一杯咖啡被店家拒绝入座，经媒体报道后冲上微博热搜第一，当事人称店内\"一客一消\"告示不明显并指商家涉嫌霸王条款，商家则称已明确告知规则，双方说法存在分歧（请核对原文）；② \"养老保险缴够 15 年就能坐等退休\"登上百度热搜（685 万）后被辟谣为不实信息；③ \"北大时期张泉灵美成女儿国国王了\"\"58 岁蔡国庆走秀不慎摔倒\"等娱乐话题同期在榜。\n- 可信度：待核实（消费维权争议双方口径不一，请核对原文）\n- 原文链接：<a class=\"readlink\" href=\"https://voice.hupu.com/bbs/642958041\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>四、电子产品（2 条）</h2>\n<p><strong>17. 英伟达离职后首场全员大会承诺 12 月加薪，董事会接触 Arm CEO 谈继任</strong>\n- 来源：IT之家 / 彭博社 / CNBC / 凤凰网科技\n- 时间：2026-11-19\n- 要点：英伟达在黄仁勋辞职后召开首次全员大会，临时 CEO 科莱特·克雷斯宣布 12 月提前加薪并追加股权激励，比正常调薪周期早数月；董事会主席重申黄仁勋不会回归，公司已聘请猎头评估内外候选人，据彭博社报道已接触 Arm CEO 雷内·哈斯。会前员工提交约 700 个提问，薪酬居首；自离职消息公布以来英伟达股价累计下跌约 13%、市值蒸发约 5000 亿美元。人事与薪酬后续以公司公告为准，请核对原文。\n- 可信度：中（媒体交叉核验；人事表态后续以公司公告为准，请核对原文）\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=MzY4NDUwODUyNA==&amp;mid=2247483759&amp;idx=1&amp;sn=a2c6fa8924091b8bfb2f52449bec57eb\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>18. Anthropic IPO 定价 83 美元、募资逾 944 亿美元；华为 WATCH Air 真机曝光</strong>\n- 来源：IT之家 / 彭博社 /《华尔街日报》\n- 时间：2026-11-19\n- 要点：① Anthropic 将 IPO 发行价定为每股 83 美元，高于 70—78 美元推介区间，公开发行募资约 685 亿美元，加上谷歌、微软、英伟达、AMD 认购的 260 亿美元私募配售，合计超 944 亿美元，超过 SpaceX 成为全球史上最大 IPO，股票今晚登陆纳斯达克、代码 ANT；② 华为 WATCH Air 真机谍照曝光，主打轻薄、方形设计、钛金属表体，预装鸿蒙 HarmonyOS，爆料称续航可达 5 天，官方尚未公布配置（请核对原文）。\n- 可信度：中（IPO 为多信源交叉核验；手表参数为爆料未官宣，请核对原文）\n- 原文链接：<a class=\"readlink\" href=\"https://www.163.com/dy/article/LC2F8IH00511B8LM.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>五、达州本地（政治·民生，2 条）</h2>\n<p><strong>19. 达州市政府与四川省供销合作社联合社签署战略合作协议（政治）</strong>\n- 来源：达州日报 / 达州融媒 / 四川手机报达州党政参考\n- 时间：2026-11-17\n- 要点：11 月 17 日达州市人民政府与四川省供销合作社联合社签署战略合作协议，市委书记童梦、省供销社党组书记及理事会主任出席并致辞，市委副书记、政法委书记主持。双方将在为农综合服务、特色产业发展、物流体系建设、资源开发利用、托底性帮扶等方面开展合作，助力打造新时代更高水平\"天府粮仓\"、推进乡村全面振兴。同期市政协六届第 3 次主席会议召开，研究 2027 年协商计划和工作要点。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.dzrm.cn/cms/a/495340017/content\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>20. 达州城市更新提质提速，高龄津贴\"免申即享\"等民生事项推进（民生）</strong>\n- 来源：达州融媒 / 早安达州 / 达州晚报\n- 时间：2026-11-18 至 11-19\n- 要点：① 达州把危旧房改造、\"握手楼\"综合治理作为城市更新标志性民生工程，通川区姚家大院片区危旧房改造（民生花苑）计划 12 月底全面完工、惠及 420 余户，达川区华西·央境项目 A 区 972 户已提前交房交证；② 自 2026 年 7 月起达州高龄津贴实现\"免申即享\"，通过财政\"一卡通\"直接发放，市民政局就发放范围、标准等常见问题作出回复；③ 达城朝阳西路等人行道新增 128 套休闲座椅，渠县累计清退物业公共收益 183 万元惠及 5 万余户业主；④ 天气：19 日多云 18/5℃，明后两天最低 5—6℃，昼夜温差大注意添衣。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://finance.sina.com.cn/roll/2026-11-19/doc-inizfiwp1110000.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>核查提示</h2>\n<ul>\n<li>本简报仅汇总公开报道要点；APEC 元首外交与国际局势、英伟达人事表态、Anthropic IPO、消费维权争议、热搜榜实时数据及厂商未官宣爆料可能存在后续更新或差异，引用或转发前请点击「原文链接」核对发布时间与原文。</li>\n<li>教育类「国家/省/市」三级均已覆盖（国家 5 / 省 3 / 市 2）；达州本地政治、民生各 1 条，市教育 2 条已并入教育类。</li>\n<li>线上门户地址（每日同步更新）：<a href=\"https://daily-news-briefing-56553.app.workbuddy.host/?sharecode=FDJNV4ARSD\" target=\"_blank\" rel=\"noopener\">daily-news-briefing-56553.app.workbuddy.host/…</a></li>\n</ul>", "2026-11-20": "<h1>每日新闻简报 · 2026-11-20（周五）</h1>\n<blockquote>\n<p>抓取范围：过去 24 小时（2026-11-19 至 2026-11-20 早间）国际国内大事、教育、舆论热搜、电子产品、达州本地政治·民生·教育。\n可信度分级：<strong>高</strong>（官方/权威媒体）｜<strong>中</strong>（主流媒体转载/厂商口径）｜<strong>待核实</strong>（匿名/二手/口径不一，已标注「请核对原文」）。\n总条数：20 条（教育固定 10 条，其中国家 5 / 省 3 / 市 2）。</p>\n</blockquote>\n<hr />\n<h2>一、国际国内大事（4 条）</h2>\n<p><strong>1. 习近平主持 APEC 第三十三次领导人非正式会议并发表重要讲话；中俄美元首会晤发表《和平宣言》</strong>\n- 来源：新华社 / 中新网 / 央视《早啊!新闻来了》\n- 时间：2026-11-19\n- 要点：① 19 日上午国家主席习近平在深圳国际交流中心主持亚太经合组织第三十三次领导人非正式会议，发表题为《建设亚太共同体，续写\"亚太奇迹\"新篇章》的重要讲话，提出坚持和衷共济、开放融通、开拓创新、包容发展四点主张，宣布中方提供 2000 万美元资助 APEC 务实合作、在深圳设立亚太共同体研究中心；② 19 日下午习近平同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤，系三国最高领导人史上首次聚首，围绕\"维护世界和平，促进大国关系战略稳定\"深入讨论约 90 分钟，会后发表《中俄美元首和平宣言》，重申\"核战争打不赢也打不得\"；③ 特朗普表示\"美国不支持'台独'\"，感谢中方热情接待。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.news.cn/world/20261119/8c7c4b3b857343b68ec69445a62c8d93/c.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>2. 职称评审新规明年起施行；我国已知年代最晚直立人化石在广西发现</strong>\n- 来源：央视《早啊!新闻来了》 / 新华社《早知天下事》 /《自然》\n- 时间：2026-11-19\n- 要点：① 人社部近日印发关于修改《职称评审管理暂行规定》的决定，聚焦强化评审监管、加强信用管理、优化评审管理服务，修改 10 条、新增 5 条，自 2027 年 1 月 1 日起施行；② 习近平近日对老龄工作作出重要指示，全国老工委命名 1992 个全国示范性老年友好型社区；③ 工信部等六部门公布新一批 34 家领航级智能工厂培育名单，消费品领域医药、服装企业首次入选；④ 我国迄今已知年代最晚的直立人化石在广西发现，年代距今约 32.4 万年至 18.4 万年，19 日在国际学术期刊《自然》发表，首次在东亚南部亚热带雨林地区确认直立人化石。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://news.qq.com/rain/a/20261120A03JQH00\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>3. 国际金价跌破 3800 美元、A 股成交创年内新低；美联储纪要偏鹰</strong>\n- 来源：中新经纬 / 每日经济新闻 / 腾讯《看世界·新闻早知道》\n- 时间：2026-11-19\n- 要点：① 19 日国际黄金价格跳水，伦敦现货黄金盘中跌破 3700 美元/盎司，上海黄金交易所现货黄金（Au99.99）跌破 800 元/克、一度触及 793.44 元/克；② A 股三大指数 19 日低开低走，沪指报 3577.62 点跌 0.28%、深成指跌 0.71%、创业板指跌 0.79%，两市成交 13051 亿元创年内新低，连续第六个交易日超 4000 股下跌、追平 A 股历史最长纪录；③ 美联储 10 月货币政策会议纪要显示多数官员倾向进一步加息；④ 拼多多发布 2026 年三季度财报，营收 1083 亿元、净利润 295 亿元，股价盘中涨近 13%。\n- 可信度：中（多源交叉核验，市场数据以交易所与官方公告为准）\n- 原文链接：<a class=\"readlink\" href=\"https://news.qq.com/rain/a/20261120A03FEG00\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>4. 国际局势：克里米亚大桥再遭袭、霍尔木兹油轮触雷、丹麦通过涉格陵兰岛协议</strong>\n- 来源：腾讯《国际新闻早知道》 / 新华社 / 央视\n- 时间：2026-11-19\n- 要点：据外媒与权威媒体综合，① 俄罗斯交通部称 18 日夜间无人机袭击后克里米亚大桥铁路段列车通行暂停，为乌方一周内第三次袭击，普京表示遭袭后不再讨论海上停火；② 伊朗军方称 3 艘油轮在霍尔木兹海峡东部触雷起火、并击落一架美军无人机；沙特主导联军称拦截数枚胡塞武装导弹；③ 丹麦议会通过涉格陵兰岛安全防卫协议，允许美国在格陵兰岛设立新的防务区域；④ 韩国大法院对前总统尹锡悦夫人金建希\"三大争议案\"终审判决，判处有期徒刑 4 年、罚款 5000 万韩元。以上境外军事、政治表态口径随局势滚动更新，引用前请核对新华社、央视等权威原文。\n- 可信度：待核实（境外军事/政治口径滚动更新，请核对原文）\n- 原文链接：<a class=\"readlink\" href=\"https://news.qq.com/rain/a/20261120A03FJL00\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>二、教育（10 条，国家 5 / 省 3 / 市 2）</h2>\n<h3>国家（5 条）</h3>\n<p><strong>5. 2027 届全国普通高校毕业生就业创业工作会议召开，毕业生规模预计 1299 万人</strong>\n- 来源：教育部 / 光明日报\n- 时间：2026-11-19\n- 要点：中央教育工作领导小组秘书组、教育部、人社部、工信部、国务院国资委 19 日在京联合召开 2027 届全国普通高校毕业生就业创业工作会议。2027 届高校毕业生规模预计 1299 万人，比 2026 届多 29 万人、再创历史新高。会议部署五方面举措：用好政策\"先手棋\"健全政策支持体系，拿出拓岗\"关键招\"挖掘岗位资源，抓实服务\"着力点\"推动就业服务进校园、创新推进人工智能赋能就业，强化帮困\"兜底策\"落实困难群体结对帮扶，紧盯产业\"风向标\"深化招生培养就业联动联审改革、持续推动校企共建\"微专业\"。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.moe.gov.cn/jyb_zzjg/huodong/202611/t20261119_1458891.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>6. 第六届世界华文教育大会在海南博鳌召开，70 多个国家和地区近 600 名代表参会</strong>\n- 来源：人民日报 / 人民网\n- 时间：2026-11-18 至 11-19\n- 要点：第六届世界华文教育大会 11 月 18 日至 19 日在海南博鳌召开，来自全球 70 多个国家和地区的近 600 名代表围绕\"新格局、新华教、新发展\"主题，总结华文教育发展成效、共商未来发展大计。与会代表表示要推进华文教育标准化、正规化、专业化、信息化建设，发挥融通中外独特优势、讲好中国故事。会前中共中央政治局委员、中央统战部部长李干杰会见全体代表。《人民日报》11 月 20 日 4 版刊发报道。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://m2.people.cn/news/default.html?s=MV8xXzQwODM3Mjg3XzEwMDFfMTc5NTEyNjUyOQ==&amp;from=tencent\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>7. 教育部部署 2027 考研安全工作：报名 347 万人，初试 12 月 19—20 日举行</strong>\n- 来源：教育部 / 教育新闻简报\n- 时间：2026-11-19\n- 要点：教育部部署 2027 年全国硕士研究生招生考试安全工作，研考报名 347 万人，初试定于 12 月 19—20 日举行，多部门联合严打舞弊、加强入场安检。提醒考生远离\"助考骗局\"、诚信应考。同期 2027 年民航招飞启动，广东送培单位缩至北航、中飞院两校，新增深航、九元、京东货运航空；招飞须物理加化学选科、英语单科 100 分以上。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://mp.weixin.qq.com/s?__biz=Mzg2MjYxMTY4Mg==&amp;mid=2247484287&amp;idx=1&amp;sn=5154fe3fd147896fb2d6f9de19f743e9\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>8. 2026 下半年教资面试准考证 11 月 30 日起打印，面试 12 月 5—6 日举行</strong>\n- 来源：教育部教育考试院 / 中国教育在线（NTCE）\n- 时间：2026-11-16 至 11-17（持续提示）\n- 要点：2026 年下半年中小学教师资格面试准考证打印窗口 11 月 30 日开放、12 月 6 日关闭，考生登录中小学教师资格考试网（ntce.neea.edu.cn）\"报名系统\"下载 A4 打印。面试考试 12 月 5—6 日举行，成绩预计 2027 年 1 月 8 日公布。报名系统\"面试准考证\"栏目开放前为空白属系统时间控制、并非故障；各省份开放具体时刻或有差异，以本省面试公告为准。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.eol.cn/kaoshi/gwy/jszg/202611/t20261116_2795070.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>9. 教育部规范涉师投诉为不实举报澄清正名；哲学、体育学两类国家级原创教材首发</strong>\n- 来源：中国青年报 / 教育部官网 / 教育新闻简报\n- 时间：2026-11-18 至 11-19\n- 要点：① 教育部教师工作司明确规范涉师投诉处理程序，要求对不实举报及时澄清、恶意诽谤依法追责，为教师澄清正名；② 教育部集中发布高校哲学、体育学原创系列教材，补齐基础学科优质教材供给短板，新教材更贴合自主知识体系方向；③ 新华日报 11 月 20 日刊文指出，\"人工智能+教育\"融合全面提速的同时，学生作业、考勤、心理测评等敏感数据的安全与制度规范亟须正视，应坚持\"数据不出校门\"与最小必要原则。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://xh.xhby.net/pad/con/202611/20/content_1607902.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>省（3 条）</h3>\n<p><strong>10. 四川 2027 年 1 月普通高中学业水平合格性考试报名结束，考试定档 2027 年 1 月 7—8 日</strong>\n- 来源：四川省教育考试院 / 达州融媒（大竹县报名须知）\n- 时间：报名 2026-11-13 9:00 至 11-17 17:00（已截止）／考试 2027-01-07 至 01-08\n- 要点：根据四川省教育考试院川教考院〔2026〕101 号通知，2027 年 1 月高中学考开考思想政治、物理、语文、数学、外语 5 科，考试安排在 2027 年 1 月 7—8 日；报名已于 11 月 17 日结束，在籍学生、社会人员及同等学力认定人员须在 xk.sceea.cn 完成注册、选科与缴费，缴费成功方视为报名成功。同期四川 2027 年高考报名已结束、转入资格审查。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.dzrm.cn/cms/a/495000130/content\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>11. 四川 2027 年戏曲类本科专业省际联考（川剧）报名 11 月 21 日启动</strong>\n- 来源：四川省教育考试院\n- 时间：报名 2026-11-21 9:00 至 12-04 21:00／考试 2027-01-05 起\n- 要点：四川省教育考试院发布 2027 年普通高等学校戏曲类专业（川剧）省际联考安排，成都艺术职业大学成为戏曲表演—川剧、音乐表演（戏曲音乐）—川剧本科专业省际联考考点。网上报名及缴费 11 月 21 日 9:00 至 12 月 4 日 21:00，报名费每生每次 200 元，可通过\"艺术升\"APP 办理；专业考试 2027 年 1 月 5 日开始、不设初复试。实行省际联考后招生高校不再组织其他考试，未参加联考者不能参加戏曲类专业录取。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.sceea.cn/Html/202611/Newsdetail_5031.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>12. 四川\"十五五\"将大力推广\"校企双导师\"\"订单式\"\"项目式\"人才培养模式</strong>\n- 来源：四川省教育厅 / 达州融媒《早安达州》\n- 时间：2026-11-20\n- 要点：据《早安达州》11 月 20 日报道，\"十五五\"时期四川将围绕高校如何培育服务重点产业链发展的创新人才，大力推广\"校企双导师\"\"订单式\"\"项目式\"等培养模式，推动人才培养与重点产业链需求对接。另据省统计局 11 月 17 日数据，2026 年 1—10 月全省规模以上工业增加值同比增长 6.8%、产品销售率 95.5%，为产教融合提供产业支撑。\n- 可信度：中（省级媒体报道，具体政策以省教育厅文件为准）\n- 原文链接：<a class=\"readlink\" href=\"https://finance.sina.com.cn/roll/2026-11-20/doc-inizinvq7373003.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>市（2 条）</h3>\n<p><strong>13. 达州市 2026 年下半年公开考试招聘事业单位工作人员 346 名，教师岗约 95 名，今日起报名</strong>\n- 来源：四川省人力资源和社会保障厅 / 达州市人民政府\n- 时间：报名 2026-11-20 9:00 至 11-27 18:00／笔试 2026-12-26 至 12-27\n- 要点：达州市决定面向社会公开考试招聘事业单位工作人员 346 名（其中教师岗约 95 名），聘用人员纳入事业单位编制管理。网络报名 11 月 20 日 9:00 至 11 月 27 日 18:00，报名网站为四川省人社厅官网\"人事考试\"专栏（scpta.com.cn）；资格初审 11 月 28 日 18:00 前查询，缴费 11 月 30 日 18:00 前完成，准考证 12 月 22—25 日打印，笔试 12 月 26—27 日。本次新增\"重庆市中心城区\"考点供仅参加公共科目笔试的考生选择；在编教师报考前须征得所在学校同意。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://jiaoshi.huatu.com/2026/1119/2878483.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>14. 达州老年教育扩容：首届\"银龄风采\"大赛举行，近两年 参数与时间表以官方发布为准）\n- 原文链接：<a class=\"readlink\" href=\"https://www.163.com/dy/article/LC5LM19F0512B07B.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>18. Q3 欧洲智能手机出货同比下滑 18% 创 13 年新低；微软英伟达升级云 PC</strong>\n- 来源：IT之家 / Counterpoint Research\n- 时间：2026-11-20\n- 要点：① Counterpoint 报告显示 2026 年第三季度欧洲智能手机出货量同比下滑 18%，创逾 13 年最低季度总量，上游零部件成本上涨推高售价、厂商缩减促销为主因；三星 Galaxy Z Fold8 成西欧销量最快折叠屏，苹果首款折叠屏 iPhone Duo 10 月才上架、基础款要到 2027 年一季度，苹果欧洲出货量自 2024 年一季度以来首次同比下滑；② 微软在 Ignite 2026 宣布携手英伟达升级云 PC，为 GPU 加速的 Windows 365 引入 Direct Stream 低延迟图形传输，最多支持两路 60 帧 4K 画面，公开预览预计 2027 年初推出，并发布 Nemotron 3.5 系列模型。\n- 可信度：中（研究机构与厂商口径，请核对原文）\n- 原文链接：<a class=\"readlink\" href=\"https://www.ithome.com/1/029/744.htm\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>五、达州本地（政治·民生，2 条）</h2>\n<p><strong>19. 市委常委会召开会议传达学习中央、省会议精神；童梦在四川文理学院讲授专题思政课（政治）</strong>\n- 来源：达州市人民政府网 / 达州融媒 / 四川手机报达州党政参考\n- 时间：2026-11-18\n- 要点：① 11 月 18 日市委常委会召开会议，市委书记童梦主持，传达学习习近平总书记在纪念孙中山先生诞辰 160 周年大会上的重要讲话、在广东中山考察时的重要讲话精神和中央、省有关会议精神，研究贯彻落实意见，强调扎实做好岁末年初各项工作、千方百计扩内需强产业惠民生防风险，确保完成全年主要目标任务、实现\"十五五\"良好开局；② 同日童梦前往四川文理学院为师生讲授专题思政课，宣讲党的二十届五中全会和市第六次党代会精神，强调全市青年学生要树立远大志向、勇担时代重任，四川文理学院、达州职业技术学院、达州中医药职业学院要落实立德树人根本任务、办出特色。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.dazhou.gov.cn/news-show-273188.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>20. 达州城市更新提速、养老服务提质，绕西高速铁山特长隧道掘进突破 3000 米（民生）</strong>\n- 来源：达州融媒 / 早安达州 / 达州日报\n- 时间：2026-11-19 至 11-20\n- 要点：① 通川区姚家大院片区危旧房改造（民生花苑）所有楼栋主体及室内抹灰已完成，室内公共区域装修完成 60%、外墙保温完成 90%，建成后惠及 420 余户；达川区华西·央境项目 A 区 6 栋 972 户已全部提前交房交证，项目总投资 18 亿元、建成后满足 2365 户家庭居住需求；② 达州聚焦老年群体急难愁盼，通川区朝阳街道马房坝社区入选全国示范性老年友好型社区，全市城乡养老服务阵地持续建强；③ 四季度绕西高速全线重点控制性工程铁山特长隧道单洞掘进突破 3000 米大关、提前达成目标；达川区 X163 管村至罐子段约 4 公里路段完成沥青铺筑、提前恢复通行，打通沿线 2.11 万亩柑橘外运通道；④ 天气：20 日多云间晴，最高 17—18℃、最低 3—7℃。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://finance.sina.com.cn/roll/2026-11-20/doc-inizinvq7373003.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>核查提示</h2>\n<ul>\n<li>本简报仅汇总公开报道要点；APEC 元首外交与国共俄美三方会晤成果、国际局势（克里米亚大桥/霍尔木兹/格陵兰）、消费争议、热搜榜实时数据及厂商未官宣爆料可能存在后续更新或差异，引用或转发前请点击「原文链接」核对发布时间与原文。</li>\n<li>教育类「国家/省/市」三级均已覆盖（国家 5 / 省 3 / 市 2）；达州本地政治、民生各 1 条，市教育 2 条已并入教育类。</li>\n<li>线上门户地址（每日同步更新）：<a href=\"https://daily-news-briefing-56553.app.workbuddy.host/?sharecode=FDJNV4ARSD\" target=\"_blank\" rel=\"noopener\">daily-news-briefing-56553.app.workbuddy.host/…</a></li>\n</ul>", "2026-11-21": "<h1>每日新闻简报 · 2026-11-21（周六）</h1>\n<blockquote>\n<p>抓取范围：过去 24 小时（2026-11-20 至 2026-11-21 早间）国际国内大事、教育、舆论热搜、电子产品、达州本地政治·民生·教育。\n可信度分级：<strong>高</strong>（官方/权威媒体）｜<strong>中</strong>（主流媒体转载/厂商口径）｜<strong>待核实</strong>（匿名/二手/口径不一，已标注「请核对原文」）。\n总条数：20 条（教育固定 10 条，其中国家 5 / 省 3 / 市 2）。</p>\n</blockquote>\n<hr />\n<h2>一、国际国内大事（4 条）</h2>\n<p><strong>1. 习近平在深圳会见五国领导人；外交部就日方涉台最新表态提出严正交涉</strong>\n- 来源：央视《早啊!新闻来了》 / 新华社 / 外交部例行记者会\n- 时间：2026-11-20\n- 要点：① 20 日国家主席习近平在深圳分别会见来华出席 APEC 领导人非正式会议的印度尼西亚总统普拉博沃、澳大利亚总理阿尔巴尼斯、新加坡总理黄循财、泰国总理阿努廷、马来西亚总理安瓦尔；② 针对日本首相高市早苗在 APEC 记者会上称日方在台湾问题上基本立场与 1972 年《中日联合声明》一致，外交部发言人郭嘉昆 20 日回应：恪守中日四个政治文件是日方必须履行的政治责任和法律义务，当前紧迫的是在台湾问题上尽快纠正错误言行，重要的是在历史问题上采取正确态度；③ 2026 年度中美海上军事安全磋商机制第二次工作小组会议和年度会晤 18—20 日在上海举行。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&amp;item_id=4518379311686556729&amp;channelId=1119\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>2. 前 10 月全国一般公共预算收入 19.57 万亿元增 4.9%；充电设施达 2539.1 万个</strong>\n- 来源：财政部 / 国家能源局 / 国家邮政局 / 腾讯《看世界·新闻早知道》\n- 时间：2026-11-20\n- 要点：① 财政部数据：1—10 月全国一般公共预算收入 195671 亿元，同比增长 4.9%；② 国家能源局：截至 10 月底全国电动汽车充电基础设施（枪）总数 2539.1 万个，同比增长 36.2%；③ 国家邮政局：1—10 月邮政行业寄递业务量累计 1830.3 亿件、同比增长 3.3%，业务收入 15485.7 亿元、增长 5.3%；④ 证券监管部门与公安机关公布 4 起编造传播资本市场虚假信息典型案例；⑤ 前三季度数字产业收入超 32 万亿元、同比增长 14.8%。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://news.qq.com/rain/a/20261121A03A2H00\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>3. 我国实现 6G 频段最高码速率无线通信验证；发现亚洲已知最古老岩石</strong>\n- 来源：中新网浙江《一句话看世界》 / 自然资源部 / 央视《新闻直播间》\n- 时间：2026-11-20 至 11-21\n- 要点：① 我国实现 6G 频段最高码速率无线通信验证，刷新纪录；② 地质工作者在河北卢龙县发现距今 39.5 亿年古老岩石，为目前我国乃至亚洲已知最古老岩石；③ 国际丝绸组织 20 日正式成立，系中国倡议发起、总部设在中国的首个纺织领域国际科技组织；④ 国家林草局等五部门印发办法，国家公园每五年开展一次「生态体检」；⑤ 依托全国产十万卡 AI 超集群「曙光 8000（登峰）」的量子化学计算项目获 2026 年 ACM 戈登·贝尔奖。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.zj.chinanews.com/jzkzj/2026-11-21/detail-ihfneeui9567863.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>4. 国际局势：美披露伊朗战事耗资超 480 亿美元；联合国秘书长遴选第九轮投票</strong>\n- 来源：中新网《一句话看世界》 / 新华社《早知天下事》 / 参考消息\n- 时间：2026-11-20\n- 要点：据外媒与权威媒体综合：① 美媒披露截至 11 月 13 日评估，美国已为伊朗战事花费 483 亿美元，不含中东美军基地遇袭损失；特朗普 19 日称新年前不会就伊朗下一步行动「仓促」决定；② 联合国安理会 20 日就下一任秘书长遴选举行第九轮意向性投票；③ 法国保险业联合会称 10 月骚乱造成至少 2.07 亿欧元财产损失；④ 日本 4.7 万名民众联合签名递交防卫省反对拥有核动力潜艇，东京 20 日万人集会抗议高市政权政策；⑤ 日经股指一度跌超 3000 点。境外军事、政治与局势数据随事态滚动更新，引用前请核对新华社、央视等权威原文。\n- 可信度：待核实（境外军事/政治口径滚动更新，请核对原文）\n- 原文链接：<a class=\"readlink\" href=\"https://so.html5.qq.com/page/real/search_news?docid=70000021_9286b00d0e286252\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<hr />\n<h2>二、教育（10 条，国家 5 / 省 3 / 市 2）</h2>\n<h3>国家（5 条）</h3>\n<p><strong>5. 教育部、中央网信办启动第九届全国大学生网络文化节，作品征集至 2027 年 3 月 15 日</strong>\n- 来源：教育部官网（教思政厅函〔2026〕25 号）\n- 时间：2026-11-20\n- 要点：教育部办公厅、中央网信办秘书局 20 日发布通知，联合举办第九届全国大学生网络文化节和全国高校网络教育优秀作品推选展示活动，主题为「争做校园好网民，汇聚网络正能量，踔厉奋发建新功」。文化节面向高校全日制在校生设光影趣青春、数智新技艺等 8 个赛道；作品推选面向高校教师，征集优秀网络文章、工作案例、微课、新媒体作品及「AI+思政」作品 5 类。作品征集即日起至 2027 年 3 月 15 日，可采用自荐、部属高校推荐、省级教育行政部门推荐三种方式。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.moe.gov.cn/srcsite/A12/s7060/202611/t20261120_1459001.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>6. 国开行完成 2026 年度国家助学贷款发放：753 万名困难学生、1163 亿元</strong>\n- 来源：中国教育报 / 中国教育新闻网 / 新华社\n- 时间：2026-11-20\n- 要点：国家开发银行已全面完成所承办的 2026 年度国家助学贷款发放，共向 753 万名家庭经济困难学生发放 1163 亿元，学生可通过在线系统或手机客户端查询。本专科生每年最高可贷 2 万元、研究生 2.5 万元，利率为五年期 LPR 减 70 个基点，期限按学制加 15 年、最长 22 年；在校期间利息全部由财政承担，毕业后有 5 年还本宽限期。今年新增生源地信用助学贷款共同借款人远程授权功能，实现「家长线上办、学生现场签」。国开行累计发放助学贷款 6768 亿元、支持 7125 万人次。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://www.jyb.cn/rmtzcg/xwy/wzxw/202611/t20261120_2111544899.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>7. 《新华日报》关注「人工智能+教育」：数据安全与算法依赖三重隐忧待解</strong>\n- 来源：新华日报\n- 时间：2026-11-20\n- 要点：文章指出，教育部等五部门今年 4 月印发《「人工智能+教育」行动计划》后，智能批改、学情分析、课后答疑、课堂伴学加速进入课堂，清华附小 AI 垂直模型、南京金陵中学实验小学「1+4+N」智能体矩阵、云南机电职院自适应学习体系等为一线样本。评论同时提出三重隐忧：学生作业、考勤、心理测评等敏感数据安全，目前明确「数据不出校门」的建设原则仍属少数；技术逻辑僭越教育逻辑可能削弱教师育人主体责任；算法推荐可能弱化学生自主思考与批判判断。强调成效取决于技术与教学法的匹配程度。\n- 可信度：高（党报评论，观点性内容）\n- 原文链接：<a class=\"readlink\" href=\"https://xh.xhby.net/pad/con/202611/20/content_1607902.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>8. 2026「外研社·国才杯」「理解当代中国」全国大学生外语能力大赛国赛开幕</strong>\n- 来源：外研社 / 教育部高等教育司\n- 时间：2026-11-20\n- 要点：国赛 20 日线上开幕，教育部高教司副司长武世兴指出，今年参赛规模再创新高、专业融合更紧密、产教协同不断拓展，大赛已成为纵深推进「三进」的重要平台；要求深化价值引领、聚焦实战能力、汇聚育人力量、转化赛事成果并严守纪律规矩。北京外国语大学校长贾文键介绍，2026 年大赛以赛题引导学生参与国际传播、增进文明互鉴，优秀作品反哺课堂教学。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.fltrp.com/c/2026-11-20/545165.shtml\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>9. 巩金龙任北京化工大学校长；教育部教育质量评估中心公开招聘工作人员</strong>\n- 来源：中国教育报 / 教育部教育质量评估中心\n- 时间：2026-11-20\n- 要点：① 11 月 18 日教育部党组在北京化工大学宣布任免决定，巩金龙任校长、党委副书记，谭天伟不再担任；教育部副部长、总督学王嘉毅出席。《中国教育报》11 月 20 日 2 版报道。② 教育部教育质量评估中心 20 日发布 2026 年面向社会公开招聘公告（非事业编制），岗位须经笔试、面试、实习考察、体检与公示，报名细节见公告原文。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"http://www.jyb.cn/rmtzgjyb/202611/t20261120_2111544440.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<h3>省（3 条）</h3>\n<p><strong>10. 四川 2026 下半年自考毕业申请 12 月 2—10 日受理，审定费 30 元/人</strong>\n- 来源：四川省教育考试院\n- 时间：2026-11-20\n- 要点：省教育考试院 20 日发布通告，2026 年下半年高等教育自学考试毕业申请与前置学历验证申请同期进行，提交时间为 12 月 2 日 9:00 至 10 日 17:00，逾期不受理。专升本考生须先完成前置学历验证；毕业申请含资格预审、照片核验、短信验证、身份证上传、缴费等环节，毕业审定费 30 元/人。初审 12 月 2—25 日可实时查询，审核不通过者须在 12 月 25 日 11:00 前重新提交。考生应对信息真实性负责，禁止培训机构或学校代为操作。\n- 可信度：高\n- 原文链接：<a class=\"readlink\" href=\"https://www.sceea.cn/Html/202611/Newsdetail_5032.html\" target=\"_blank\" rel=\"noopener\">阅读原文 ↗</a></p>\n<p><strong>11. 2027 年川剧省际联考 11 月 21 日起报名，2027 年 1 月 5 日在成都开考</s const dates = Object.keys(BRIEFINGS).sort();
const latest = dates[dates.length-1] || "";
let viewY, viewM; // 当前查看的年月(1-12)

function ymd(str){const [y,m,d]=str.split('-').map(Number);return {y,m,d};}

function renderContent(date){
  const c = document.getElementById('content');
  if(!date || !BRIEFINGS[date]){ c.innerHTML = '<div class="empty">该日期暂无简报。</div>'; return; }
  c.innerHTML = BRIEFINGS[date];
  // 给有标记的中括号标签加样式
  c.querySelectorAll('h3').forEach(h=>{
    const t = h.textContent;
    const i = t.lastIndexOf('['), j = t.lastIndexOf(']');
    if(i>=0 && j===t.length-1 && j>i){
      const s=document.createElement('span'); s.className='badge'; s.textContent=t.slice(i+1,j);
      h.appendChild(s);
    }
  });
  c.scrollTop = 0;
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderCalendar(){
  const daysEl = document.getElementById('days');
  const titleEl = document.getElementById('calTitle');
  daysEl.innerHTML = '';
  titleEl.textContent = viewY + '年' + viewM + '月';
  const first = new Date(viewY, viewM-1, 1);
  let lead = (first.getDay()+6)%7; // 周一为起点
  const daysInMonth = new Date(viewY, viewM, 0).getDate();
  for(let i=0;i<lead;i++){ const e=document.createElement('div'); e.className='day blank'; daysEl.appendChild(e); }
  for(let d=1; d<=daysInMonth; d++){
    const e=document.createElement('div'); e.className='day'; e.textContent=d;
    const key = viewY+'-'+String(viewM).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    if(BRIEFINGS[key]){
      e.className += ' has';
      if(key===current) e.className += ' sel';
      e.title = key + ' 简报';
      e.onclick = ()=>{ current=key; renderContent(key); renderCalendar();
                        // 手机端选完日期自动收起日历并回到顶部
                        const aside=document.querySelector('aside.panel');
                        if(aside) aside.classList.remove('open');
                        window.scrollTo({top:0,behavior:'smooth'}); };
    }
    daysEl.appendChild(e);
  }
  // 导航边界
  const minM = dates[0].slice(0,7), maxM = dates[dates.length-1].slice(0,7);
  const cur = viewY+'-'+String(viewM).padStart(2,'0');
  document.getElementById('prev').disabled = cur <= minM;
  document.getElementById('next').disabled = cur >= maxM;
}

let current = latest;
function gotoMonthOf(dateStr){
  const o = ymd(dateStr); viewY=o.y; viewM=o.m;
}
gotoMonthOf(current);
renderContent(current);
renderCalendar();

document.getElementById('prev').onclick = ()=>{ if(viewM===1){viewM=12;viewY--;}else{viewM--;} renderCalendar(); };
document.getElementById('next').onclick = ()=>{ if(viewM===12){viewM=1;viewY++;}else{viewM++;} renderCalendar(); };
document.getElementById('calToggle').onclick = ()=>{
  const aside=document.querySelector('aside.panel');
  aside.classList.toggle('open');
  if(aside.classList.contains('open')) aside.scrollIntoView({behavior:'smooth'});
};
